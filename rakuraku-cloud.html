<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>訪問美容 楽々アプリ（クラウド版・STEP2）</title>
<style>
  :root{ --accent:#1d9e75; --accent-soft:#e7f5ee; --accent-text:#147a59; --line:#e5e7e6; --bg:#f4f6f5; --surface:#fff; --text:#1f2624; --muted:#6b7572; --hint:#9aa39f; --danger:#c0392b; --radius:14px; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,"Hiragino Sans",sans-serif; background:var(--bg); color:var(--text);}
  .wrap{max-width:480px; margin:0 auto; padding:18px 16px 40px;}
  h1{font-size:20px; text-align:center; margin:18px 0 4px;}
  .sub{text-align:center; color:var(--muted); font-size:13px; margin-bottom:18px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px;}
  label{display:block; font-size:13px; color:var(--muted); margin:10px 0 4px;}
  input{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px;}
  select{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; background:var(--surface);}
  .chk-wrap{display:flex; flex-wrap:wrap; gap:6px; margin-top:3px;}
  .chk{display:inline-flex; align-items:center; gap:5px; padding:8px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:var(--surface); cursor:pointer;}
  .chk input{width:auto;}
  .price-row{display:flex; gap:6px; margin-top:6px; align-items:center;}
  .price-row .cf_pname{flex:2;} .price-row .cf_pprice{flex:1;}
  .price-row .px{flex:0 0 38px; height:42px; border:1px solid var(--line); background:var(--surface); border-radius:10px; color:var(--muted); font-size:18px; cursor:pointer;}
  .dash-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-top:1px solid #cbe7da; font-size:14px;}
  .mbtn{width:34px; height:34px; border:1px solid #cbe7da; background:var(--surface); border-radius:9px; font-size:18px; color:var(--accent-text); cursor:pointer;}
  .ba-row{border:1px solid var(--line); border-radius:10px; padding:9px 11px; margin-bottom:7px; background:var(--surface);}
  .ba-row.on{border-color:var(--accent); background:var(--accent-soft);}
  .ba-row .chk{border:none; background:none; padding:0; font-size:15px;}
  .btn{display:block; width:100%; padding:12px; border:none; border-radius:12px; font-size:15px; font-weight:600; margin-top:12px; cursor:pointer;}
  .btn.primary{background:var(--accent); color:#fff;}
  .btn.ghost{background:var(--surface); border:1px solid var(--line); color:var(--text);}
  .btn.danger{background:#fbeaea; color:var(--danger);}
  .row{display:flex; gap:8px;}
  .row .btn{margin-top:0;}
  .tag{display:inline-block; font-size:12px; padding:2px 10px; border-radius:14px; background:var(--accent-soft); color:var(--accent-text); font-weight:600;}
  .tag.member{background:#eef1f0; color:var(--muted);}
  .msg{font-size:13px; padding:9px 12px; border-radius:10px; margin-top:10px;}
  .msg.err{background:#fbeaea; color:var(--danger);}
  .msg.ok{background:var(--accent-soft); color:var(--accent-text);}
  .ent{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:14px;}
  .ent .who{font-size:11px; color:var(--hint);}
  .cl-row{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:7px; font-size:15px; cursor:pointer;}
  .cl-row:active{background:var(--bg);}
  .mini{margin-top:8px; padding:7px 12px; border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent-text); border-radius:9px; font-size:13px; font-weight:600; cursor:pointer;}
  .code{font-family:monospace; font-size:12px; background:var(--bg); padding:3px 7px; border-radius:6px; word-break:break-all;}
  .muted{color:var(--muted); font-size:13px;}
  .sec{font-size:13px; font-weight:700; color:var(--muted); margin:18px 4px 8px;}
  .seg-wrap{display:flex; background:var(--bg); border-radius:12px; padding:3px; margin-bottom:12px;}
  .seg{flex:1; border:none; background:none; padding:10px; border-radius:9px; font-size:15px; font-weight:700; color:var(--muted); cursor:pointer;}
  .seg.on{background:var(--surface); color:var(--accent-text); box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .warn{background:#fff7e6; border:1px solid #f0d9a8; color:#8a6d2f; font-size:13px; line-height:1.6; padding:10px 12px; border-radius:10px; margin-top:10px;}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(10px); background:#1f2624; color:#fff; font-size:14px; font-weight:600; padding:11px 18px; border-radius:22px; box-shadow:0 4px 16px rgba(0,0,0,.25); opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:9999; max-width:90%;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card">読み込み中…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== 接続設定（このプロジェクト専用） ===== */
var SUPABASE_URL = "https://dhgjaxhhdyxplnmubmvg.supabase.co";
var SUPABASE_KEY = "sb_publishable_l1en0JjWFODzDm5VtnvpHg_fZDfmJ4K";
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var APP = document.getElementById("app");
var ME = null;       // auth user
var PROFILE = null;  // {id, org_id, name, role}

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function el(id){ return document.getElementById(id); }

/* ===== 起動：セッション確認 → 画面振り分け ===== */
async function boot(){
  var s = await sb.auth.getSession();
  ME = s.data.session ? s.data.session.user : null;
  if(!ME){ renderAuth(); return; }
  await loadProfile();
  if(!PROFILE){ renderOnboard(); return; }
  renderHome();
}
async function loadProfile(){
  var r = await sb.from("profiles").select("*").eq("id", ME.id).maybeSingle();
  PROFILE = r.data || null;
}

/* ===== ① ログイン / 新規登録（タブで切替） ===== */
function setAuthMode(m){ var e=el("email"),p=el("pw"); if(e)window._authEmail=e.value; if(p)window._authPw=p.value; window._authMode=m; renderAuth(); }
function renderAuth(){
  var mode = window._authMode || "signin";
  var signup = (mode==="signup");
  APP.innerHTML =
    '<h1>訪問美容 楽々アプリ</h1><div class="sub">クラウド版（STEP1）</div>'+
    '<div class="card">'+
    '<div class="seg-wrap">'+
      '<button class="seg'+(signup?"":" on")+'" onclick="setAuthMode(\'signin\')">ログイン</button>'+
      '<button class="seg'+(signup?" on":"")+'" onclick="setAuthMode(\'signup\')">新規登録</button>'+
    '</div>'+
    '<div style="font-size:13px;color:var(--muted);margin-bottom:4px;">'+(signup?"はじめての方。登録後に「組織を作る／参加する」を選びます。":"アカウントをお持ちの方。")+'</div>'+
    '<label>メールアドレス</label><input id="email" type="email" autocomplete="username" placeholder="you@example.com" value="'+esc(window._authEmail||"")+'">'+
    '<label>パスワード</label><input id="pw" type="password" autocomplete="'+(signup?"new-password":"current-password")+'" placeholder="6文字以上" value="'+esc(window._authPw||"")+'">'+
    (signup?'<div class="warn">⚠️ この<b>メールとパスワード</b>は、次回からのログインに必要です。<br>必ずメモや写真などで控えてください（忘れると入れなくなります）。</div>':'')+
    '<button class="btn primary" onclick="'+(signup?"doSignUp()":"doSignIn()")+'">'+(signup?"この内容で登録する":"ログイン")+'</button>'+
    '<div id="m"></div>'+
    '</div>'+
    '<div class="muted" style="text-align:center;">運営の方：新規登録 → 組織を作成。<br>メンバー：新規登録 → 組織コードで参加。</div>';
}
function showMsg(html, kind){ var m=el("m"); if(m) m.innerHTML='<div class="msg '+(kind||"err")+'">'+html+'</div>'; }
async function doSignUp(){
  var email=el("email").value.trim(), pw=el("pw").value;
  if(!email||pw.length<6){ showMsg("メールと6文字以上のパスワードを入力してください"); return; }
  showMsg("登録中…","ok");
  var r = await sb.auth.signUp({ email:email, password:pw });
  if(r.error){ showMsg("登録エラー："+esc(r.error.message)); return; }
  if(!r.data.session){ showMsg("⚠️ メール確認が「オン」のため、このまま進めません。<br>Supabaseで <b>メール確認をオフ</b> にするか、運営が <b>Add user（Auto Confirm）</b> でアカウントを作ってください。"); return; }
  ME = r.data.user; PROFILE=null; renderOnboard();
}
async function doSignIn(){
  var email=el("email").value.trim(), pw=el("pw").value;
  if(!email||!pw){ showMsg("メールとパスワードを入力してください"); return; }
  showMsg("ログイン中…","ok");
  var r = await sb.auth.signInWithPassword({ email:email, password:pw });
  if(r.error){ showMsg("ログインエラー："+esc(r.error.message)); return; }
  ME = r.data.user; await loadProfile();
  if(!PROFILE) renderOnboard(); else renderHome();
}

/* ===== ② 初回オンボーディング（組織を作る / 参加する） ===== */
function renderOnboard(){
  APP.innerHTML =
    '<h1>はじめての設定</h1><div class="sub">'+esc(ME.email)+'</div>'+
    '<div class="card">'+
    '<label>お名前（表示名）</label><input id="nm" placeholder="例）高村">'+
    // メンバー＝主たる導線（運営からコードをもらって参加）
    '<div class="card" style="background:var(--accent-soft);border-color:#cfe9dd;margin-top:14px;">'+
      '<b>👥 組織に参加する</b>'+
      '<div style="font-size:12px;color:var(--muted);margin:2px 0 6px;">運営からもらった<b>組織コード</b>を入力してください。</div>'+
      '<label>組織コード</label><input id="orgcode" placeholder="xxxxxxxx-xxxx-...">'+
      '<button class="btn primary" onclick="joinOrg()">この組織に参加する</button>'+
    '</div>'+
    // 運営＝最初の登録のときだけ（控えめに折りたたみ）
    '<details style="margin-top:10px;"><summary style="font-size:13px;color:var(--muted);cursor:pointer;padding:4px;">＋ 新しく組織を作る（運営の方・いちばん最初の登録）</summary>'+
      '<div class="card" style="margin-top:8px;">'+
        '<div style="font-size:12px;color:var(--muted);margin-bottom:6px;">※ 既にある組織に入る方は上の「参加」を使ってください。</div>'+
        '<label>組織名</label><input id="orgname" placeholder="例）i hair">'+
        '<button class="btn ghost" onclick="createOrg()">この組織を作って運営になる</button>'+
      '</div>'+
    '</details>'+
    '<div id="m"></div>'+
    '<button class="btn danger" onclick="doSignOut()" style="margin-top:14px;">ログアウト</button>'+
    '</div>';
}
async function createOrg(){
  var nm=el("nm").value.trim(), on=el("orgname").value.trim();
  if(!nm){ showMsg("お名前を入力してください"); return; }
  showMsg("作成中…","ok");
  var r = await sb.rpc("create_org_and_join", { org_name:on, display_name:nm });
  if(r.error){ showMsg("組織作成エラー："+esc(r.error.message)); return; }
  await loadProfile();
  if(!PROFILE){ showMsg("作成後の読み込みに失敗しました"); return; }
  renderHome();
}
async function joinOrg(){
  var nm=el("nm").value.trim(), code=el("orgcode").value.trim();
  if(!nm||!code){ showMsg("お名前と組織コードを入力してください"); return; }
  showMsg("参加中…","ok");
  var r = await sb.rpc("join_org", { code:code, display_name:nm });
  if(r.error){ showMsg("参加エラー（コードが正しいか確認）："+esc(r.error.message)); return; }
  await loadProfile();
  if(!PROFILE){ showMsg("参加後の読み込みに失敗しました"); return; }
  renderHome();
}

/* ===== ③ ホーム（役割で見え方が変わる） ===== */
async function renderHome(){
  var isOwner = PROFILE.role==="owner";
  APP.innerHTML =
    '<h1>ようこそ、'+esc(PROFILE.name)+' さん</h1>'+
    '<div class="sub"><span class="tag '+(isOwner?"":"member")+'">'+(isOwner?"運営（経営者）":"メンバー")+'</span></div>'+
    '<div style="text-align:center;margin-bottom:12px;"><button class="mini" onclick="renderHome();window.scrollTo(0,0);" style="margin-top:0;">🏠 ホーム（最新に更新）</button></div>'+
    (isOwner?('<button class="btn ghost" onclick="toggleInvite()">👥 メンバーを招待する</button><div id="inviteBox"></div>'):"")+
    (isOwner?'<div id="dashBox"></div>':"")+
    '<div class="sec">顧客・施設の登録（台帳）</div>'+
    '<div class="muted" style="font-size:12px;margin:-4px 4px 8px;">契約している施設や、よく行くお客様を <b>先に登録</b> しておく場所です。ここに入れておくと、予約・売上のときにすぐ選べます（組織で共有）。</div>'+
    '<div class="row" style="gap:8px;"><button class="btn primary" onclick="openClientForm(null,\'個人\')">＋ 個人を登録</button><button class="btn primary" onclick="openClientForm(null,\'施設\')">＋ 施設・訪問先を登録</button></div>'+
    '<div id="cform"></div>'+
    '<div id="clientsBox" style="margin-top:10px;"><div class="muted">読み込み中…</div></div>'+
    '<div class="sec">予約'+(isOwner?"（全員分）":"（自分の担当分）")+'</div>'+
    '<button class="btn primary" onclick="openBookingStart()">＋ 予約を作る</button>'+
    '<div id="bform"></div>'+
    '<div id="bookingsBox" style="margin-top:10px;"><div class="muted">読み込み中…</div></div>'+
    '<div class="sec">売上・カルテ'+(isOwner?"（全員分）":"（自分の担当分）")+'</div>'+
    '<button class="btn primary" onclick="openRecordForm(null)">＋ 売上を記録</button>'+
    '<div id="rform"></div>'+
    '<div id="recordsBox" style="margin-top:10px;"><div class="muted">読み込み中…</div></div>'+
    (isOwner?('<details style="margin-top:24px;"><summary style="cursor:pointer;color:var(--hint);font-size:13px;text-align:center;list-style:none;">⚙️ 設定・データ管理</summary>'+
      '<button class="btn danger" onclick="resetAllData()" style="margin-top:12px;">🧹 データをすべてリセット</button>'+
      '<div class="muted" style="font-size:12px;text-align:center;">テスト用データ（顧客・予約・売上）を全部消して、本番を始めるとき用。元に戻せません。</div>'+
      '</details>'):"")+
    '<button class="btn ghost" onclick="doSignOut()" style="margin-top:26px;color:var(--hint);font-weight:500;">ログアウト</button>'+
    '<div class="muted" style="text-align:center;margin-top:10px;">STEP2：顧客・予約・売上をクラウドで共有。</div>';
  await loadMembers();
  await loadClients();
  await loadBookings();
  await loadRecords();
  renderDashboard();
  subscribeRealtime();
}
// 組織のメンバー名簿（担当選択に使う）
var MEMBERS=[];
async function loadMembers(){
  var r = await sb.from("profiles").select("id,name,role");
  MEMBERS = r.error ? [] : (r.data||[]);
}
function memberName(uid){ var m=MEMBERS.find(function(x){return x.id===uid;}); return m?m.name:"?"; }
// ===== 運営ダッシュボード（把握用の集計） =====
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function curMonth(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function shiftMonth(ym, delta){
  var p=ym.split("-"); var d=new Date(+p[0], +p[1]-1+delta, 1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function dashChangeMonth(delta){ window.DASH_MONTH=shiftMonth(window.DASH_MONTH||curMonth(), delta); renderDashboard(); }
function renderDashboard(){
  var box=el("dashBox"); if(!box) return;               // 運営のみ枠が存在
  if(!PROFILE || PROFILE.role!=="owner") return;
  var month=window.DASH_MONTH||curMonth();
  var p=month.split("-"); var monthLabel=(+p[0])+"年"+(+p[1])+"月";
  // 当月の売上をメンバー別に集計
  var recs=RC.filter(function(r){ return (r.date||"").slice(0,7)===month; });
  var byStaff={}, total=0;
  recs.forEach(function(r){
    var k=r.staff_id||"?"; if(!byStaff[k]) byStaff[k]={sum:0,cnt:0};
    byStaff[k].sum+=r.amount||0; byStaff[k].cnt++; total+=r.amount||0;
  });
  var staffKeys=Object.keys(byStaff).sort(function(a,b){return byStaff[b].sum-byStaff[a].sum;});
  var salesHtml = staffKeys.length ? staffKeys.map(function(k){
    return '<div class="dash-row"><span>'+esc(memberName(k))+'　<span class="muted" style="font-size:12px;">'+byStaff[k].cnt+'件</span></span>'+
      '<b>¥'+byStaff[k].sum.toLocaleString()+'</b></div>';
  }).join("") : '<div class="muted" style="padding:6px 0;">この月の売上はまだありません。</div>';
  // 今日のスケジュール（全員分）
  var tISO=todayISO();
  var today=BK.filter(function(b){ return b.date===tISO; }).sort(function(a,b){return (a.time||"").localeCompare(b.time||"");});
  var schedHtml = today.length ? today.map(function(b){
    var staff=(b.staff_ids||[]).map(memberName).join("・")||"担当未定";
    return '<div class="dash-row"><span><b>'+esc(b.time||"--:--")+'</b>　'+esc(clientName(b.client_id))+'</span>'+
      '<span class="muted" style="font-size:12px;">'+esc(staff)+'</span></div>';
  }).join("") : '<div class="muted" style="padding:6px 0;">今日の予約はありません。</div>';
  box.innerHTML='<div class="card" style="background:var(--accent-soft);border-color:#cbe7da;">'+
    '<div class="dash-row" style="border:none;padding:0 0 6px;">'+
      '<button class="mbtn" onclick="dashChangeMonth(-1)">‹</button>'+
      '<div style="font-weight:700;">📊 '+esc(monthLabel)+' の集計</div>'+
      '<button class="mbtn" onclick="dashChangeMonth(1)">›</button>'+
    '</div>'+
    '<div class="dash-row" style="border-top:1px solid #cbe7da;"><span style="font-weight:700;">売上合計</span><b style="font-size:18px;color:var(--accent-text);">¥'+total.toLocaleString()+'</b></div>'+
    '<div style="font-size:12px;color:var(--muted);margin:8px 0 2px;">メンバー別</div>'+ salesHtml +
    '<div style="font-size:12px;color:var(--muted);margin:10px 0 2px;">今日（'+bkDateLabel(tISO)+'）の予定</div>'+ schedHtml +
    '</div>';
}
function toggleInvite(){
  var b=el("inviteBox"); if(!b) return;
  if(b.innerHTML){ b.innerHTML=""; return; }
  b.innerHTML='<div class="card"><div class="muted">新しいメンバーを追加する時に、その人の<b>ログイン情報（メール・パスワード）</b>と、下の<b>組織コード</b>を渡してください。メンバーはログイン後にこのコードで参加します。</div>'+
    '<div style="font-size:12px;color:var(--hint);margin-top:8px;">組織コード</div>'+
    '<div class="code" style="margin-top:3px;">'+esc(PROFILE.org_id)+'</div></div>';
}
// ===== 顧客・施設（組織で共有） =====
var CL=[];
async function loadClients(){
  var r = await sb.from("clients").select("*").order("created_at",{ascending:true});
  var box=el("clientsBox"); if(!box) return;
  if(r.error){ box.innerHTML='<div class="msg err">読み込みエラー：'+esc(r.error.message)+'</div>'; return; }
  CL = r.data||[];
  if(!CL.length){ box.innerHTML='<div class="muted" style="padding:12px 0;">まだ登録がありません。契約先の施設や、よく行くお客様を、上の「＋」から先に登録しておきましょう。</div>'; return; }
  var groups=[["施設","🏢 施設・訪問先"],["病院","🏥 病院"],["個人","🧑 個人"]];
  var h="";
  groups.forEach(function(g){
    var items=CL.filter(function(c){return (c.kind||"個人")===g[0];});
    if(!items.length) return;
    h+='<div class="sec" style="font-size:13px;">'+g[1]+'（'+items.length+'）</div>';
    items.forEach(function(c){
      var pl=Array.isArray(c.price_list)?c.price_list:[];
      var plTxt=pl.map(function(p){return esc(p.name)+" ¥"+(p.price||0).toLocaleString();}).join(" / ");
      h+='<div class="cl-row" onclick="openClientForm(\''+c.id+'\')"><b>'+esc(c.name)+'</b>'+
        (c.address?'<div class="muted" style="font-size:12px;margin-top:2px;">📍 '+esc(c.address)+'</div>':"")+

  var opt=sel.options[sel.selectedIndex]; if(!opt) return;
  var row=sel.closest(".ba-row");
  var price=opt.getAttribute("data-price");
  if(price!=null && price!=="") row.querySelector(".ba_amount").value=price;
  var chk=row.querySelector(".ba_chk"); if(!chk.checked){ chk.checked=true; batchToggle(chk); }
}
async function batchAddPerson(){
  var name=prompt("追加する利用者名を入力してください");
  if(!name||!name.trim()) return; name=name.trim();
  var keep=confirm("この方を名簿にも残しますか？\n（OK＝名簿に残す / キャンセル＝今回だけ）");
  var mid="";
  if(keep){
    var r=await sb.from("members_t").insert({ org_id:PROFILE.org_id, client_id:window._batch.clientId, name:name }).select().single();
    if(r.error){ showMsg("追加エラー："+esc(r.error.message)); return; }
    mid=r.data.id;
  }
  var c=CL.find(function(x){return x.id===window._batch.clientId;})||{};
  var pl=Array.isArray(c.price_list)?c.price_list:[];
  var tmp=document.createElement("div"); tmp.innerHTML=batchRow({id:mid,name:name}, pl);
  var node=tmp.firstChild; el("ba_rows").appendChild(node);
  var chk=node.querySelector(".ba_chk"); chk.checked=true; batchToggle(chk);
}
async function saveBatch(){
  var staff=el("ba_staff").value||ME.id, date=el("ba_date").value;
  var rows=document.querySelectorAll("#ba_rows .ba-row"), payload=[];
  Array.prototype.forEach.call(rows,function(row){
    if(!row.querySelector(".ba_chk").checked) return;
    payload.push({ org_id:PROFILE.org_id, client_id:window._batch.clientId,
      booking_id:window._batch.bookingId||null,
      member_id:row.getAttribute("data-mid")||null,
      member_name:row.getAttribute("data-name")||"",
      staff_id:staff, menu:row.querySelector(".ba_menu").value.trim(),
      amount:Number(row.querySelector(".ba_amount").value)||0, date:date });
  });
  if(!payload.length){ showMsg("その日 対応した人にチェックを入れてください"); return; }
  var r=await sb.from("records").insert(payload);
  if(r.error){ showMsg("保存エラー："+esc(r.error.message)); return; }
  el("rform").innerHTML=""; toast("💴 "+payload.length+"件の売上を記録しました"); loadRecords();
}
function menuOptionsFor(clientId, selMenu){
  var c=CL.find(function(x){return x.id===clientId;});
  var pl=(c&&Array.isArray(c.price_list))?c.price_list:[];
  var opts='<option value="">（自由入力）</option>';
  pl.forEach(function(p){
    opts+='<option value="'+esc(p.name)+'" data-price="'+(p.price||0)+'"'+(p.name===selMenu?" selected":"")+'>'+esc(p.name)+' ¥'+(p.price||0).toLocaleString()+'</option>';
  });
  return opts;
}
function openRecordForm(id, prefill){
  var rec = id ? (RC.find(function(x){return x.id===id;})||{}) : (prefill||{});
  var box=el("rform"); if(!box) return;
  var today=new Date(); var iso=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
  var clientOpts='<option value="">（顧客を選択）</option><option value="__new__">➕ その場で新規登録…</option>'+CL.map(function(c){
    return '<option value="'+c.id+'"'+(c.id===rec.client_id?" selected":"")+'>'+esc(c.name)+'</option>';
  }).join("");
  var staffOpts=MEMBERS.map(function(m){
    return '<option value="'+m.id+'"'+(m.id===(rec.staff_id||ME.id)?" selected":"")+'>'+esc(m.name)+'</option>';
  }).join("");
  box.innerHTML='<div class="card">'+
    '<div class="sec" style="margin-top:0;">'+(id?"売上を編集":"売上を記録")+'</div>'+
    (rec.member_name?'<div class="muted" style="font-size:13px;margin-bottom:6px;">👤 利用者：<b>'+esc(rec.member_name)+'</b></div>':"")+
    '<input type="hidden" id="rf_booking" value="'+esc(rec.booking_id||"")+'">'+
    '<div style="font-size:12px;color:var(--hint);">日付</div>'+
    '<input id="rf_date" type="date" value="'+esc(rec.date||iso)+'">'+
    '<div style="font-size:12px;color:var(--hint);margin-top:8px;">顧客・施設</div>'+
    '<select id="rf_client" onchange="rfClientChange(this)">'+clientOpts+'</select>'+
    '<div style="font-size:12px;color:var(--hint);margin-top:8px;">担当</div>'+
    '<select id="rf_staff">'+staffOpts+'</select>'+
    '<div style="font-size:12px;color:var(--hint);margin-top:8px;">メニュー（料金表から選ぶと金額が入ります）</div>'+
    '<select id="rf_menusel" onchange="rfMenuChange()">'+menuOptionsFor(rec.client_id, rec.menu)+'</select>'+
    '<input id="rf_menu" value="'+esc(rec.menu||"")+'" placeholder="メニュー（自由入力も可）" style="margin-top:6px;">'+
    '<div style="font-size:12px;color:var(--hint);margin-top:8px;">金額（円）</div>'+
    '<input id="rf_amount" type="number" value="'+(rec.amount||"")+'" placeholder="0">'+
    '<input id="rf_note" value="'+esc(rec.note||"")+'" placeholder="メモ・カルテ（任意）" style="margin-top:8px;">'+
    '<div id="m"></div>'+
    '<button class="btn primary" onclick="saveRecordForm(\''+(id||"")+'\')" style="margin-top:8px;">保存</button>'+
    (id?'<button class="btn danger" onclick="delRecord(\''+id+'\')">削除</button>':"")+
    '<button class="btn ghost" onclick="el(\'rform\').innerHTML=\'\'">キャンセル</button>'+
    '</div>';
  box.scrollIntoView({behavior:"smooth",block:"nearest"});
}
async function rfClientChange(sel){
  if(sel && sel.value==="__new__"){ await quickAddClient(sel); }
  var cid=el("rf_client").value;
  el("rf_menusel").innerHTML=menuOptionsFor(cid, "");
}
function bfClientChange(sel){
  if(sel && sel.value==="__new__"){ quickAddClient(sel); }
}
// その場で顧客・施設を追加して、その選択肢を選ぶ（顧客は組織共有なので登録して紐づける）
async function quickAddClient(sel){
  var name=prompt("新しい顧客・施設の名前を入力してください");
  if(!name||!name.trim()){ sel.value=""; return null; }
  name=name.trim();
  var kind=confirm("施設・訪問先ですか？\n（OK＝施設 / キャンセル＝個人）")?"施設":"個人";
  var r=await sb.from("clients").insert({ org_id:PROFILE.org_id, kind:kind, name:name,
    billing:(kind==="個人"?"個別":"一括") }).select().single();
  if(r.error){ showMsg("追加エラー："+esc(r.error.message)); sel.value=""; return null; }
  await loadClients();                       // 一覧とCLを更新
  var opt=document.createElement("option");  // このselectにも即反映して選択
  opt.value=r.data.id; opt.textContent=name;
  sel.appendChild(opt); sel.value=r.data.id;
  toast("🆕 「"+name+"」を登録しました");
  return r.data.id;
}
function rfMenuChange(){
  var sel=el("rf_menusel"); var opt=sel.options[sel.selectedIndex];
  if(!opt||!opt.value) return;
  el("rf_menu").value=opt.value;
  var price=opt.getAttribute("data-price");
  if(price!=null) el("rf_amount").value=price;
}
async function saveRecordForm(id){
  var client=el("rf_client").value;
  if(!client){ showMsg("顧客・施設を選択してください"); return; }
  var data={ org_id:PROFILE.org_id, booking_id:el("rf_booking").value||null,
    client_id:client, staff_id:el("rf_staff").value||ME.id,
    menu:el("rf_menu").value.trim(), amount:Number(el("rf_amount").value)||0,
    note:el("rf_note").value.trim(), date:el("rf_date").value };
  var r = id ? await sb.from("records").update(data).eq("id",id)
             : await sb.from("records").insert(data);
  if(r.error){ showMsg("保存エラー："+esc(r.error.message)); return; }
  el("rform").innerHTML=""; loadRecords();
}
async function delRecord(id){
  if(!confirm("この売上・カルテを削除します。よろしいですか？")) return;
  var r = await sb.from("records").delete().eq("id",id);
  if(r.error){ showMsg("削除エラー："+esc(r.error.message)); return; }
  el("rform").innerHTML=""; loadRecords();
}

// ===== トースト（画面下に一瞬出るお知らせ） =====
var toastTimer=null;
function toast(msg){
  var t=el("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove("show"); }, 2600);
}

// ===== 自動更新（Realtime：他端末の変更を即反映） =====
var RT=null, rtTimer=null, rtLabels={};
function subscribeRealtime(){
  if(RT||!PROFILE) return;                         // 二重購読を防ぐ
  RT = sb.channel("org-"+PROFILE.org_id)
    .on("postgres_changes",{event:"*",schema:"public",table:"bookings"},function(){ rtBump("予約"); })
    .on("postgres_changes",{event:"*",schema:"public",table:"records"}, function(){ rtBump("売上"); })
    .on("postgres_changes",{event:"*",schema:"public",table:"clients"}, function(){ rtBump("顧客"); })
    .subscribe();
}
function rtBump(label){
  rtLabels[label]=1;
  clearTimeout(rtTimer);
  rtTimer=setTimeout(function(){                    // 連続変更をまとめて1回だけ処理
    if(rtLabels["顧客"]) loadClients();
    if(rtLabels["予約"]) loadBookings();
    if(rtLabels["売上"]) loadRecords();
    var names=Object.keys(rtLabels).join("・"); rtLabels={};
    if(el("app").querySelector("#bookingsBox")) toast("🔔 "+names+"が更新されました");
  }, 400);
}
function unsubscribeRealtime(){ if(RT){ sb.removeChannel(RT); RT=null; } }

// ===== データを全リセット（運営のみ・二重確認） =====
async function resetAllData(){
  if(!PROFILE || PROFILE.role!=="owner"){ toast("運営のみ実行できます"); return; }
  if(!confirm("⚠️ この組織の【顧客・利用者・予約・売上・カルテ】を すべて削除します。\n元に戻せません。本当にリセットしますか？")) return;
  if(!confirm("最終確認：本当に全部削除してよろしいですか？")) return;
  var org=PROFILE.org_id, err=null;
  // 子→親の順で削除（org単位）
  var tables=["records","bookings","members_t","clients"];
  for(var i=0;i<tables.length;i++){
    var r=await sb.from(tables[i]).delete().eq("org_id",org);
    if(r.error){ err=r.error.message; break; }
  }
  if(err){ showMsg("リセットエラー："+esc(err)); return; }
  toast("🧹 データをリセットしました");
  renderHome(); window.scrollTo(0,0);
}

async function doSignOut(){ unsubscribeRealtime(); await sb.auth.signOut(); ME=null; PROFILE=null; renderAuth(); }

boot();
</script>
