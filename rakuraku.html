// data URL から media_type と base64 本体を取り出す
function splitDataUrl(d){
  var m=(d||"").match(/^data:([^;]+);base64,(.*)$/);
  return m?{media:m[1], data:m[2]}:null;
}

// AI（Gemini無料枠 / Claude従量）に送って予約候補JSONを得る
function aiInstruction(){
  return "あなたは訪問美容の予約受付アシスタントです。添付のFAX・メモ・画像から予約依頼を読み取り、"+
    "下記スキーマのJSONだけを返してください（JSON以外は一切出力しない）。\\n"+
    "施設の名簿は載っている利用者を全員membersに入れること。\\n"+
    "氏名は誤読しないよう一字ずつ丁寧に読み取り、書かれている通りに（推測で補わず）出力すること。崩し字・かすれは可能な範囲で正確に。\\n"+
    "表形式なら各行を1名として読む。menuはメニュー列の文字をそのまま（例：カット, カラー, パーマ, 顔そり, セット, ブロー。略字あり。カラーをブロー、カットをセット等と取り違えない）。\\n"+
    "※金額は読まなくてよい（料金は別途、施設の料金表から自動で入る）。\\n"+
    "本日は"+todayStr()+"です。年の記載がなければ直近の未来日として解釈してください。\\n"+
    "{\\n"+
    '  "clientName": "施設名または個人名",\\n'+
    '  "kind": "個人 | 施設 | 病院 のいずれか",\\n'+
    '  "date": "YYYY-MM-DD（不明なら空文字）",\\n'+
    '  "time": "HH:MM（不明なら空文字）",\\n'+
    '  "members": [{"name":"利用者名","menu":"メニュー","comment":"メモ欄の内容（任意・無ければ空）"}],\\n'+
    '  "memo": "その他の依頼内容（人数・連絡事項など）"\\n'+
    "}\\n読み取れない項目は空文字または空配列にすること。";
}
function handleAiResult(id, txt){
  var parsed=parseAiJson(txt);
  if(!parsed){ aiError("AIの返答をJSONとして解釈できませんでした。\\n\\n返ってきた内容:\\n"+(txt||"(空)").slice(0,500)); return; }
  aiConfirm(id, parsed);
}
// エラー内容を画面に残して読めるように
function aiError(detail){
  try{ console.error("AI取込エラー:", detail); }catch(e){}
  openModal('<h2>AI読み取りエラー</h2>'+
    '<div class="card" style="font-size:13px;white-space:pre-wrap;color:var(--danger);">'+esc(detail)+'</div>'+
    '<p class="lead" style="margin-top:8px;">この文面をそのままコピーして相談してください。</p>'+
    '<button class="btn ghost" onclick="closeModal()">閉じる</button>');
}
function aiRead(id){
  var it=DB.inbox.find(function(x){return x.id===id;}); if(!it) return;
  var key=getAiKey(); if(!key){ toast("設定でAPIキーを登録してください"); return; }
  toast("AIが読み取り中…");
  var instruction=aiInstruction();
  var ph=splitDataUrl(it.photo);
  var textPart=instruction+(it.raw?("\\n\\n--- テキスト ---\\n"+it.raw):"");
  if(getProvider()==="claude"){
    var content=[];
    if(ph) content.push({type:"image", source:{type:"base64", media_type:ph.media, data:ph.data}});
    content.push({type:"text", text:textPart});
    fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({ model:"claude-opus-4-8", max_tokens:2000, messages:[{role:"user", content:content}] })
    }).then(function(r){return r.json();}).then(function(res){
      if(res.error){ aiError("Claude: "+(res.error.message||JSON.stringify(res.error))); return; }
      if(res.stop_reason==="refusal"){ aiError("Claudeが読み取りを拒否しました"); return; }
      var txt=""; (res.content||[]).forEach(function(b){ if(b.type==="text") txt+=b.text; });
      handleAiResult(id, txt);
    }).catch(function(e){ aiError("通信エラー（キー制限やネットワークの可能性）:\\n"+e.message); });
  } else {
    // Gemini（無料枠）— 混雑時は自動リトライ
    var parts=[{text:textPart}];
    if(ph) parts.push({inline_data:{mime_type:ph.media, data:ph.data}});
    var body=JSON.stringify({ contents:[{parts:parts}], generationConfig:{ responseMimeType:"application/json" } });
    var url="https://generativelanguage.googleapis.com/v1beta/models/"+geminiModel()+":generateContent?key="+encodeURIComponent(key);
    var tryGemini=function(attempt){
      fetch(url,{ method:"POST", headers:{"content-type":"application/json"}, body:body })
      .then(function(r){return r.json();}).then(function(res){
        if(res.error){
          var msg=res.error.message||JSON.stringify(res.error);
          var busy=(res.error.code===503 || res.error.code===429 || /high demand|overload|unavailable|exhausted/i.test(msg)) && !/limit:\s*0/.test(msg);
          if(busy && attempt<4){ toast("混雑中… 自動で再試行("+attempt+"/3)"); setTimeout(function(){tryGemini(attempt+1);}, 5000); return; }
          aiError("Gemini: "+msg); return;
        }
        var cand=(res.candidates||[])[0];
        if(!cand){ aiError("Geminiから候補が返りませんでした:\\n"+JSON.stringify(res).slice(0,500)); return; }
        var txt=((cand.content||{}).parts||[]).map(function(p){return p.text||"";}).join("");
        handleAiResult(id, txt);
      }).catch(function(e){
        if(attempt<4){ toast("通信エラー 再試行("+attempt+"/3)"); setTimeout(function(){tryGemini(attempt+1);}, 5000); return; }
        aiError("通信エラー（キー制限やCORSの可能性）:\\n"+e.message);
      });
    };
    tryGemini(1);
  }
}

// ```json ... ``` や前後の文章を許容してJSONを取り出す
function parseAiJson(txt){
  if(!txt) return null;
  var s=txt.replace(/```json/gi,"").replace(/```/g,"").trim();
  var a=s.indexOf("{"), b=s.lastIndexOf("}");
  if(a>=0 && b>a) s=s.slice(a,b+1);
  try{ return JSON.parse(s); }catch(e){ return null; }
}

// 確認・修正モーダル（手修正＝正）
function aiConfirm(inboxId, p){
  window._aiInbox=inboxId;
  var kind=KINDS.indexOf(p.kind)>=0?p.kind:"施設";
  var mc=DB.clients.find(function(c){return c.name===(p.clientName||"").trim();});
  var mcid=mc?mc.id:""; window._aiClientId=mcid;
  var mems=Array.isArray(p.members)?p.members:[];
  var memHtml=menuDatalist(mcid)+mems.map(function(m,i){
    var nm=canonName(mcid, m.name||"");   // 過去ストックで誤字を自動補正
    var pr=priceFor(mcid, m.menu);   // 価格は料金表から（FAXの手書き金額は使わない）
    return memberCard(i, "aiMem", mcid, nm, m.menu||"", (pr!=null?pr:""), m.comment||"");
  }).join("");
  openModal(
    '<h2>🤖 AIの読み取り結果</h2>'+
    '<p class="lead">内容を確認・修正してください。<b>直したものが正データ</b>になります。</p>'+
    '<label>顧客先名</label><input id="aiClient" value="'+esc(p.clientName||"")+'">'+
    '<label>区分</label><div class="chips" id="aiKind">'+KINDS.map(function(k){
      return '<button class="chip'+(k===kind?" sel":"")+'" onclick="rcPick(\'aiKind\',this)">'+k+'</button>'; }).join("")+'</div>'+
    '<div class="row-2"><div><label>日付</label><input type="date" id="aiDate" value="'+esc(p.date||todayStr())+'"></div>'+
    '<div><label>時間</label><input type="time" id="aiTime" value="'+esc(p.time||"10:00")+'"></div></div>'+
    '<label>希望者リスト（メニュー・金額・コメント）</label>'+
    priceListRef(mcid)+
    (memHtml||'<div style="color:var(--hint);font-size:13px;">なし（施設は後で追加可）</div>')+
    '<button class="add-link" onclick="aiAddMember()">＋ 利用者を追加</button>'+
    '<label>メモ</label><textarea id="aiMemo">'+esc(p.memo||"")+'</textarea>'+
    '<input type="hidden" id="aiMemCount" value="'+mems.length+'">'+
    '<button class="btn primary" onclick="aiConfirmSave()">この内容で予約する</button>'+
    '<button class="btn ghost" onclick="closeModal()">キャンセル</button>');
}
function aiAddMember(){
  var n=Number(document.getElementById("aiMemCount").value)||0;
  var div=document.createElement("div");
  div.innerHTML=memberCard(n, "aiMem", window._aiClientId, "", "", "", "");
  var anchor=document.querySelector("#modal .add-link"); anchor.parentNode.insertBefore(div.firstChild, anchor);
  document.getElementById("aiMemCount").value=n+1;
}
function aiConfirmSave(){
  var nm=document.getElementById("aiClient").value.trim(); if(!nm){ toast("顧客先名を入力してください"); return; }
  var kEl=document.querySelector("#aiKind .chip.sel"); var kind=kEl?kEl.textContent:"施設";
  // 既存の同名顧客先を優先（手修正＝正で名寄せ）
  var client=DB.clients.find(function(c){return c.name===nm;});
  if(!client){ client={ id:uid(), kind:kind, name:nm, address:"", billing:(kind==="施設"?"一括":"個別"), rules:"", memo:"" }; DB.clients.push(client); }
  // 利用者を反映（新規名のみ追加）＋ 施術行を収集（金額も）
  var staffId=(DB.staff[0]?DB.staff[0].id:null);
  var cnt=Number(document.getElementById("aiMemCount").value)||0;
  var entries=[];
  for(var i=0;i<cnt;i++){
    var ne=document.getElementById("aiMemName_"+i); if(!ne) continue;
    var name=ne.value.trim(); if(!name) continue;
    var menu=((document.getElementById("aiMemMenu_"+i)||{}).value||"").trim();
    var amt=Number((document.getElementById("aiMemAmt_"+i)||{}).value)||0;
    var note=((document.getElementById("aiMemNote_"+i)||{}).value||"").trim();
    var mem=membersOf(client.id).find(function(m){return m.name===name;});
    if(!mem){ mem={ id:uid(), clientId:client.id, name:name, kana:"", defaultMenu:menu, defaultPrice:amt, staffId:staffId }; DB.members.push(mem); }
    entries.push({ memberId:mem.id, menu:menu, amount:amt, note:note });
  }
  var b={ id:uid(), clientId:client.id, date:document.getElementById("aiDate").value, time:document.getElementById("aiTime").value,
    duration:DB.settings.slotMin||60, staffIds:(staffId?[staffId]:[]), travel:0, source:"AI取込",
    memo:document.getElementById("aiMemo").value.trim(), status:"予定", memberIds:[] };
  DB.bookings.push(b);
  // 金額・メニューがあれば実績(下書き)として登録→売上・領収書に反映
  entries.forEach(function(e){
    if(e.amount>0 || e.menu || e.note){
      DB.records.push({ id:uid(), bookingId:b.id, clientId:client.id, memberId:e.memberId, menu:e.menu, amount:e.amount, note:e.note||"", staffId:staffId, date:b.date });
    }
  });
  var it=DB.inbox.find(function(x){return x.id===window._aiInbox;}); if(it) it.status="取込済";
  window._aiInbox=null;
  saveDB(); closeModal();
  current=new Date(b.date+"T00:00:00"); tab="book";
  document.querySelectorAll("nav.tabs button").forEach(function(x){x.classList.toggle("on",x.dataset.tab==="book");});
  render(); toast("AI取込から予約を登録しました");
}

/* ---------- 画像圧縮（容量対策） ---------- */
function compressImage(file, cb){
  var img=new Image(); var rd=new FileReader();
  rd.onload=function(e){ img.onload=function(){
    var max=1600; var w=img.width, hgt=img.height;   // FAXの細かい氏名を潰さないよう高解像度で取り込む
    if(w>hgt && w>max){ hgt=hgt*max/w; w=max; } else if(hgt>max){ w=w*max/hgt; hgt=max; }
    var cv=document.createElement("canvas"); cv.width=w; cv.height=hgt;
    cv.getContext("2d").drawImage(img,0,0,w,hgt); cb(cv.toDataURL("image/jpeg",0.75));
  }; img.src=e.target.result; };
  rd.readAsDataURL(file);
}
// スタイル写真用（端末保存のため小さめに圧縮）
function compressPhoto(file, cb){
  var img=new Image(); var rd=new FileReader();
  rd.onload=function(e){ img.onload=function(){
    var max=900; var w=img.width, hgt=img.height;
    if(w>hgt && w>max){ hgt=hgt*max/w; w=max; } else if(hgt>max){ w=w*max/hgt; hgt=max; }
    var cv=document.createElement("canvas"); cv.width=w; cv.height=hgt;
    cv.getContext("2d").drawImage(img,0,0,w,hgt); cb(cv.toDataURL("image/jpeg",0.6));
  }; img.src=e.target.result; };
  rd.readAsDataURL(file);
}
// 施術カードの写真編集（window._bkPhotos[memberId]に保持→保存時にrecord.photosへ）
function bkAddPhoto(mid, input){
  var f=input.files&&input.files[0]; if(!f) return;
  compressPhoto(f, function(src){ window._bkPhotos=window._bkPhotos||{}; (window._bkPhotos[mid]=window._bkPhotos[mid]||[]).push(src); bkRenderPhotos(mid); });
  input.value="";
}
function bkDelPhoto(mid, i){ if(window._bkPhotos&&window._bkPhotos[mid]){ window._bkPhotos[mid].splice(i,1); bkRenderPhotos(mid); } }
function bkRenderPhotos(mid){
  var box=document.getElementById("bkPhotos_"+mid); if(!box) return;
  var arr=(window._bkPhotos&&window._bkPhotos[mid])||[];
  box.innerHTML=arr.map(function(src,i){ return '<div class="ph-thumb"><img src="'+src+'" onclick="showLightbox(this.src)"><button type="button" onclick="bkDelPhoto(\''+mid+'\','+i+')">×</button></div>'; }).join("");
}
// 写真の拡大表示（モーダルとは別のオーバーレイ＝予約フォームを壊さない）
function showLightbox(src){ var d=document.createElement("div"); d.className="lightbox"; d.onclick=function(){ d.remove(); }; d.innerHTML='<img src="'+src+'">'; document.body.appendChild(d); }

boot();
