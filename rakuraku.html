<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1d9e75">
<title>訪問美容 楽々アプリ</title>
<style>
  :root{
    --bg:#f4f6f5; --surface:#ffffff; --line:#e4e8e6;
    --text:#1f2624; --muted:#6b7572; --hint:#9aa3a0;
    --accent:#1d9e75; --accent-soft:#e1f5ee; --accent-text:#0f6e56;
    --info:#185fa5; --info-soft:#e6f1fb;
    --warn:#ba7517; --warn-soft:#faeeda; --danger:#a32d2d;
    --radius:12px; --radius-sm:8px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; padding-bottom:72px;}
  h1,h2,h3{font-weight:600; margin:0;}
  button{font-family:inherit; cursor:pointer;}
  .wrap{max-width:500px; margin:0 auto; padding:16px;}

  header.top{position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line);}
  .top-in{max-width:500px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between;}
  .brand{font-size:17px; font-weight:600;}
  .brand small{display:block; font-size:11px; color:var(--muted); font-weight:400;}

  .hero{background:linear-gradient(135deg,#1d9e75,#15805f); color:#fff; border-radius:var(--radius); padding:16px 18px; margin-bottom:14px;}
  .hero .h-d{font-size:13px; opacity:.85;}
  .hero .h-n{font-size:26px; font-weight:600; margin:2px 0 2px;}
  .hero .h-s{font-size:13px; opacity:.9;}

  .quick{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .qbtn{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; text-align:left; display:flex; align-items:center; gap:10px;}
  .qbtn .qi{font-size:22px;}
  .qbtn .qt{font-size:14px; font-weight:600;}
  .qbtn .qs{font-size:11px; color:var(--muted);}
  .qbtn.big{grid-column:1/3; background:var(--accent); color:#fff; border:none; box-shadow:0 3px 10px rgba(29,158,117,.3);}
  .qbtn.big .qs{color:rgba(255,255,255,.85);}
  .badge{display:inline-block; min-width:18px; padding:0 5px; height:18px; line-height:18px; text-align:center; font-size:11px; border-radius:9px; background:var(--danger); color:#fff; margin-left:auto;}

  .sec-title{font-size:13px; color:var(--muted); margin:18px 4px 8px; display:flex; justify-content:space-between; align-items:center;}
  .sec-title button{font-size:12px; color:var(--accent); background:none; border:none; font-weight:500;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
  .booking{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:var(--radius); padding:13px 14px; margin-bottom:9px; cursor:pointer;}
  .booking:active{background:#fafbfb;}
  .booking .row1{display:flex; align-items:center; justify-content:space-between;}
  .booking .name{font-size:15px; font-weight:600;}
  .booking .time{font-size:13px; color:var(--muted);}
  .booking .meta{font-size:12px; color:var(--muted); margin-top:3px;}
  .kindtag{display:inline-block; font-size:11px; padding:1px 8px; border-radius:20px; margin-left:6px; vertical-align:1px;}
  .kindtag.k0{background:var(--info-soft); color:var(--info);}
  .kindtag.k1{background:var(--accent-soft); color:var(--accent-text);}
  .kindtag.k2{background:#fbeaea; color:var(--danger);}
  .tag{display:inline-block; font-size:11px; padding:2px 9px; border-radius:20px; margin-top:6px;}
  .tag.plan{background:#eef1f0; color:var(--muted);}
  .tag.done{background:var(--accent-soft); color:var(--accent-text);}

  /* 利用者リスト（1行入力・コンパクト） */
  .memhead{display:flex; gap:5px; align-items:center; padding:0 2px 3px; font-size:11px; color:var(--hint);}
  .memhead .m-name{flex:1.1;} .memhead .m-menu{flex:1.3;} .memhead .m-amt{width:74px; flex:none; text-align:right; padding-right:8px;} .memhead .m-del{width:24px; flex:none;}
  .memrow{display:flex; gap:5px; align-items:center; margin-bottom:5px;}
  .memrow input, .memrow select{margin:0; padding:7px 6px; font-size:13px;}
  .memrow .m-name{flex:1.1; min-width:0;}
  .memrow .m-menu{flex:1.3; min-width:0;}
  .memrow .m-amt{width:74px; flex:none; text-align:right;}
  .memrow .m-del{flex:none; width:24px; height:30px; padding:0; border:none; background:none; color:var(--hint); font-size:18px; line-height:1; cursor:pointer;}
  .memrow .m-del:hover{color:var(--danger);}
  select.durselect{width:100%;}
  /* 下書き復元バー */
  .draftbar{display:flex; align-items:center; justify-content:space-between; gap:8px; background:#fff7e6; border:1px solid #f0d9a8; color:#8a6d2f; font-size:13px; padding:8px 11px; border-radius:10px; margin-bottom:10px;}
  .draftbar button{border:none; background:#8a6d2f; color:#fff; font-size:12px; padding:5px 10px; border-radius:14px; cursor:pointer; flex:none;}

  /* 取込受信箱 */
  .inbox-drop{border:1.5px dashed var(--accent); border-radius:var(--radius); background:var(--accent-soft); padding:18px; text-align:center; margin-bottom:14px;}
  .inbox-drop .di{font-size:30px;}
  .inbox-drop .dt{font-size:14px; font-weight:600; color:var(--accent-text); margin-top:4px;}
  .inbox-drop .ds{font-size:12px; color:var(--accent-text); opacity:.8; margin-top:2px;}
  .inrow{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:9px; display:flex; gap:12px; align-items:flex-start;}
  .inrow .ith{width:46px; height:46px; border-radius:var(--radius-sm); background:#f0f2f1; display:flex; align-items:center; justify-content:center; font-size:22px; flex:none; overflow:hidden;}
  .inrow .ith img{width:100%; height:100%; object-fit:cover;}
  .inrow .ib{flex:1; min-width:0;}
  .inrow .itt{font-size:14px; font-weight:600;}
  .inrow .itx{font-size:12px; color:var(--muted); margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .inrow .ia{display:flex; gap:8px; margin-top:8px;}
  .mini{font-size:12px; padding:6px 12px; border-radius:18px; border:1px solid var(--line); background:var(--surface); color:var(--text);}
  .mini.acc{background:var(--accent); color:#fff; border-color:var(--accent);}
  .st{display:inline-block; font-size:10px; padding:1px 7px; border-radius:10px; margin-left:6px;}
  .st.todo{background:var(--warn-soft); color:var(--warn);}
  .st.done{background:var(--accent-soft); color:var(--accent-text);}

  .sum-bar{display:flex; align-items:center; gap:8px; margin:8px 0;}
  .sum-bar .nm{width:110px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sum-bar .track{flex:1; height:14px; background:#eef1f0; border-radius:7px; overflow:hidden;}
  .sum-bar .fill{height:100%; background:var(--accent);}
  .sum-bar .am{width:88px; text-align:right; font-size:13px;}
  .cards{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;}
  .mcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px;}
  .mcard .lbl{font-size:12px; color:var(--muted);}
  .mcard .val{font-size:20px; font-weight:600; margin-top:2px;}

  .client-block{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
  .client-block .fn{font-size:15px; font-weight:600; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .client-block .fn .edit{font-size:12px; color:var(--muted); font-weight:400; background:none; border:none; padding:4px;}
  .mem-li{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:14px; cursor:pointer;}
  .mem-li .del{background:none; border:none; color:var(--hint); font-size:16px; padding:2px 6px;}
  /* 顧客リスト（グループ＋カルテ） */
  .grp-title{font-size:12px; font-weight:700; color:var(--muted); margin:12px 4px 6px;}
  .cl-row{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:11px 13px; margin-bottom:7px; cursor:pointer;}
  .cl-row:active{background:var(--accent-soft);}
  .cl-main{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .cl-name{font-size:15px; font-weight:600;}
  .cl-last{font-size:11px; color:var(--hint); flex:none;}
  .cl-sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .karte{border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:10px; padding:9px 12px; margin-bottom:7px; background:var(--surface);}
  .karte .k-top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .karte .k-date{font-size:12px; font-weight:600; color:var(--accent-text);}
  .karte .k-name{font-size:12px; color:var(--muted);}
  .karte .k-body{font-size:14px; margin-top:3px;}
  .karte .k-note{font-size:12px; color:var(--muted); margin-top:2px;}
  .karte .k-reuse{margin-top:6px; border:none; background:var(--accent-soft); color:var(--accent-text); font-size:12px; font-weight:600; padding:6px 12px; border-radius:14px; cursor:pointer;}
  /* 領収書（アプリ内表示＋印刷） */
  .receipt-doc .r{max-width:520px; margin:0 auto 16px; border:1px solid #ccc; border-radius:8px; padding:24px; background:#fff; color:#1f2624;}
  .receipt-doc h1{text-align:center; font-size:22px; letter-spacing:.3em; border-bottom:2px solid #1f2624; padding-bottom:8px; margin:0;}
  .receipt-doc .date{text-align:right; font-size:12px; color:#555; margin-top:8px;}
  .receipt-doc .to{font-size:17px; margin:14px 0 6px; border-bottom:1px solid #999; padding-bottom:6px;}
  .receipt-doc .amt{font-size:26px; font-weight:700; text-align:center; margin:14px 0; border:1px solid #ccc; padding:10px;}
  .receipt-doc table{width:100%; border-collapse:collapse; margin:12px 0; font-size:13px;}
  .receipt-doc td{padding:6px 4px; border-bottom:1px solid #eee;}
  .receipt-doc .biz{margin-top:22px; text-align:right; font-size:13px; line-height:1.7;}
  @media print{
    body{visibility:hidden;}
    #modalBg, #modalBg *{visibility:visible;}
    #modalBg{position:absolute; top:0; left:0; width:100%; height:auto; background:#fff; display:block; padding:0; overflow:visible;}
    #modal{box-shadow:none; max-width:100%; max-height:none; border-radius:0; padding:0; overflow:visible;}
    .noprint{display:none!important;}
    .receipt-doc .r{page-break-after:always; border:none; max-width:100%;}
  }
  .add-link{background:none; border:none; color:var(--accent); font-size:14px; padding:8px 0; font-weight:500;}
  .rulebox{background:var(--warn-soft); border:1px solid #f0d9a8; border-radius:var(--radius-sm); padding:9px 12px; margin:8px 0; font-size:13px; color:var(--warn);}
  .empty{text-align:center; color:var(--hint); padding:34px 16px; font-size:14px;}

  /* 月カレンダー（コンパクト・スタイリッシュ） */
  .cal{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 12px 10px; margin-bottom:12px; box-shadow:0 1px 3px rgba(20,28,25,.04);}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding:0 4px;}
  .cal-head b{font-size:15px; font-weight:600; letter-spacing:.01em;}
  .cal-head button{border:none; background:var(--bg); width:30px; height:30px; border-radius:50%; font-size:15px; color:var(--muted); display:flex; align-items:center; justify-content:center;}
  .cal-head button:active{background:var(--accent-soft); color:var(--accent-text);}
  .cal-wdrow{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:40px;}
  .cal-wd{text-align:center; font-size:10px; font-weight:600; color:var(--hint); letter-spacing:.06em;}
  .cal-wd.sun{color:#d39089;} .cal-wd.sat{color:#8fa9c6;}
  .cal-day{height:40px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; gap:3px;}
  .cal-day .num{width:28px; height:28px; line-height:28px; text-align:center; font-size:13px; border-radius:50%; transition:background .12s;}
  .cal-day:active .num{background:var(--accent-soft);}
  .cal-day.today .num{color:var(--accent-text); font-weight:700; background:var(--accent-soft);}
  .cal-day.sel .num{background:var(--accent); color:#fff; font-weight:600;}
  .cal-day.sel.today .num{background:var(--accent);}
  .cal-day .dot{width:5px; height:5px; border-radius:50%; background:var(--accent);}
  .cal-day .dot.hidden{visibility:hidden;}
  .cal-day.sel .dot{background:#fff;}
  .cal-day.empty{cursor:default;}
  /* 予約不可（休み・満）：取り消し線グレー */
  .cal-day.ng .num{color:var(--hint); background:#edefed; text-decoration:line-through;}
  .cal-day.ng.sel .num{background:var(--accent); color:#fff;}

  .cal-legend{display:flex; gap:16px; justify-content:center; margin:4px 0 0; font-size:11px; color:var(--muted);}
  .cal-legend span{display:inline-flex; align-items:center; gap:5px;}
  .lg-dot{width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block;}
  .lg-ng{text-decoration:line-through; color:var(--hint);}

  .blockbar{background:#fbeaea; border:1px solid #f0d2d0; color:var(--danger); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:14px; font-weight:600;}
  .blockbar button{flex:none; font-size:12px; padding:7px 13px; border-radius:18px; border:1px solid var(--danger); background:#fff; color:var(--danger); font-weight:600;}
  .ng-toggle{background:none; border:none; color:var(--hint); font-size:12px; padding:6px 4px; margin-bottom:6px;}

  /* 時間軸タイムライン */
  .slot{display:flex; gap:10px; align-items:stretch; margin-bottom:6px;}
  .slot .tm{width:44px; flex:none; font-size:12px; color:var(--muted); padding-top:11px; text-align:right;}
  .slot .body{flex:1; min-width:0;}
  .slot-free{border:1px dashed var(--line); border-radius:10px; padding:11px 13px; color:var(--hint); font-size:13px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
  .slot-free:active{background:var(--accent-soft);}
  .slot-free.ng{cursor:default; color:#cdbcba; border-color:#eedede; justify-content:center;}
  /* 同枠に複数予約が重なる時の間隔（別スタッフの同時間予約） */
  .slot.tight{margin-bottom:0;}
  .slot .body > * + *{margin-top:4px;}
  .slot-cont{background:#ecf7f1; border:1px solid #cfe9dd; border-left:3px solid var(--accent); border-radius:10px; padding:10px 13px; font-size:12px; color:var(--accent-text); display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .slot-cont .cont-nm{font-weight:600; color:var(--text); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tl-bk.span-down, .slot-cont.span-down{border-bottom:none; border-bottom-left-radius:0; border-bottom-right-radius:0;}
  .slot-cont.span-up{border-top:none; border-top-left-radius:0; border-top-right-radius:0;}
  /* 移動中＝琥珀色（白枠と色を変えて区別） */
  .slot-move{border:1px solid #ecdcc0; border-left:3px solid #d8a85f; border-radius:10px; padding:10px 13px; color:#9a6b1e; font-size:12px; font-weight:600; background:#fbf2e2; display:flex; justify-content:space-between; align-items:center;}
  /* 予約不可枠（時間単位） */
  .slot-ng{border:1px solid #e0dedd; border-left:3px solid #b8b4b1; border-radius:10px; padding:10px 13px; color:#857f7a; font-size:12px; font-weight:600; background:#f1f0ef; display:flex; justify-content:space-between; align-items:center;}
  .slot-ng.span-down{border-bottom:none; border-bottom-left-radius:0; border-bottom-right-radius:0;}
  .slot-ng.span-up{border-top:none; border-top-left-radius:0; border-top-right-radius:0;}
  .slot-ng button{flex:none; border:1px solid #d6d2cf; background:#fff; color:#857f7a; font-size:11px; padding:4px 11px; border-radius:14px; cursor:pointer;}
  .slot-free .free-r{display:flex; align-items:center; gap:0;}
  .ng-mini{border:1px solid #e7d6d4; background:#fff; color:var(--danger); font-size:11px; padding:4px 10px; border-radius:13px; cursor:pointer; margin-right:8px;}
  /* 週表示（カレンダー風） */
  .wk-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .wk-nav b{font-size:14px;}
  .wk-nav button{border:none; background:var(--bg); width:30px; height:30px; border-radius:50%; color:var(--muted); font-size:16px;}
  .wk-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .wk{min-width:100%;}
  .wk-head{display:flex; position:sticky; top:0; background:var(--bg); z-index:2; padding-bottom:2px;}
  .wk-tg, .wk-gutter{width:32px; flex:none;}
  .wk-dh{flex:1; min-width:42px; text-align:center; font-size:11px; color:var(--muted); padding:4px 0; line-height:1.25; cursor:pointer; border-radius:8px;}
  .wk-dh.today{color:var(--accent-text); font-weight:700;}
  .wk-dh.sel{background:var(--accent-soft);}
  .wk-dh.sun{color:#d39089;} .wk-dh.sat{color:#8fa9c6;}
  .wk-body{display:flex;}
  .wk-hr{font-size:9px; color:var(--hint); text-align:right; padding-right:3px; box-sizing:border-box; transform:translateY(-5px);}
  .wk-col{flex:1; min-width:42px; position:relative; border-left:1px solid var(--line); background-image:linear-gradient(var(--line) 1px, transparent 1px); background-repeat:repeat-y;}
  .wk-col.ng{background-color:#f4f1f1;}
  .wk-ev{position:absolute; border-radius:4px; overflow:hidden; font-size:9px; line-height:1.15; padding:2px 3px; box-sizing:border-box; cursor:pointer; color:#fff;}
  .wk-ev .wk-ev-t{display:block; font-weight:700; opacity:.95;}
  .wk-ev .wk-ev-n{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ev-move{background:#fbf2e2!important; color:#9a6b1e; border:1px solid #e6cfa0;}
  .ev-ng{background:#eceae9!important; color:#857f7a; border:1px dashed #cfcbc8;}
  /* スタイル写真 */
  .ph-strip{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px;}
  .ph-thumb{position:relative; width:64px; height:64px; border-radius:8px; overflow:hidden; flex:none;}
  .ph-thumb.sm{width:54px; height:54px;}
  .ph-thumb img{width:100%; height:100%; object-fit:cover; cursor:pointer; display:block;}
  .ph-thumb button{position:absolute; top:2px; right:2px; width:18px; height:18px; border:none; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; font-size:12px; line-height:1; cursor:pointer; padding:0;}
  .ph-add{display:inline-block; margin-top:7px; font-size:13px; color:var(--accent); border:1px dashed var(--accent); border-radius:18px; padding:7px 13px; cursor:pointer;}
  .lightbox{position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; cursor:zoom-out;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:8px;}
  /* 地図ピン（ポップな雫型＋絵文字/番号） */
  .mpin{width:34px; height:34px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); border:2.5px solid #fff; box-shadow:0 3px 7px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center;}
  .mpin span{transform:rotate(45deg); font-size:16px; line-height:1; color:#fff; font-weight:800;}
  .route-link{display:inline-block; margin-top:6px; background:var(--accent); color:#fff; font-weight:700; font-size:13px; padding:8px 14px; border-radius:18px; text-decoration:none;}
  .leaflet-popup-content a{color:var(--accent); font-weight:600; text-decoration:none;}
  /* 1日カレンダー */
  .dg{display:flex; margin-top:4px;}
  .dg-gutter{width:40px; flex:none;}
  .dg-hr{font-size:10px; color:var(--hint); text-align:right; padding-right:4px; box-sizing:border-box; transform:translateY(-6px);}
  .dg-col{flex:1; position:relative; border-left:1px solid var(--line); background-image:linear-gradient(var(--line) 1px, transparent 1px); background-repeat:repeat-y;}
  .dg-col.ng{background-color:#f4f1f1;}
  .dg-cell{position:absolute; left:0; right:0; cursor:pointer;}
  .dg-cell:active{background:var(--accent-soft);}
  .dg-ev{position:absolute; border-radius:6px; overflow:hidden; font-size:11px; line-height:1.25; padding:3px 6px; box-sizing:border-box; cursor:pointer; color:#fff;}

  .mem3{display:grid; grid-template-columns:1fr 1fr 92px; gap:5px; margin-bottom:5px;}

  /* 施術時間＝緑（移動の琥珀と色分け） */
  .tl-bk{background:#ecf7f1; border:1px solid #cfe9dd; border-left:3px solid var(--accent); border-radius:10px; padding:10px 13px; cursor:pointer;}

  .tl-bk .r1{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .tl-bk .nm{font-size:14px; font-weight:600;}
  .tl-bk .tt{font-size:12px; color:var(--muted); flex:none;}
  .tl-bk .mt{font-size:12px; color:var(--muted); margin-top:2px;}

  nav.tabs{position:fixed; left:0; right:0; bottom:0; max-width:500px; margin:0 auto; z-index:25; background:var(--surface); border-top:1px solid var(--line); display:flex;}
  nav.tabs button{flex:1; border:none; background:none; padding:9px 0 8px; color:var(--muted); font-size:10px; display:flex; flex-direction:column; align-items:center; gap:3px;}

  .modal-bg{position:fixed; inset:0; background:rgba(20,28,25,.45); z-index:40; display:none; align-items:flex-end; justify-content:center;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--surface); width:100%; max-width:580px; max-height:94vh; overflow:auto; border-radius:18px 18px 0 0; padding:18px 18px 28px;}
  @media(min-width:640px){ .modal-bg{align-items:center;} .modal{border-radius:18px;} }
  .modal h2{font-size:17px; margin-bottom:4px;}
  .modal .lead{font-size:13px; color:var(--muted); margin-bottom:6px;}
  label{display:block; font-size:13px; color:var(--muted); margin:12px 0 5px;}
  input,select,textarea{width:100%; font-family:inherit; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface); color:var(--text);}
  textarea{resize:vertical; min-height:54px;}
  .btn{display:block; width:100%; padding:13px; border:none; border-radius:var(--radius-sm); font-size:15px; font-weight:600; margin-top:16px;}

  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{padding:8px 14px; border:1px solid var(--line); border-radius:20px; font-size:14px; background:var(--surface);}
  .chip.sel{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-text);}
  .staff-chip{display:inline-flex; align-items:center; gap:6px;}
  .staff-chip .dot{width:9px; height:9px; border-radius:50%; flex:none;}
  .sdot{display:inline-block; width:8px; height:8px; border-radius:50%; vertical-align:middle; margin-right:2px;}
  .toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#1f2624; color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; z-index:60; opacity:0; transition:opacity .25s; pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header class="top" id="topbar" style="display:none">
  <div class="top-in">
    <div class="brand" id="brand">訪問美容 楽々アプリ<small>依頼から領収書まで、これ1つ</small></div>
  </div>
</header>

<div class="wrap" id="view"></div>

<nav class="tabs" id="tabs" style="display:none">
  <button data-tab="home" class="on" onclick="go('home')"><span class="ic">🏠</span>ホーム</button>

  <button data-tab="clients" onclick="go('clients')"><span class="ic">👥</span>顧客</button>

  <button data-tab="settings" onclick="go('settings')"><span class="ic">⚙️</span>設定</button>
</nav>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   訪問美容 楽々アプリ — フェーズ1 土台（ローカル完結 / Sheets・GAS 非接続）
   データは端末内 localStorage のみ。鉄則「手修正＝正」を確認UIに反映予定。
   ========================================================================= */

var STORE_KEY = "rakuraku_v1";
var DB = loadDB();
var tab = "home";
var current = new Date();           // 表示中の日
var KINDS = ["個人","施設","病院"]; // 顧客先の区分

/* ---------- 永続化 ---------- */
function loadDB(){ try{ var r=localStorage.getItem(STORE_KEY); if(r) return JSON.parse(r); }catch(e){} return emptyDB(); }
function saveDB(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); return true; }catch(e){ toast("保存容量の上限です。写真を減らすかクラウド接続を検討してください"); return false; } }
function emptyDB(){ return { settings:{ready:false, mode:"solo", openHour:9, closeHour:18, slotMin:60, priceList:[]}, staff:[], clients:[], members:[], bookings:[], records:[], inbox:[], blocked:[], timeBlocks:[], rcDraft:null }; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- 小物 ---------- */
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayStr(){ return ymd(new Date()); }
function fmtDate(ds){ var d=new Date(ds+"T00:00:00"); var w=["日","月","火","水","木","金","土"]; return (d.getMonth()+1)+"月"+d.getDate()+"日("+w[d.getDay()]+")"; }
function yen(n){ return "¥"+(Number(n)||0).toLocaleString("ja-JP"); }
function esc(s){ return (s==null?"":s).toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(function(){t.classList.remove("show");},1700); }
function openModal(h){ document.getElementById("modal").innerHTML=h; document.getElementById("modalBg").classList.add("open"); }
function closeModal(){ window._rcOpen=false; document.getElementById("modalBg").classList.remove("open"); }

/* ---------- 参照ヘルパ ---------- */
function clientOf(id){ return DB.clients.find(function(c){return c.id===id;}); }
function clientName(id){ var c=clientOf(id); return c?c.name:"(不明)"; }
function membersOf(cid){ return DB.members.filter(function(m){return m.clientId===cid;}); }
function memberOf(id){ return DB.members.find(function(m){return m.id===id;}); }
function staffName(id){ var s=DB.staff.find(function(x){return x.id===id;}); return s?s.name:"未割当"; }
var STAFF_COLORS=["#1d9e75","#2f6fd8","#d8852f","#9b5bd8","#c0398a","#2fb3b3","#c0392b"];
// スタッフ色（登録順でパレットから必ず割当＝全員が別色。旧デフォルト緑の混在を回避）
function staffColor(id){
  var i=DB.staff.findIndex(function(x){return x.id===id;});
  if(i<0) return "#9aa0a6";
  return STAFF_COLORS[i%STAFF_COLORS.length];
}
function nextStaffColor(){ return STAFF_COLORS[DB.staff.length % STAFF_COLORS.length]; }
// 予約の代表色（最初の担当の色）
function bookingColor(b){ var ids=(b.staffIds||[]); return ids.length?staffColor(ids[0]):"var(--accent)"; }
// 同一スタッフのダブルブッキング検出（施術＋移動の時間帯が重なる別予約に同じ担当がいるか）
function staffDoubleBook(date, sMin, eMin, staffIds, excludeId){
  var hits=[];
  if(!staffIds||!staffIds.length) return hits;
  DB.bookings.forEach(function(b){
    if(b.id===excludeId || b.date!==date || !b.time) return;
    var bs=t2m(b.time), be=bs+bkDur(b)+(Number(b.travelMin)||0);
    if(!ov(sMin,eMin,bs,be)) return;
    (b.staffIds||[]).forEach(function(sid){ if(staffIds.indexOf(sid)>=0){ var nm=staffName(sid); if(hits.indexOf(nm)<0) hits.push(nm); } });
  });
  return hits;
}
function confirmDoubleBook(date, time, duration, travelMin, staffIds, excludeId){
  if(!time) return true;
  var sMin=t2m(time), eMin=sMin+(Number(duration)||0)+(Number(travelMin)||0);
  var hits=staffDoubleBook(date, sMin, eMin, staffIds, excludeId);
  if(!hits.length) return true;
  return confirm("⚠️ "+hits.join("・")+" は同じ時間帯に別の予約があります。\nこのまま登録するとダブルブッキングになります。よろしいですか？");
}
function bookingsOfDay(ds){ return DB.bookings.filter(function(b){return b.date===ds;}).sort(function(a,b){return (a.time||"").localeCompare(b.time||"");}); }
function recOfBooking(bid){ return DB.records.filter(function(r){return r.bookingId===bid;}); }
// カルテ用：顧客先／利用者の施術履歴（中身のある実績のみ・新しい順）
function recHasContent(r){ return (Number(r.amount)>0)||r.menu||r.note; }
function recordsOfClient(cid){ return DB.records.filter(function(r){return r.clientId===cid && recHasContent(r);}).sort(function(a,b){return (b.date||"").localeCompare(a.date||"");}); }
function recordsOfMember(mid){ return DB.records.filter(function(r){return r.memberId===mid && recHasContent(r);}).sort(function(a,b){return (b.date||"").localeCompare(a.date||"");}); }
function bookingTotal(bid){ return recOfBooking(bid).reduce(function(a,r){return a+(Number(r.amount)||0);},0); }
function bookingTravel(bid){ var b=DB.bookings.find(function(x){return x.id===bid;}); return b?(Number(b.travel)||0):0; }
function inboxTodo(){ return DB.inbox.filter(function(i){return i.status!=="取込済";}).length; }
function dayBlocked(ds){ return (DB.blocked||[]).indexOf(ds)>=0; }
function toggleBlock(ds){ DB.blocked=DB.blocked||[]; var i=DB.blocked.indexOf(ds); if(i>=0) DB.blocked.splice(i,1); else DB.blocked.push(ds); saveDB(); render(); toast(i>=0?"予約OKに戻しました":"予約不可にしました"); }
// 時間単位の予約不可枠（休憩・外出など自由に作成）
function timeBlocksOfDay(ds){ return (DB.timeBlocks||[]).filter(function(t){return t.date===ds;}); }
function openBlockSlot(ds, time){
  openModal('<h2>予約不可にする</h2>'+
    '<p class="lead">'+esc(fmtDate(ds))+' の予約を受けない時間を作ります（休憩・外出・私用など）。</p>'+
    '<div class="row-2"><div><label>開始</label><input type="time" id="tbTime" value="'+esc(time||"")+'"></div>'+
    '<div><label>長さ</label>'+durField("tbDur", sSlot(), [], false)+'</div></div>'+
    '<label>内容（任意）</label><input id="tbLabel" placeholder="例）休憩 / 外出 / 私用">'+
    '<button class="btn primary" onclick="saveBlockSlot(\''+ds+'\')">この時間を予約不可にする</button>'+
    '<button class="btn ghost" onclick="closeModal()">キャンセル</button>');
}
function saveBlockSlot(ds){
  var time=(document.getElementById("tbTime")||{}).value; if(!time){ toast("開始時間を入れてください"); return; }
  var dur=Number((document.getElementById("tbDur")||{}).value)||sSlot(); if(dur<15) dur=sSlot();
  var label=((document.getElementById("tbLabel")||{}).value||"").trim();
  DB.timeBlocks=DB.timeBlocks||[];
  DB.timeBlocks.push({ id:uid(), date:ds, time:time, duration:dur, label:label });
  saveDB(); closeModal(); render(); toast("予約不可枠を作成しました");
}
function delTimeBlock(id){ DB.timeBlocks=(DB.timeBlocks||[]).filter(function(t){return t.id!==id;}); saveDB(); render(); toast("予約不可を解除しました"); }
/* 営業時間・枠（タイムライン用） */
function sOpen(){ return DB.settings.openHour!=null?DB.settings.openHour:9; }
function sClose(){ return DB.settings.closeHour!=null?DB.settings.closeHour:18; }
function sSlot(){ return DB.settings.slotMin||60; }
function t2m(t){ var p=(t||"0:0").split(":"); return (+p[0])*60+(+p[1]||0); }
function m2t(m){ return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function bkDur(b){ return Number(b.duration)||sSlot(); }
function fmtDur(min){ min=Number(min)||0; var hh=Math.floor(min/60), mm=min%60; return (hh?hh+"時間":"")+(mm?mm+"分":(hh?"":"0分")); }
// 所要時間/移動時間の入力（15分単位ドロップダウン・最大6時間→終日）
// allday=true: 終日選択あり（所要時間）／false: 先頭に「なし」（移動時間）
function durField(id, val, presets, allday){
  val=Number(val)||0;
  var alldayMin=Math.max((sClose()-sOpen())*60, 360); // 終日＝営業時間（最低6h）
  var isAllday=allday && val>=alldayMin;
  var matched=(val<=0);
  var opts="";
  if(!allday) opts+='<option value="0"'+(val<=0?" selected":"")+'>なし</option>';
  for(var m=15;m<=360;m+=15){
    var sel=(val===m); if(sel) matched=true;
    opts+='<option value="'+m+'"'+(sel?" selected":"")+'>'+fmtDur(m)+'</option>';
  }
  if(allday) opts+='<option value="'+alldayMin+'"'+(isAllday?" selected":"")+'>終日（'+fmtDur(alldayMin)+'）</option>';
  if(val>0 && !matched && !isAllday) opts+='<option value="'+val+'" selected>'+fmtDur(val)+'（その他）</option>';
  return '<select id="'+id+'" class="durselect">'+opts+'</select>';
}
function ov(a1,a2,b1,b2){ return a1<b2 && a2>b1; }

/* ---------- メニュー料金表（施設別＞共通） ---------- */
function priceListOf(clientId){
  var c=clientId&&clientOf(clientId);
  return (c && c.priceList) ? c.priceList : [];
}
// 受付フォームで①料金表を入力中なら、未保存でもその場の入力を②に即反映（新規施設対応）
function livePriceList(clientId){
  var rows=document.getElementById('plRows');
  if(rows){
    var cnt=Number((document.getElementById('plCount')||{}).value)||0;
    var live=[];
    for(var i=0;i<cnt;i++){
      var me=document.getElementById('plMenu_'+i); if(!me) continue;
      var mn=(me.value||'').trim(); if(!mn) continue;
      var pr=Number((document.getElementById('plPrice_'+i)||{}).value)||0;
      live.push({menu:mn, price:pr});
    }
    if(live.length) return live;
  }
  return priceListOf(clientId);
}
// 施設のメニュー料金を一覧表示（入力欄の上に羅列）
function priceListRef(clientId){
  var pl=priceListOf(clientId);
  if(!pl.length) return '<div style="font-size:12px;color:var(--hint);margin-bottom:8px;line-height:1.7;">💡 メニューと金額は手で入力できます。<br>この施設のメニュー料金を一度登録しておくと、次回から<b>メニューを選ぶだけで金額が入ります</b>（任意）。</div>';
  return '<div class="card" style="padding:10px 12px;margin-bottom:8px;background:#f6faf8;border-color:#cfe9dd;">'+
    '<div style="font-size:12px;font-weight:600;color:var(--accent-text);margin-bottom:4px;">この施設の料金表（メニュー＝値段）</div>'+
    '<div style="font-size:13px;line-height:1.9;">'+pl.map(function(e){return esc(e.menu)+' <b>'+yen(e.price)+'</b>';}).join('　／　')+'</div></div>';
}
// 受付の施設セクション：①メニュー料金（未登録ならその場で登録可）②この回の利用者
function facilitySection(cid){
  var hasPL=priceListOf(cid).length>0;
  var h="";
  if(hasPL){
    h+=priceListRef(cid);
  } else {
    h+='<div class="card" style="background:#f6faf8;border-color:#cfe9dd;padding:11px 12px;margin-bottom:10px;">'+
       '<div style="font-size:13px;font-weight:600;color:var(--accent-text);margin-bottom:2px;">① この施設のメニューと料金</div>'+
       '<div style="font-size:12px;color:var(--muted);margin-bottom:6px;">FAXの料金表をここで登録（任意）。登録すると下の利用者は<b>メニューを選ぶだけで金額が自動</b>。次回も使い回せます。</div>'+
       priceListEditor([])+'</div>';
  }
  h+='<div style="font-size:13px;font-weight:600;margin:4px 0 2px;">'+(hasPL?"":"② ")+'この回の利用者</div>'+
     '<div style="font-size:12px;color:var(--hint);margin-bottom:6px;">毎月その回の人を入力。<b>何十人でも「📋名簿をまとめて貼り付け」</b>で一括OK。登録済みの人は誤字を自動補正します。</div>'+
     rosterEntryHtml();
  return h;
}
// 希望者の1行入力（名前＋メニュー→金額自動）。何十人でもコンパクトに並ぶ
function memberCard(idx, prefix, clientId, name, menu, amount, note){
  var nameId=prefix+"Name_"+idx, menuId=prefix+"Menu_"+idx, amtId=prefix+"Amt_"+idx, noteId=prefix+"Note_"+idx;
  return '<div class="memrow">'+
    '<input id="'+nameId+'" class="m-name" value="'+esc(name||"")+'" placeholder="利用者名">'+
    menuCell(menuId, amtId, clientId, menu||"")+
    '<input id="'+amtId+'" class="m-amt" type="number" inputmode="numeric" value="'+(amount||amount===0?amount:"")+'" placeholder="¥">'+
    '<input id="'+noteId+'" type="hidden" value="'+esc(note||"")+'">'+
    '<button type="button" class="m-del" title="削除" onclick="this.closest(\'.memrow\').remove()">×</button>'+
    '</div>';
}
// 料金表を持つ他の施設（コピー元候補）
function clPriceCopyUI(excludeId){
  var srcs=DB.clients.filter(function(c){return c.id!==excludeId && c.priceList && c.priceList.length;});
  if(!srcs.length) return "";
  return '<select onchange="clCopyPrices(this.value)" style="margin-bottom:8px;"><option value="">📋 他の施設から料金をコピー…</option>'+
    srcs.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join("")+'</select>';
}
function clCopyPrices(srcId){
  if(!srcId) return; var c=clientOf(srcId); if(!c||!c.priceList) return;
  var rows=document.getElementById("plRows"); rows.innerHTML=""; document.getElementById("plCount").value=0;
  c.priceList.forEach(function(e){ plAdd(); var n=Number(document.getElementById("plCount").value)-1; document.getElementById("plMenu_"+n).value=e.menu; document.getElementById("plPrice_"+n).value=e.price; });
  toast(c.name+"の料金をコピーしました");
}
// メニュー名の正規化（カッコ注記・空白を除去）。「顔剃り（剃刀使用）」→「顔剃り」
function normMenu(s){ return (s||"").replace(/[（(\[【［].*?[）)\]】］]/g,"").replace(/[\s　]/g,"").trim(); }
// 複合メニューを区切って単品名に分解
function menuParts(s){ return (s||"").split(/[・、，,＋+／\/＆&\s]+/).map(function(x){return x.trim();}).filter(Boolean); }
function isComboMenu(menu){ return menuParts(menu).length>1; }
// 料金表から1メニューを照合：完全一致→正規化一致→1文字違い（剃り/そり等）の順
function bestMenuMatch(list, name){
  name=(name||"").trim(); if(!name) return null;
  var e=list.find(function(x){return x.menu===name;}); if(e) return e;
  var nn=normMenu(name);
  e=list.find(function(x){return normMenu(x.menu)===nn;}); if(e) return e;
  if(nn.length>=3){ var best=null,bd=99; list.forEach(function(x){ var d=lev(nn, normMenu(x.menu)); if(d<bd){bd=d;best=x;} }); if(best && bd<=1) return best; }
  return null;
}
function priceFor(clientId, menu){
  menu=(menu||"").trim(); if(!menu) return null;
  var list=livePriceList(clientId);
  // ① 入力そのものが登録メニューに一致（セット料金「カット、顔剃り」等を優先）
  var direct=bestMenuMatch(list, menu);
  if(direct) return Number(direct.price)||0;
  // ② 複合メニュー（カット・顔そり 等）：各パートを単品に解決
  var parts=menuParts(menu);
  if(parts.length>1){
    var singles=list.filter(function(x){return !isComboMenu(x.menu);});
    var resolved=parts.map(function(p){ return bestMenuMatch(singles, p); });
    if(resolved.every(Boolean)){
      var key=resolved.map(function(e){return e.menu;}).sort().join("|");
      // ②-a 同じ組合せのセット料金が登録済みならそれを使う
      var set=list.find(function(x){
        if(!isComboMenu(x.menu)) return false;
        var rp=menuParts(x.menu).map(function(p){return bestMenuMatch(singles,p);});
        if(!rp.every(Boolean)) return false;
        return rp.map(function(e){return e.menu;}).sort().join("|")===key;
      });
      if(set) return Number(set.price)||0;
      // ②-b なければ各単品を合算
      return resolved.reduce(function(a,e){return a+(Number(e.price)||0);},0);
    }
  }
  return null;
}
/* 利用者ストック照合：登録済み利用者の中から、軽微な誤字を補正した正式名を返す（人の取り違え防止に控えめ） */
function lev(a,b){ a=a||"";b=b||""; var m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  var d=[]; for(var i=0;i<=m;i++)d[i]=[i]; for(var j=0;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){ var c=a[i-1]===b[j-1]?0:1; d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c); }
  return d[m][n]; }
function normName(s){ return (s||"").replace(/[\s　]/g,""); }
function canonName(clientId, name){
  if(!clientId) return name;
  var nn=normName(name); if(nn.length<2) return name;
  var best=null,bestD=99;
  membersOf(clientId).forEach(function(m){ var d=lev(nn, normName(m.name)); if(d<bestD){bestD=d; best=m;} });
  if(best && (bestD===0 || (bestD===1 && nn.length>=3))) return best.name; // 完全一致 or 3文字以上で1文字違い
  return name;
}
function menuDatalist(clientId){
  return '<datalist id="menuDL">'+livePriceList(clientId).map(function(e){return '<option value="'+esc(e.menu)+'">';}).join("")+'</datalist>';
}
// メニュー入力(menuId)が変わったら、料金表から amtId に料金を自動セット
function fillPrice(menuId, amtId, clientId){
  var m=(document.getElementById(menuId)||{}).value;
  var p=priceFor(clientId, m);
  if(p!=null){ var a=document.getElementById(amtId); if(a) a.value=p; }
}
// メニュー欄：料金表があればドロップダウン（選ぶだけ→価格自動）、無ければ自由入力
// ①で入力中の料金表(livePriceList)も反映＝新規施設でも②でメニューを選べば金額自動
function menuCell(menuId, amtId, clientId, selMenu){
  selMenu=selMenu||"";
  var pl=livePriceList(clientId);
  if(!pl.length){
    return '<input id="'+menuId+'" class="m-menu" list="menuDL" value="'+esc(selMenu)+'" placeholder="メニュー" onchange="fillPrice(\''+menuId+'\',\''+amtId+'\',\''+(clientId||"")+'\')">';
  }
  var found=false;
  var opts='<option value="">メニューを選ぶ</option>'+pl.map(function(e){
    var s=e.menu===selMenu; if(s)found=true; return '<option'+(s?' selected':'')+'>'+esc(e.menu)+'</option>'; }).join("");
  if(selMenu && !found) opts+='<option selected>'+esc(selMenu)+'</option>';
  return '<select id="'+menuId+'" class="m-menu" onchange="fillPrice(\''+menuId+'\',\''+amtId+'\',\''+(clientId||"")+'\')">'+opts+'</select>';
}

function priceListEditor(rows){
  rows=rows||[];
  return '<div id="plRows">'+rows.map(function(r,i){return plRow(i,r.menu,r.price);}).join("")+'</div>'+
    '<button type="button" class="add-link" onclick="plAdd()">＋ メニューを追加</button>'+

      '<button type="button" class="btn ghost" style="margin-top:6px;" onclick="plBulkAdd()">この料金表を追加</button></details>';
}
function plBulkAdd(){
  var t=document.getElementById("plBulk"); if(!t) return;
  var lines=t.value.split(/\r?\n/).map(function(s){return s.trim();}).filter(Boolean);
  if(!lines.length){ toast("料金表を貼り付けてください"); return; }
  lines.forEach(function(ln){
    var m=ln.match(/^(.+?)[\s,、　]+([0-9][0-9,]*)\s*円?$/);
    plAdd(); var n=Number(document.getElementById("plCount").value)-1;
    if(m){ document.getElementById("plMenu_"+n).value=m[1].trim(); document.getElementById("plPrice_"+n).value=m[2].replace(/[^0-9]/g,""); }
    else { document.getElementById("plMenu_"+n).value=ln; }
  });
  t.value=""; toast(lines.length+"件 追加しました");
}
function plRow(i, menu, price){
  return '<div class="mem3" style="grid-template-columns:1fr 92px 30px;"><input id="plMenu_'+i+'" value="'+esc(menu||"")+'" placeholder="メニュー（例：カット）">'+
    '<input id="plPrice_'+i+'" type="number" inputmode="numeric" value="'+(price||"")+'" placeholder="料金" style="text-align:right;">'+
    '<button type="button" onclick="this.parentNode.remove()" style="border:none;background:none;color:var(--hint);font-size:16px;">×</button></div>';
}
function plAdd(){ var n=Number(document.getElementById("plCount").value)||0; var d=document.createElement("div"); d.innerHTML=plRow(n,"",""); document.getElementById("plRows").appendChild(d.firstChild); document.getElementById("plCount").value=n+1; }
function plCollect(){ var n=Number(document.getElementById("plCount").value)||0, out=[]; for(var i=0;i<n;i++){ var me=document.getElementById("plMenu_"+i); if(!me)continue; var menu=me.value.trim(); if(!menu)continue; out.push({menu:menu, price:Number((document.getElementById("plPrice_"+i)||{}).value)||0}); } return out; }

    '<label>顧客先</label><select id="rcClient" onchange="rcClientChange()">'+clientOpts+'</select>'+

    '<label>受付経路</label>'+
    '<div class="chips" id="rcSrc">'+["電話","FAX","メール","LINE","紹介","その他"].map(function(s,i){
      return '<button class="chip'+(i===0?" sel":"")+'" onclick="rcPick(\'rcSrc\',this)">'+s+'</button>'; }).join("")+'</div>'+
    '<div class="row-2"><div><label>日付</label><input type="date" id="rcDate" value="'+(opt.date||ymd(current))+'"></div>'+
    '<div><label>時間</label><input type="time" id="rcTime" value="'+(opt.time||"10:00")+'"></div></div>'+
    '<label>利用者・施術（メニュー・金額）</label>'+
    '<div id="rcMembers"></div>'+
    '<label>所要時間（施術トータル）</label>'+durField("rcDuration", sSlot(), [30,60,90,120,180], true)+
    '<label>担当</label>'+
    '<div class="chips" id="rcStaff">'+staffChipsHtml()+'</div>'+
    '<label>出張交通費（円・任意）</label><input type="number" id="rcTravel" placeholder="0" inputmode="numeric">'+
    '<label>移動時間（この後・予約不可になります）</label>'+durField("rcTravelMin", 0, [0,15,30,45,60], false)+
    '<label>メモ（依頼内容）</label><textarea id="rcMemo" placeholder="連絡事項など">'+esc(opt.memo||"")+'</textarea>'+
    '<button class="btn primary" onclick="saveReception()">この内容で予約する</button>'+
    '<button class="btn ghost" onclick="rcSaveDraft(false)">💾 一時保存（閉じても残る）</button>'+
    '<button class="btn ghost" onclick="closeModal()">閉じる</button>');
  // 顧客カルテ等から顧客指定で開いた時は流用優先（下書き復元はしない）
  var draft = (!opt.clientId && rcDraftHasContent(DB.rcDraft)) ? DB.rcDraft : null;
  if(draft){
    rcApplyDraft(draft);
    // 日付・時間など、明示指定があれば上書き（タイムライン枠からの受付など）
    if(opt.date) document.getElementById("rcDate").value=opt.date;
    if(opt.time) document.getElementById("rcTime").value=opt.time;
    if(opt.memo) document.getElementById("rcMemo").value=opt.memo;
    document.getElementById("rcDraftBar").innerHTML=
      '<div class="draftbar">📝 入力途中を復元しました'+
      '<button onclick="rcDiscardDraft()">🗑 破棄して新規</button></div>';
  } else {
    if(opt.clientId){ var cs=document.getElementById("rcClient"); if(cs) cs.value=opt.clientId; }
    rcClientChange();
    if(opt.reuse) applyReuse(opt.reuse); // 前回データを流用
  }
  window._rcOpen=true;
  rcEnsureAutosave();
}
/* ---------- 受付フォームの下書き 自動保存／復元 ---------- */
// 入力のたびにDB.rcDraftへ保存（localStorage）＝閉じても途中から再開できる
function rcEnsureAutosave(){
  if(window._rcAutosaveAttached) return;
  var modal=document.getElementById("modal");
  var h=function(){ if(!window._rcOpen) return; clearTimeout(window._rcSaveTimer); window._rcSaveTimer=setTimeout(function(){rcSaveDraft(true);}, 600); };
  modal.addEventListener("input", h, true);
  modal.addEventListener("change", h, true);
  window._rcAutosaveAttached=true;
}
function rcCollectMembers(){
  if(document.getElementById("rcNewMemList")){
    var arr=[], cnt=Number((document.getElementById("rcNewMemCount")||{}).value)||0;
    for(var i=0;i<cnt;i++){
      var ne=document.getElementById("rcNewMemName_"+i); if(!ne) continue;
      arr.push({ name:ne.value, menu:(document.getElementById("rcNewMemMenu_"+i)||{}).value||"",
        amount:(document.getElementById("rcNewMemAmt_"+i)||{}).value||"", note:(document.getElementById("rcNewMemNote_"+i)||{}).value||"" });
    }
    return {mode:"roster", rows:arr};
  }
  if(document.getElementById("rcMenu_self")){
    return {mode:"self", menu:(document.getElementById("rcMenu_self")||{}).value||"", amount:(document.getElementById("rcAmt_self")||{}).value||""};
  }
  var ex=[];
  Array.prototype.forEach.call(document.querySelectorAll('[id^="rcMenu_"]'), function(el){
    var key=el.id.replace("rcMenu_",""); if(key==="self") return;
    ex.push({key:key, menu:el.value||"", amount:(document.getElementById("rcAmt_"+key)||{}).value||""});
  });
  return {mode:"existing", rows:ex};
}
function rcCollectDraft(){
  if(!document.getElementById("rcClient")) return null;
  function v(id){ var e=document.getElementById(id); return e?e.value:""; }
  function selText(g){ var e=document.querySelector("#"+g+" .chip.sel"); return e?e.textContent.trim():""; }
  return {
    clientId:v("rcClient"), newName:v("rcNewName"), kind:selText("rcKind"),
    newAddr:v("rcNewAddr"), newPhone:v("rcNewPhone"), src:selText("rcSrc"),
    date:v("rcDate"), time:v("rcTime"), duration:v("rcDuration"), travelMin:v("rcTravelMin"),
    travel:v("rcTravel"), memo:v("rcMemo"), staffIds:rcSelectedStaff(),
    priceList:(document.getElementById("plRows")?plCollect():null),
    members:rcCollectMembers()
  };
}
function rcDraftHasContent(d){
  if(!d) return false;
  if((d.newName||"").trim() || (d.memo||"").trim() || d.clientId) return true;
  if(d.priceList && d.priceList.length) return true;
  var m=d.members;
  if(m){
    if(m.mode==="roster") return (m.rows||[]).some(function(r){return (r.name||"").trim();});
    if(m.mode==="self") return !!((m.menu||"")||(m.amount||""));
    if(m.mode==="existing") return (m.rows||[]).some(function(r){return (r.menu||"")||(r.amount||"");});
  }
  return false;
}
function rcSaveDraft(silent){
  if(!window._rcOpen) return;
  var d=rcCollectDraft();
  if(!rcDraftHasContent(d)){ if(DB.rcDraft){ DB.rcDraft=null; saveDB(); } if(!silent) toast("保存する入力がありません"); return; }
  d.savedAt=Date.now(); DB.rcDraft=d; saveDB();
  if(!silent) toast("一時保存しました（閉じても残ります）");
}
function rcClearDraft(){ if(DB.rcDraft){ DB.rcDraft=null; saveDB(); } }
function rcDiscardDraft(){ rcClearDraft(); window._rcOpen=false; openReception(); }
function rcApplyDraft(d){
  function set(id,val){ var e=document.getElementById(id); if(e && val!=null && val!=="") e.value=val; }
  // 顧客先・区分
  if(d.clientId){ var cs=document.getElementById("rcClient"); if(cs) cs.value=d.clientId; }
  if(d.kind){ var kb=Array.prototype.find.call(document.querySelectorAll("#rcKind .chip"),function(b){return b.textContent.trim()===d.kind;}); if(kb) rcPick("rcKind",kb); }
  set("rcNewName",d.newName); set("rcNewAddr",d.newAddr); set("rcNewPhone",d.newPhone);
  if(d.src){ var sb=Array.prototype.find.call(document.querySelectorAll("#rcSrc .chip"),function(b){return b.textContent.trim()===d.src;}); if(sb) rcPick("rcSrc",sb); }
  set("rcDate",d.date); set("rcTime",d.time); set("rcTravel",d.travel); set("rcMemo",d.memo);
  var dStaff = d.staffIds || (d.staffId?[d.staffId]:null);
  if(dStaff && dStaff.length) rcRenderStaff(dStaff);
  if(d.duration){ var du=document.getElementById("rcDuration"); if(du) du.value=d.duration; }
  if(d.travelMin){ var tm=document.getElementById("rcTravelMin"); if(tm) tm.value=d.travelMin; }
  // 利用者欄を顧客先・区分に合わせて再描画
  document.getElementById("rcNew").style.display = d.clientId?"none":"";
  rcRenderMembers();
  // ①料金表（新規施設で入力途中だったもの）を復元
  if(d.priceList && d.priceList.length && document.getElementById("plRows")){
    var rows=document.getElementById("plRows"); rows.innerHTML=""; document.getElementById("plCount").value=0;
    d.priceList.forEach(function(e){ plAdd(); var n=Number(document.getElementById("plCount").value)-1;
      var me=document.getElementById("plMenu_"+n), pe=document.getElementById("plPrice_"+n);
      if(me) me.value=e.menu; if(pe) pe.value=e.price; });
  }
  // ②利用者を復元
  var m=d.members;
  if(m){
    if(m.mode==="roster" && document.getElementById("rcNewMemList")){
      document.getElementById("rcNewMemList").innerHTML=""; document.getElementById("rcNewMemCount").value=0;
      m.rows.forEach(function(r){ rcAddNewMember(r.name, r.menu, r.amount);
        var idx=Number(document.getElementById("rcNewMemCount").value)-1;
        var nf=document.getElementById("rcNewMemNote_"+idx); if(nf && r.note) nf.value=r.note; });
    } else if(m.mode==="self"){
      set("rcMenu_self", m.menu); set("rcAmt_self", m.amount);
    } else if(m.mode==="existing"){
      m.rows.forEach(function(r){ set("rcMenu_"+r.key, r.menu); set("rcAmt_"+r.key, r.amount); });
    }
  }
}

// 担当チップ（受付）。複数選択可（複数で行く場合）＋色分け。未登録でも「＋担当を追加」でその場追加

function rcRenderMembers(){
  var box=document.getElementById("rcMembers"); if(!box) return;
  var cid=document.getElementById("rcClient").value;
  var dl=menuDatalist(cid);
  window._rcClientId=cid||"";
  if(cid){

      box.innerHTML=dl+facilitySection(cid);
      rcAddNewMember();
      return;
    }
    var mems=membersOf(cid);
    box.innerHTML = dl+(mems.length
      ? mems.map(function(m){ return rcMemRow(m.id, m.name, m.defaultMenu||"", (m.defaultPrice||priceFor(cid,m.defaultMenu)||""), cid); }).join("")
      : '<div style="color:var(--hint);font-size:13px;">利用者が未登録です。下のメモか、登録後に入力できます。</div>');

function rcAddNewMember(name, menu, amt){
  var list=document.getElementById("rcNewMemList"); if(!list) return;
  var n=Number(document.getElementById("rcNewMemCount").value)||0;
  if((amt===undefined||amt==="") && menu){ var pf=priceFor(window._rcClientId, menu); if(pf!=null) amt=pf; }
  var div=document.createElement("div");
  div.innerHTML=memberCard(n, "rcNewMem", window._rcClientId, name||"", menu||"", amt||"", "");
  list.appendChild(div.firstChild);
  document.getElementById("rcNewMemCount").value=n+1;

// 名簿を一括貼り付け（1行1人。「氏名」または「氏名,メニュー,金額」）
function rcBulkAdd(){
  var t=document.getElementById("rcBulk"); if(!t) return;
  var lines=t.value.split(/\r?\n/).map(function(s){return s.trim();}).filter(Boolean);
  if(!lines.length){ toast("名簿を貼り付けてください"); return; }
  lines.forEach(function(ln){
    var p=ln.split(/[,\t、　]+/).map(function(s){return s.trim();});
    rcAddNewMember(p[0]||"", p[1]||"", (p[2]||"").replace(/[^0-9]/g,""));
  });
  t.value="";
  toast(lines.length+"名を追加しました");
}
// 利用者の金額を、選択メニューから一括で再計算（複合メニューも合算）。未入力／0のみ補完し手入力は残す
function rcRecalcAmounts(){
  var cnt=Number((document.getElementById("rcNewMemCount")||{}).value)||0, filled=0;
  for(var i=0;i<cnt;i++){
    var me=document.getElementById("rcNewMemMenu_"+i), ae=document.getElementById("rcNewMemAmt_"+i);
    if(!me || !ae) continue;
    if((Number(ae.value)||0)>0) continue; // 手入力済みの金額は尊重
    var p=priceFor(window._rcClientId, me.value);
    if(p!=null){ ae.value=p; filled++; }
  }
  toast(filled?(filled+"件の金額を計算しました"):"再計算する金額はありませんでした");
  rcSaveDraft(true);
}
function saveReception(){
  var clientId=document.getElementById("rcClient").value;
  var staffIds=rcSelectedStaff(); var staffId=staffIds[0]||(DB.staff[0]?DB.staff[0].id:null);
  // 1) 顧客先を確定（新規なら作成）
  if(!clientId){
    var nm=document.getElementById("rcNewName").value.trim();
    if(!nm){ toast("顧客先の名前を入力してください"); return; }
    var kEl=rcSel("rcKind"); var kind=kEl?kEl.textContent:"個人";
    var c={ id:uid(), kind:kind, name:nm, address:document.getElementById("rcNewAddr").value.trim(), phone:(document.getElementById("rcNewPhone")||{}).value||"", billing:(kind==="施設"?"一括":"個別"), rules:"", memo:"", priceList:[] };
    DB.clients.push(c); clientId=c.id;
  }
  // 1.5) その場で入力された施設のメニュー料金を保存（次回から自動）
  if(document.getElementById("plRows")){
    var pl=plCollect(); if(pl.length){ var cc=clientOf(clientId); if(cc) cc.priceList=pl; }
  }
  // 2) 入力モードで施術行を集める
  var entries=[];
  if(document.getElementById("rcNewMemList")){
    // ロスター入力（新規施設 / 既存施設の毎月リセット）：ストックで誤字補正＋既存は再利用
    var cnt=Number((document.getElementById("rcNewMemCount")||{}).value)||0;
    for(var i=0;i<cnt;i++){
      var ne=document.getElementById("rcNewMemName_"+i); if(!ne) continue;
      var name=ne.value.trim(); if(!name) continue;
      name=canonName(clientId, name);
      var menu=((document.getElementById("rcNewMemMenu_"+i)||{}).value||"").trim();
      var amt=Number((document.getElementById("rcNewMemAmt_"+i)||{}).value)||0;
      if(!amt && menu){ var pf=priceFor(clientId, menu); if(pf!=null) amt=pf; } // 料金表が確定したので補完
      var note=((document.getElementById("rcNewMemNote_"+i)||{}).value||"").trim();
      var mem=membersOf(clientId).find(function(m){return m.name===name;});
      if(!mem){ mem={ id:uid(), clientId:clientId, name:name, kana:"", defaultMenu:menu, defaultPrice:amt, staffId:staffId }; DB.members.push(mem); }
      entries.push({ memberId:mem.id, menu:menu, amount:amt, note:note });
    }
  } else if(document.getElementById("rcMenu_self")){
    // 新規 個人/病院：本人
    var selfMenu=((document.getElementById("rcMenu_self")||{}).value||"").trim();
    var selfAmt=Number((document.getElementById("rcAmt_self")||{}).value)||0;
    var sid=uid(); DB.members.push({ id:sid, clientId:clientId, name:clientOf(clientId).name, kana:"", defaultMenu:selfMenu, defaultPrice:selfAmt, staffId:staffId });
    entries.push({ memberId:sid, menu:selfMenu, amount:selfAmt });
  } else {
    // 既存 個人/病院：自動表示の利用者
    membersOf(clientId).forEach(function(m){
      var menuEl=document.getElementById("rcMenu_"+m.id); if(!menuEl) return;
      entries.push({ memberId:m.id, menu:menuEl.value.trim(), amount:Number((document.getElementById("rcAmt_"+m.id)||{}).value)||0 });
    });
  }
  var srcEl=rcSel("rcSrc");
  var b={ id:uid(), clientId:clientId, date:document.getElementById("rcDate").value, time:document.getElementById("rcTime").value,
    duration:Number(document.getElementById("rcDuration").value)||sSlot(),
    travelMin:Number(document.getElementById("rcTravelMin").value)||0,
    staffIds: (staffIds.length?staffIds:(staffId?[staffId]:[])), travel:Number(document.getElementById("rcTravel").value)||0,
    source: srcEl?srcEl.textContent:"", memo:document.getElementById("rcMemo").value.trim(), status:"予定", memberIds:[] };

// 縦タイムライン：営業時間を枠割りし、予約で埋める／空き枠から受付
function renderTimeline(ds){
  var blk=dayBlocked(ds);
  // 枠は毎時:00始まりに揃える（営業が:30始まりでも、16:00予約は16:00枠に出る）
  var open=Math.floor(sOpen())*60, close=Math.ceil(sClose())*60, slot=sSlot();
  var bks=bookingsOfDay(ds);
  var tbs=timeBlocksOfDay(ds);
  var placed={}, h="";
  // 重なりのない予約は連結ブロック、重なる予約だけ分割（並行）表示
  function bkOverlaps(b){ var s=t2m(b.time), e2=s+bkDur(b); return bks.some(function(o){ if(o.id===b.id||!o.time) return false; var os=t2m(o.time), oe=os+bkDur(o); return ov(s,e2,os,oe); }); }
  var soloIds={}; bks.forEach(function(b){ if(b.time) soloIds[b.id]=!bkOverlaps(b); });
  for(var mm=open; mm<close; mm+=slot){
    var label=m2t(mm), e=mm+slot;
    // 予約不可枠（時間単位）
    var tbStart=tbs.filter(function(t){ var s=t2m(t.time); return s>=mm && s<e; });
    var tbCover=tbs.filter(function(t){ var s=t2m(t.time); return s<mm && s+(Number(t.duration)||slot)>mm; });
    // この枠ぶんの予約を収集
    var parts=[];
    bks.forEach(function(b){
      if(!b.time) return;
      var s=t2m(b.time), endMm=s+bkDur(b), tv=Number(b.travelMin)||0, travelEnd=endMm+tv;
      var startsHere=(s>=mm && s<e), coversHere=(s<mm && endMm>mm), endsHere=(endMm>mm && endMm<=e);
      if(startsHere){ placed[b.id]=1; parts.push({o:s,kind:"start",b:b,endMm:endMm,endsHere:endsHere,tv:tv,travelEnd:travelEnd}); }
      else if(coversHere){ parts.push({o:s,kind:"cover",b:b,endMm:endMm,endsHere:endsHere,tv:tv,travelEnd:travelEnd}); }
      else if(tv>0 && endMm<=mm && travelEnd>mm){ parts.push({o:endMm,kind:"mov",b:b}); }
    });
    var body, tight=false;
    if(parts.length===1 && parts[0].kind!=="mov" && soloIds[parts[0].b.id]){
      // 連結表示（重なりなし＝1つのブロックに繋げる）
      var p0=parts[0], cb0=p0.b, down0=p0.endMm>e, tail0=(!down0 && p0.tv>0 && p0.travelEnd<=e);
      if(p0.kind==="start"){ body=tlBooking(cb0,down0)+(tail0?moveTail(cb0):""); }
      else { body='<div class="slot-cont span-up'+(down0?" span-down":"")+'" style="border-left-color:'+bookingColor(cb0)+';" onclick="openBooking(\''+cb0.id+'\')"><span></span><span>施術中'+(!down0?'　〜'+m2t(p0.endMm):"")+'</span></div>'+(tail0?moveTail(cb0):""); }
      tight=down0;
    } else if(parts.length){
      // 重ね表示（並行予約 or 移動のみの枠）
      parts.sort(function(a,b){return a.o-b.o;});
      body=parts.map(function(p){
        if(p.kind==="mov") return moveOnlyBar(p.b);
        var tail=(p.endsHere && p.tv>0 && p.travelEnd<=e);
        if(p.kind==="start") return tlBooking(p.b)+(tail?moveTail(p.b):"");
        return slotContBar(p.b, p.endsHere?p.endMm:0)+(tail?moveTail(p.b):"");
      }).join("");
    } else if(tbStart.length){
      var tb=tbStart[0];
      var tend=t2m(tb.time)+(Number(tb.duration)||slot);
      var tdown=tend>e;
      body='<div class="slot-ng'+(tdown?" span-down":"")+'"><span>🚫 予約不可'+(tb.label?'（'+esc(tb.label)+'）':"")+(!tdown?'　〜'+m2t(tend):"")+'</span>'+
           '<button onclick="event.stopPropagation();delTimeBlock(\''+tb.id+'\')">解除</button></div>';
      tight=tdown;
    } else if(tbCover.length){
      var tcb=tbCover[0];
      var tend2=t2m(tcb.time)+(Number(tcb.duration)||slot);
      var tdown2=tend2>e;
      body='<div class="slot-ng span-up'+(tdown2?" span-down":"")+'"><span></span><span>'+(!tdown2?'〜'+m2t(tend2)+' まで予約不可':"予約不可")+'</span></div>';
      tight=tdown2;
    } else if(blk){
      body='<div class="slot-free ng">―</div>';
    } else {
      body='<div class="slot-free" onclick="openReception({date:\''+ds+'\',time:\''+label+'\'})"><span>＋ 空き</span>'+
           '<span class="free-r"><button class="ng-mini" onclick="event.stopPropagation();openBlockSlot(\''+ds+'\',\''+label+'\')">🚫 不可にする</button>受付</span></div>';
    }
    h+='<div class="slot'+(tight?" tight":"")+'"><div class="tm">'+label+'</div><div class="body">'+body+'</div></div>';
  }
  var rest=bks.filter(function(b){ return !placed[b.id]; });
  if(rest.length){
    h+='<div class="sec-title" style="margin-top:12px;">時間未定・営業時間外</div>';
    rest.forEach(function(b){ h+=tlBooking(b); });
  }
  return h;
}
/* =========================================================================
   📅 週表示（カレンダー風・時間軸に色ブロック配置・並行は横分割）
   ========================================================================= */
function dayEvents(ds){
  var evs=[];
  bookingsOfDay(ds).forEach(function(b){ if(!b.time) return;
    var s=t2m(b.time), en=s+bkDur(b);
    evs.push({s:s,e:en,type:"bk",id:b.id,color:bookingColor(b),label:clientName(b.clientId),time:b.time});
    var tv=Number(b.travelMin)||0; if(tv>0) evs.push({s:en,e:en+tv,type:"move",id:b.id,color:"#d8a85f",label:"移動",time:""});
  });
  timeBlocksOfDay(ds).forEach(function(t){ var s=t2m(t.time), en=s+(Number(t.duration)||sSlot());
    evs.push({s:s,e:en,type:"ng",id:t.id,color:"#9aa0a6",label:t.label||"予約不可",time:""}); });
  return evs;
}
// 重なりを横に分割。予約・予約不可で列を決め、移動は親予約の列・幅をそのまま使う
function layoutDay(evs){
  function place(ev, colEnds){ for(var c=0;c<colEnds.length;c++){ if(colEnds[c]<=ev.s){ ev.col=c; colEnds[c]=ev.e; return; } } ev.col=colEnds.length; colEnds.push(ev.e); }
  // ①移動以外（予約・予約不可）だけでクラスタ化＆列割当
  var base=evs.filter(function(e){return e.type!=="move";});
  base.sort(function(a,b){return a.s-b.s || a.e-b.e;});
  var i=0;
  while(i<base.length){
    var clusterEnd=base[i].e, j=i+1, cluster=[base[i]];
    while(j<base.length && base[j].s<clusterEnd){ cluster.push(base[j]); clusterEnd=Math.max(clusterEnd,base[j].e); j++; }
    var colEnds=[];
    cluster.forEach(function(ev){ place(ev, colEnds); });
    var cols=Math.max(colEnds.length,1);
    cluster.forEach(function(ev){ ev.cols=cols; });
    i=j;
  }
  // ②移動は親予約と同じ列・同じ列数（真下に揃う）
  var info={}; base.forEach(function(e){ if(e.type==="bk") info[e.id]={col:e.col,cols:e.cols}; });
  evs.forEach(function(e){ if(e.type==="move"){ var p=info[e.id]; if(p){ e.col=p.col; e.cols=p.cols; } else { e.col=0; e.cols=1; } } });
  return evs;
}
// 1日カレンダー（色ブロックを時間どおりに配置・重なりは横分割）。空き部分タップで受付
function renderDayGrid(ds){
  var openMin=Math.floor(sOpen())*60, closeMin=Math.ceil(sClose())*60, totalMin=Math.max(closeMin-openMin,60), hourPx=58;

  for(var m=openMin;m<closeMin;m+=60) h+='<div class="dg-hr" style="height:'+hourPx+'px;">'+m2t(m)+'</div>';
  h+='</div><div class="dg-col'+(blk?" ng":"")+'" style="height:'+gridH+'px;background-size:100% '+hourPx+'px;">';
  if(!blk){ for(var m2=openMin;m2<closeMin;m2+=60){ var lbl=m2t(m2);
    h+='<div class="dg-cell" style="top:'+((m2-openMin)/60*hourPx)+'px;height:'+hourPx+'px;" onclick="openReception({date:\''+ds+'\',time:\''+lbl+'\'})"></div>'; } }
  layoutDay(dayEvents(ds)).forEach(function(ev){
    if(ev.e<=openMin || ev.s>=closeMin) return;
    var top=Math.max((ev.s-openMin)/60*hourPx,0), bottom=Math.min((ev.e-openMin)/60*hourPx,gridH), hgt=Math.max(bottom-top,18);
    var leftP=ev.col/ev.cols*100, wP=1/ev.cols*100;

    if(ev.type==="move"){ cls="ev-move"; inner='🚗 移動 '+fmtDur(ev.e-ev.s); }
    else if(ev.type==="ng"){ cls="ev-ng"; inner='🚫 '+esc(ev.label); click=' onclick="if(confirm(\'この予約不可を解除しますか？\'))delTimeBlock(\''+ev.id+'\')"'; }
    else { cls="ev-bk"; click=' onclick="openBooking(\''+ev.id+'\')"';
      var b=DB.bookings.find(function(x){return x.id===ev.id;});
      var staffDots=(b.staffIds||[]).map(function(id){return '<span class="sdot" style="background:'+staffColor(id)+'"></span>';}).join("");
      inner='<b>'+esc(ev.time)+' '+esc(ev.label)+'</b>'+(hgt>40?('<span class="dg-sub">'+staffDots+esc((b.staffIds||[]).map(staffName).join("・")||"")+'</span>'):"");
    }
    h+='<div class="dg-ev '+cls+'" style="top:'+top+'px;height:'+(hgt-2)+'px;left:calc('+leftP+'% + 1px);width:calc('+wP+'% - 2px);'+(ev.type==="bk"?('background:'+ev.color+';'):"")+'"'+click+'>'+inner+'</div>';
  });
  h+='</div></div>';
  return h;
}
function renderWeek(){

        (ev.time?'<span class="wk-ev-t">'+esc(ev.time)+'</span>':"")+'<span class="wk-ev-n">'+esc(ev.label)+'</span></div>';

// 施術終了枠の下に出す「移動」の琥珀色バンド（施術＝緑／移動＝琥珀で色分け）

// メニューを種類ごとに集計（カット×15／カラー×4）。1件のみは名前だけ
function summarizeMenus(menus){
  var order=[], cnt={};
  menus.forEach(function(m){ m=(m||"").trim(); if(!m) return; if(!(m in cnt)){cnt[m]=0; order.push(m);} cnt[m]++; });
  return order.map(function(m){ return cnt[m]>1 ? (m+"×"+cnt[m]) : m; }).join("／");
}
function tlBooking(b, spanDown){

function saveBooking(bid, draft){
  var b=DB.bookings.find(function(x){return x.id===bid;}); if(!b) return;
  // 変更後の値で先にダブルブッキング確認（記録を作り直す前に）
  var nDate=(document.getElementById("bkDate")||{}).value||b.date;
  var nTime=(document.getElementById("bkTime")||{}).value||"";
  var nStaff=rcSelectedStaff(); if(!nStaff.length) nStaff=b.staffIds||[];
  var nDur=Number((document.getElementById("bkDuration")||{}).value)||sSlot();
  var nTv=Number((document.getElementById("bkTravelMin")||{}).value)||0;
  if(!confirmDoubleBook(nDate, nTime, nDur, nTv, nStaff, bid)) return;
  // 日付・時間・担当の変更を反映（実績の日付もこれに合わせる）
  if(nDate) b.date=nDate;
  b.time=nTime;
  var sids=rcSelectedStaff(); if(sids.length) b.staffIds=sids;
  bkPersistEdits(bid); // 利用者名・メニュー・金額・コメント・写真を保存
  b.travel=Number(document.getElementById("bkTravel").value)||0;
  b.duration=Number(document.getElementById("bkDuration").value)||sSlot();
  b.travelMin=Number(document.getElementById("bkTravelMin").value)||0;
  b.status = draft?"予定":"完了";
  if(b.date) current=new Date(b.date+"T00:00:00"); // 日付変更時はその日を表示
  saveDB(); closeModal(); render();
  toast(draft?"下書き保存しました":"完了として保存しました");
}
// 予約詳細の利用者カードの入力（名前・メニュー・金額・コメント・写真）をrecordsへ反映
function bkPersistEdits(bid){
  var b=DB.bookings.find(function(x){return x.id===bid;}); if(!b) return;
  var mems=membersOf(b.clientId);
  DB.records=DB.records.filter(function(r){return r.bookingId!==bid;}); // 作り直し
  mems.forEach(function(m){
    var menuEl=document.getElementById("rm_menu_"+m.id); if(!menuEl) return;
    var nameEl=document.getElementById("rm_name_"+m.id); if(nameEl){ var nn=nameEl.value.trim(); if(nn) m.name=nn; } // 利用者名の編集を反映
    var amt=Number((document.getElementById("rm_amt_"+m.id)||{}).value)||0; var menu=menuEl.value.trim();
    var note=((document.getElementById("rm_note_"+m.id)||{}).value||"").trim();
    var photos=(window._bkPhotos&&window._bkPhotos[m.id])||[];
    if(amt>0 || menu || note || photos.length){
      DB.records.push({ id:uid(), bookingId:bid, clientId:b.clientId, memberId:m.id, menu:menu, amount:amt, note:note, photos:photos,
        staffId:(b.staffIds&&b.staffIds[0])||m.staffId||null, date:b.date });
    }
  });
}
// 予約詳細から利用者を追加（現在の入力を保ったまま再描画）
function bkAddMember(bid){
  var b=DB.bookings.find(function(x){return x.id===bid;}); if(!b) return;
  var nm=prompt("追加する利用者名（例：田中 ハナ）"); if(nm==null) return; nm=nm.trim(); if(!nm) return;
  bkPersistEdits(bid); // 入力中の内容を保存
  DB.members.push({ id:uid(), clientId:b.clientId, name:nm, kana:"", staffId:(b.staffIds&&b.staffIds[0])||null });
  saveDB(); openBooking(bid); // 再描画して新カード表示
}
function bkDelMember(bid, mid){
  var m=memberOf(mid); if(!m) return;
  if(!confirm((m.name||"この利用者")+" を削除します。よろしいですか？")) return;
  bkPersistEdits(bid);
  DB.members=DB.members.filter(function(x){return x.id!==mid;});
  DB.records=DB.records.filter(function(r){return r.memberId!==mid;});
  saveDB(); openBooking(bid);
}
function delBooking(bid){ DB.bookings=DB.bookings.filter(function(b){return b.id!==bid;}); DB.records=DB.records.filter(function(r){return r.bookingId!==bid;}); saveDB(); closeModal(); render(); toast("削除しました"); }

function clientListHtml(){
  if(!DB.clients.length) return '<div class="empty">まだ登録がありません。<br>上のボタン、または「依頼を受け付ける」から登録できます。</div>';
  var q=(window._clQ||"").trim().toLowerCase(), filter=window._clFilter||"all";
  var list=DB.clients.filter(function(c){
    if(filter!=="all" && c.kind!==filter) return false;
    if(!q) return true;
    if((c.name||"").toLowerCase().indexOf(q)>=0) return true;
    if((c.address||"").toLowerCase().indexOf(q)>=0) return true;
    return membersOf(c.id).some(function(m){ return (m.name||"").toLowerCase().indexOf(q)>=0 || (m.kana||"").toLowerCase().indexOf(q)>=0; });
  });
  if(!list.length) return '<div class="empty">該当する顧客が見つかりません。</div>';
  var groups=[["施設","🏢 施設・訪問先"],["病院","🏥 病院"],["個人","🧑 個人のお客様"]];
  var h="";
  groups.forEach(function(g){
    var items=list.filter(function(c){return c.kind===g[0];});
    if(!items.length) return;
    h+='<div class="grp-title">'+g[1]+'（'+items.length+'）</div>';

// 流用：受付フォームに前回の利用者・メニュー・金額を反映
function applyReuse(ru){
  if(!ru) return;
  if(ru.memberId){
    var me=document.getElementById("rcMenu_"+ru.memberId), ae=document.getElementById("rcAmt_"+ru.memberId);
    if(me){ if(ru.menu) me.value=ru.menu; if(ae&&Number(ru.amount)) ae.value=ru.amount;
      if(me.tagName==="SELECT") fillPrice("rcMenu_"+ru.memberId,"rcAmt_"+ru.memberId,window._rcClientId); return; }
  }
  if(document.getElementById("rcNewMemList")){ // 施設：その回の利用者として1行追加
    var nm=ru.memberId?((memberOf(ru.memberId)||{}).name||""):"";
    rcAddNewMember(nm, ru.menu||"", ru.amount||"");
  }

   ========================================================================= */
var MAP=null, MAP_MODE="all", MAP_STAFF=null;
var KIND_COLOR={ "個人":"#2f6fd8", "施設":"#1d9e75", "病院":"#c0392b" };
function ensureLeaflet(cb){
  if(window.L){ cb(); return; }
  if(!document.getElementById("leafletCss")){
    var css=document.createElement("link"); css.id="leafletCss"; css.rel="stylesheet";
    css.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(css);
  }
  var js=document.createElement("script"); js.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
  js.onload=cb; js.onerror=function(){ var h=document.getElementById("mapHint"); if(h) h.textContent="地図の読み込みに失敗しました（ネット接続を確認してください）"; };
  document.head.appendChild(js);
}
// 住所→座標（Nominatim/OpenStreetMap）。番地で失敗したら町名レベルで再試行。結果は顧客にキャッシュ
function geocodeClient(c, done){
  if(c.lat!=null && c.lng!=null){ done(true); return; }
  if(!c.address || c.geoFail){ done(false); return; }
  var queries=[c.address];
  var simple=c.address.replace(/[0-9０-９\-ー－の丁目番地号\s　]+$/,"").trim(); // 末尾の番地を除去
  if(simple && simple!==c.address) queries.push(simple);
  var qi=0;
  (function tryQ(){
    if(qi>=queries.length){ c.geoFail=true; saveDB(); done(false); return; }
    fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q="+encodeURIComponent(queries[qi]),{headers:{"Accept":"application/json"}})
      .then(function(r){return r.json();})
      .then(function(a){ if(a&&a.length){ c.lat=parseFloat(a[0].lat); c.lng=parseFloat(a[0].lon); c.geoApprox=(qi>0); saveDB(); done(true); }
        else { qi++; setTimeout(tryQ,1100); } })
      .catch(function(){ qi++; setTimeout(tryQ,1100); });
  })();
}
function viewMap(){
  var h='<div class="chips" style="margin-bottom:8px;">'+
    '<button class="chip'+(MAP_MODE==="all"?" sel":"")+'" onclick="setMapMode(\'all\')">全顧客</button>'+
    '<button class="chip'+(MAP_MODE==="today"?" sel":"")+'" onclick="setMapMode(\'today\')">今日の訪問（ルート）</button></div>';
  // 今日モードは担当フィルタ（ルートは担当ごと）
  if(MAP_MODE==="today" && DB.staff.length){
    h+='<div class="chips" style="margin-bottom:8px;">'+
      '<button class="chip'+(!MAP_STAFF?" sel":"")+'" onclick="setMapStaff(\'\')">全員</button>'+
      DB.staff.map(function(s){ var on=MAP_STAFF===s.id, col=staffColor(s.id);
        return '<button class="chip staff-chip'+(on?" sel":"")+'" onclick="setMapStaff(\''+s.id+'\')" style="'+(on?('border-color:'+col+';background:'+col+'22;'):'')+'"><span class="dot" style="background:'+col+'"></span>'+esc(s.name)+'</button>'; }).join("")+'</div>';
  }
  h+='<div id="mapWrap" style="height:62vh;border-radius:12px;overflow:hidden;background:#e9ecef;"></div>'+
    '<div id="mapHint" style="font-size:12px;color:var(--hint);margin-top:6px;line-height:1.6;"></div>';
  return h;
}
function setMapMode(m){ MAP_MODE=m; render(); }
function setMapStaff(id){ MAP_STAFF=id||null; render(); }
// 今日の訪問を担当ごとにまとめ、時間順に並べる（ルートは担当別）
function todayRoutes(){
  var bks=bookingsOfDay(todayStr()).filter(function(b){return b.time;}).sort(function(a,b){return (a.time||"").localeCompare(b.time||"");});
  var byStaff={}, order=[];
  bks.forEach(function(b){ var sid=(b.staffIds&&b.staffIds[0])||"_"; if(!(sid in byStaff)){ byStaff[sid]=[]; order.push(sid); }
    var c=clientOf(b.clientId); if(c && c.address) byStaff[sid].push(c); });
  return order.map(function(sid){ return { staffId:sid==="_"?null:sid, name:sid==="_"?"担当未割当":staffName(sid),
    color:sid==="_"?"#9aa0a6":staffColor(sid), stops:byStaff[sid] }; }).filter(function(g){ return g.stops.length; });
}
function initMap(){
  ensureLeaflet(function(){
    if(tab!=="map") return;
    var wrap=document.getElementById("mapWrap"); if(!wrap || !window.L) return;
    try{ if(MAP) MAP.remove(); }catch(e){}
    MAP=L.map(wrap,{zoomControl:true}).setView([34.69,135.19],12); // 神戸付近
    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{maxZoom:19,attribution:"© OpenStreetMap, © CARTO"}).addTo(MAP);
    setTimeout(function(){ if(MAP) MAP.invalidateSize(); },80);
    drawMarkers();
  });
}
function mapTargetClients(){
  if(MAP_MODE==="today"){
    var all=[]; todayRoutes().forEach(function(g){ if(MAP_STAFF && g.staffId!==MAP_STAFF) return; g.stops.forEach(function(c){ all.push(c); }); });
    return all;
  }
  return DB.clients.filter(function(c){return c.address;});
}
function kindEmoji(k){ return k==="施設"?"🏢":k==="病院"?"🏥":"🙂"; }
// Googleマップ経路URL（目的地は最後の地点、途中はwaypoints）
function gmapDirUrl(list){
  var pts=list.filter(function(c){return c.lat!=null;}).map(function(c){return c.lat+","+c.lng;});
  if(!pts.length) return "";
  var dest=pts[pts.length-1], wp=pts.slice(0,-1);
  var u="https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(dest);
  if(wp.length) u+="&waypoints="+wp.map(encodeURIComponent).join("|");
  return u;
}
function setMapHint(list){
  var h=document.getElementById("mapHint"); if(!h) return;
  var plotted=list.filter(function(c){return c.lat!=null;}).length;
  var failed=list.filter(function(c){return c.geoFail;}).length;
  var s="📍 "+plotted+"件表示"+(failed?("　⚠️ 場所を特定できなかった "+failed+"件"):"");
  if(MAP_MODE==="today"){
    s+="　／　番号は訪問順";
    // 担当ごとに経路リンク（ルートは担当別）
    todayRoutes().forEach(function(g){
      if(MAP_STAFF && g.staffId!==MAP_STAFF) return;
      var u=gmapDirUrl(g.stops); if(!u) return;
      s+='<br><a class="route-link" href="'+u+'" target="_blank" rel="noopener" style="background:'+g.color+'">🗺 '+esc(g.name)+'のルートを開く ›</a>';
    });
  }
  h.innerHTML=s;
}
function drawMarkers(){
  if(tab!=="map" || !MAP) return;
  var list=mapTargetClients();
  plotMarkers();
  var missing=list.filter(function(c){return (c.lat==null||c.lng==null) && !c.geoFail;});
  if(!missing.length){ setMapHint(list); return; }
  var hint=document.getElementById("mapHint"); if(hint) hint.textContent="住所を地図に変換中…（"+missing.length+"件）";
  var i=0;
  (function next(){
    if(tab!=="map"){ return; }
    if(i>=missing.length){ plotMarkers(); setMapHint(list); return; }
    geocodeClient(missing[i], function(){ i++; plotMarkers();
      var hh=document.getElementById("mapHint"); if(hh && i<missing.length) hh.textContent="住所を地図に変換中…（残り"+(missing.length-i)+"件）";
      setTimeout(next, 1100); }); // Nominatimは1秒1回まで
  })();
}
function mapPin(c, col, inner, grp){
  if(c.lat==null||c.lng==null) return null;
  var icon=L.divIcon({className:"mpin-wrap", html:'<div class="mpin" style="background:'+col+'"><span>'+inner+'</span></div>', iconSize:[34,34], iconAnchor:[17,34], popupAnchor:[0,-32]});
  var m=L.marker([c.lat,c.lng],{icon:icon}).addTo(grp);
  var nav="https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(c.lat+","+c.lng);
  m.bindPopup('<b>'+esc(c.name)+'</b>（'+esc(c.kind)+'）<br>'+esc(c.address||"")+(c.geoApprox?'<br><span style="color:#c0392b;">※ おおよその位置（町名まで）</span>':"")+
    '<br><a href="'+nav+'" target="_blank" rel="noopener">🗺 経路（Googleマップ）›</a>'+
    '<br><a href="#" onclick="try{MAP.closePopup()}catch(e){};openClientDetail(\''+c.id+'\');return false;">📋 カルテを見る ›</a>');
  return [c.lat,c.lng];
}
function plotMarkers(){
  if(tab!=="map" || !MAP || !window.L) return;
  try{ if(MAP._grp) MAP.removeLayer(MAP._grp); }catch(e){}
  var grp=L.layerGroup().addTo(MAP); MAP._grp=grp; var pts=[];
  if(MAP_MODE==="today"){
    // 担当ごとに番号ピン＋担当色のルート線
    todayRoutes().forEach(function(g){
      if(MAP_STAFF && g.staffId!==MAP_STAFF) return;
      var rpts=[];
      g.stops.forEach(function(c,idx){ var p=mapPin(c, g.color, '<b>'+(idx+1)+'</b>', grp); if(p){ pts.push(p); rpts.push(p); } });
      if(rpts.length>1) L.polyline(rpts,{color:g.color,weight:3,opacity:.6,dashArray:"6 7"}).addTo(grp);
    });
  } else {
    DB.clients.filter(function(c){return c.address;}).forEach(function(c){
      var p=mapPin(c, KIND_COLOR[c.kind]||"#1d9e75", kindEmoji(c.kind), grp); if(p) pts.push(p);
    });
  }
  if(pts.length){ try{ MAP.fitBounds(pts,{padding:[34,34],maxZoom:15}); }catch(e){} }
}

// レコード群から但し書き用のメニュー文字列（種類ごとに集計）
function tadashiOf(records){ var menus=records.filter(function(r){return Number(r.amount)>0;}).map(function(r){return r.menu;}).filter(Boolean); return summarizeMenus(menus); }
// 領収書1枚分のHTML（宛名＝toName 様, 来店日, 施術料＋交通費, 但し＝メニュー）
function receiptBlock(toName, ryo, travel, dateStr, tadashi){
  var biz=DB.settings.bizName||"", reg=DB.settings.regNumber||"", total=(Number(ryo)||0)+(Number(travel)||0);
  var note = tadashi ? (esc(tadashi)+' 代として') : '訪問美容料として';
  return '<div class="r"><h1>領 収 書</h1>'+
    (dateStr?'<div class="date">'+esc(fmtDate(dateStr))+'</div>':"")+
    '<div class="to">'+esc(toName)+' 様</div>'+
    '<div class="amt">'+yen(total)+'</div>'+
    '<table><tr><td>施術料</td><td style="text-align:right;">'+yen(ryo)+'</td></tr>'+
    (travel?('<tr><td>出張交通費</td><td style="text-align:right;">'+yen(travel)+'</td></tr>'):"")+
    '<tr><td>但し</td><td style="text-align:right;">'+note+'</td></tr></table>'+
    '<div class="biz"><b>'+esc(biz)+'</b><br>'+(reg?("登録番号 "+esc(reg)):"")+'</div></div>';
}
// 来店（予約）1回ぶん。個人宛＝利用者ごとに分けて発行 / 施設一括＝施設名宛で合計（交通費込み）
function buildReceiptInner(bookingId, mode){
  var b=DB.bookings.find(function(x){return x.id===bookingId;}); if(!b) return "";
  var recs=recOfBooking(bookingId);
  var travel=Number(b.travel)||0;
  if(mode==="individual"){
    // 利用者ごとに分けて発行（個人宛は施術料のみ。交通費は施設一括に計上）
    var byMem={}, byRec={}, order=[];
    recs.forEach(function(r){ if(!(Number(r.amount)>0)) return; var k=r.memberId||"_"; if(!(k in byMem)){byMem[k]=0; byRec[k]=[]; order.push(k);} byMem[k]+=Number(r.amount)||0; byRec[k].push(r); });
    return order.map(function(k){
      var nm = k==="_" ? clientName(b.clientId) : ((memberOf(k)||{}).name||clientName(b.clientId));
      return receiptBlock(nm, byMem[k], 0, b.date, tadashiOf(byRec[k]));
    }).join("");
  }
  var ryo=recs.reduce(function(a,r){return a+(Number(r.amount)||0);},0);
  if(!ryo && !travel) return "";
  return receiptBlock(clientName(b.clientId), ryo, travel, b.date, tadashiOf(recs));
}
function issueReceipt(bookingId, mode){
  var inner=buildReceiptInner(bookingId, mode);
  if(!inner){ toast("発行できる実績がありません"); return; }
  // 新規タブは開かず、アプリ内に表示して印刷（file://でも確実）
  openModal('<div class="receipt-doc">'+inner+'</div>'+
    '<button class="btn primary noprint" onclick="window.print()">🖨 印刷 / PDF保存'+(mode==="individual"?'（全員分）':'')+'</button>'+
    '<button class="btn ghost noprint" onclick="closeModal()">閉じる</button>');
}

function importData(input){
  var f=input.files&&input.files[0]; if(!f) return; input.value="";
  var rd=new FileReader();
  rd.onload=function(e){
    var data; try{ data=JSON.parse(e.target.result); }catch(err){ alert("ファイルを読み込めませんでした（JSON形式ではありません）"); return; }
    if(!data || typeof data!=="object" || !("clients" in data) || !("bookings" in data)){ alert("このアプリのバックアップファイルではないようです"); return; }
    if(!confirm("現在のデータを、このバックアップで置き換えます。\n今の内容は消えます。よろしいですか？")) return;
    DB=Object.assign(emptyDB(), data); saveDB(); boot(); toast("バックアップから復元しました");
  };
  rd.readAsText(f);
}
function resetApp(){
  if(!confirm("全データを削除して、最初の画面からやり直します。\n元に戻せません。よろしいですか？")) return;
  if(!confirm("本当に削除しますか？（念のため確認）\n必要なら先に「バックアップ」を取ってください。")) return;
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  location.reload();
}

   ========================================================================= */

function getAiKey(){ return getProvider()==="claude" ? (DB.settings.apiKey||"").trim() : (DB.settings.geminiKey||"").trim(); }
function getApiKey(){ return getAiKey(); } // 後方互換

  else { var g=document.getElementById("seGeminiKey"); if(g) DB.settings.geminiKey=g.value.trim();

}

  var models=[["gemini-2.5-flash","gemini-2.5-flash（無料・推奨）"],["gemini-2.0-flash","gemini-2.0-flash（無料）"],["gemini-1.5-flash","gemini-1.5-flash（無料）"],["gemini-2.5-pro","gemini-2.5-pro（有料のみ）"]];

}
function seProvSwitch(p){
