<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>訪問美容 楽々アプリ</title>
<style>
  :root{ --accent:#1d9e75; --accent-soft:#e7f5ee; --accent-text:#147a59; --line:#e5e7e6; --bg:#f4f6f5; --surface:#fff; --text:#1f2624; --muted:#6b7572; --hint:#9aa39f; --danger:#c0392b; --radius:14px; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,"Hiragino Sans",sans-serif; background:var(--bg); color:var(--text); -webkit-text-size-adjust:100%;}
  .wrap{max-width:480px; margin:0 auto; min-height:100vh;}
  /* 上部バー */
  .topbar{position:sticky; top:0; z-index:50; background:var(--surface); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:12px 16px;}
  .topbar .t{font-size:16px; font-weight:700;}
  .gear{border:none; background:none; font-size:20px; cursor:pointer; color:var(--muted);}
  /* 本文 */
  .view{padding:14px 16px 90px;}
  h2.page{font-size:18px; margin:2px 0 12px;}
  .sub{color:var(--muted); font-size:13px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
  label{display:block;}
  input, select{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; background:var(--surface); color:var(--text);}
  .btn{display:block; width:100%; padding:13px; border:none; border-radius:12px; font-size:15px; font-weight:700; margin-top:10px; cursor:pointer;}
  .btn.primary{background:var(--accent); color:#fff;}
  .btn.ghost{background:var(--surface); border:1px solid var(--line); color:var(--text);}
  .btn.ghost.accent{border-color:var(--accent); color:var(--accent-text);}
  .btn.danger{background:#fbeaea; color:var(--danger);}
  .btn.sm{padding:9px 12px; font-size:14px; margin-top:0; width:auto;}
  .row{display:flex; gap:8px;} .row>*{flex:1;}
  .muted{color:var(--muted); font-size:13px;}
  .hint{font-size:12px; color:var(--hint); margin-bottom:3px;}
  .msg{font-size:13px; padding:9px 12px; border-radius:10px; margin-top:10px;}
  .msg.err{background:#fbeaea; color:var(--danger);} .msg.ok{background:var(--accent-soft); color:var(--accent-text);}
  .warn{background:#fff7e6; border:1px solid #f0d9a8; color:#8a6d2f; font-size:13px; line-height:1.6; padding:10px 12px; border-radius:10px; margin-top:10px;}
  .list-empty{color:var(--muted); font-size:13px; text-align:center; padding:24px 8px;}
  .sec{font-size:12px; font-weight:700; color:var(--muted); margin:16px 2px 6px;}
  /* 行カード */
  .item{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin-bottom:8px;}
  .item .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .item .name{font-weight:700; font-size:15px;}
  .item .meta{color:var(--muted); font-size:12px; margin-top:3px; line-height:1.5;}
  .item .rules{color:var(--danger); font-size:12px; margin-top:3px;}
  .pill{font-size:11px; font-weight:700; padding:3px 9px; border-radius:12px; white-space:nowrap;}
  .pill.plan{background:#eef1f0; color:var(--muted);} .pill.done{background:var(--accent-soft); color:var(--accent-text);}
  .amt{font-weight:700; color:var(--accent-text);}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-top:8px;}
  .cal .wd{text-align:center; font-size:11px; color:var(--muted); padding:2px 0;}
  .cal .cell{aspect-ratio:1/1; border-radius:9px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:13px; cursor:pointer; border:1px solid transparent; background:var(--bg);}
  .cal .cell.blank{background:transparent; cursor:default;}
  .cal .cell.today{border-color:var(--accent);}
  .cal .cell.sel{background:var(--accent); color:#fff;}
  .cal .cell .dot{width:5px; height:5px; border-radius:50%; background:var(--accent); margin-top:3px;}
  .cal .cell.sel .dot{background:#fff;}
  .sched{position:relative; margin-top:8px; cursor:pointer;}
  .sched-hline{position:absolute; left:44px; right:0; border-top:1px dashed var(--line);}
  .sched-hlabel{position:absolute; left:0; transform:translateY(-50%); font-size:11px; color:var(--hint);}
  .sched-ev{position:absolute; left:48px; right:2px; border-radius:8px; padding:3px 8px; font-size:12px; line-height:1.35; overflow:hidden; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.08); box-sizing:border-box;}
  .sched-ev.plan{background:var(--c-plan-bg,var(--accent-soft)); color:var(--c-plan,var(--accent-text)); border-left:3px solid var(--c-plan,var(--accent));}   /* 予定 */
  .sched-ev.done{background:var(--c-fin-bg,#eef1f0); color:var(--c-fin,var(--muted)); border-left:3px solid var(--c-fin,#b8b4b1);}   /* 記録済 */
  .sched-ev b{font-weight:700;}
  .sched-now{position:absolute; left:44px; right:0; border-top:2px solid var(--danger); z-index:5; pointer-events:none;}
  .sched-now-dot{position:absolute; left:-4px; top:-4px; width:7px; height:7px; border-radius:50%; background:var(--danger);}
  .sched-ev.fin{background:var(--c-fin-bg,#eef1f0); color:var(--c-fin,var(--muted)); border-left:3px solid var(--c-fin,#b8b4b1);}   /* 施術終了 */
  .sched-move{position:absolute; left:48px; right:2px; border-radius:8px; padding:2px 8px; font-size:11px; line-height:1.3; box-sizing:border-box; overflow:hidden; background:var(--c-move-bg,#fbf2e2); color:var(--c-move,#9a6b1e); border-left:3px solid var(--c-move,#d8a85f);}
  .sched-resize{position:absolute; left:0; right:0; bottom:0; height:10px; cursor:ns-resize; touch-action:none;}
  .sched-resize::after{content:""; position:absolute; left:50%; bottom:3px; width:22px; height:3px; margin-left:-11px; border-radius:2px; background:rgba(0,0,0,.18);}
  /* タブバー */
  .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--surface); border-top:1px solid var(--line); display:flex; max-width:480px; margin:0 auto;}
  .tabbar button{position:relative; flex:1; border:none; background:none; padding:8px 0 10px; font-size:11px; color:var(--muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;}
  .tabbar button .ic{font-size:20px;}
  .tabbar button.on{color:var(--accent-text); font-weight:700; background:var(--accent-soft);}
  .tabbar button.on::before{content:""; position:absolute; top:0; left:22%; right:22%; height:3px; border-radius:0 0 4px 4px; background:var(--accent);}
  .tabbar button.on .ic{transform:scale(1.12);}
  /* シート（下から出るフォーム） */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; z-index:200; align-items:flex-end;}
  .overlay.show{display:flex;}
  .sheet{background:var(--surface); width:100%; max-width:480px; margin:0 auto; border-radius:18px 18px 0 0; max-height:90vh; overflow:auto; padding:8px 16px 28px;}
  .sheet-handle{width:38px; height:4px; background:var(--line); border-radius:3px; margin:6px auto 12px;}
  .sheet-title{font-size:16px; font-weight:700; margin-bottom:10px;}
  /* セグメント */
  .seg-wrap{display:flex; background:var(--bg); border-radius:12px; padding:3px;}
  .seg{flex:1; border:none; background:none; padding:10px; border-radius:9px; font-size:15px; font-weight:700; color:var(--muted); cursor:pointer;}
  .seg.on{background:var(--surface); color:var(--accent-text); box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .mchips{display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 6px;}
  .mchip{border:1px solid var(--line); background:var(--surface); color:var(--text); padding:9px 13px; border-radius:999px; font-size:14px; font-weight:600; cursor:pointer;}
  .mchip .p{color:var(--muted); font-weight:600; margin-left:5px; font-size:12px;}
  .mchip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-text);}
  .mchip.on .p{color:var(--accent-text);}
  /* 料金・チェック行 */
  .price-row{display:flex; gap:6px; margin-top:6px; align-items:center;}
  .price-row .pn{flex:2;} .price-row .pp{flex:1;}
  .price-row .px{flex:0 0 40px; height:44px; border:1px solid var(--line); background:var(--surface); border-radius:10px; color:var(--muted); font-size:18px; cursor:pointer;}
  .ba-row{border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px;}
  .ba-row.on{border-color:var(--accent); background:var(--accent-soft);}
  .ba-row label.chk{display:flex; align-items:center; gap:8px; font-size:15px; font-weight:600; cursor:pointer;}
  .ba-row .chk input{width:20px; height:20px;}
  .toast{position:fixed; left:50%; bottom:80px; transform:translateX(-50%) translateY(10px); background:#1f2624; color:#fff; font-size:14px; font-weight:600; padding:11px 18px; border-radius:22px; box-shadow:0 4px 16px rgba(0,0,0,.25); opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:9999; max-width:90%; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .guide-step{display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid #cbe7da;}
  .guide-step .gnum{flex:0 0 26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:14px;}
  .guide-step b{font-size:14px;}
  .center-narrow{max-width:400px; margin:0 auto; padding:24px 18px;}
  h1.brand{font-size:20px; text-align:center; margin:24px 0 4px;}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center-narrow"><div class="card">読み込み中…</div></div></div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sheet-handle"></div><div id="sheetBody"></div></div></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== 接続設定（このプロジェクト専用） ===== */
var SUPABASE_URL = "https://dhgjaxhhdyxplnmubmvg.supabase.co";
var SUPABASE_KEY = "sb_publishable_l1en0JjWFODzDm5VtnvpHg_fZDfmJ4K";
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var APP=document.getElementById("app");
var ME=null, PROFILE=null;
var CL=[], BK=[], RC=[], TB=[];      // 顧客 / 予約 / 売上 / 移動ブロック(time_blocks)
var TIME_UNIT=5;                     // 時間の単位（分）。5/10/15/30
function loadTimeUnit(){ try{ var u=parseInt(localStorage.getItem("timeunit_"+(ME&&ME.id))||"5",10); TIME_UNIT=([5,10,15,30].indexOf(u)>=0)?u:5; }catch(e){ TIME_UNIT=5; } }
function snapUnit(min){ return Math.round(min/TIME_UNIT)*TIME_UNIT; }
function setTimeUnit(u){ TIME_UNIT=u; try{ localStorage.setItem("timeunit_"+(ME&&ME.id), String(u)); }catch(e){}
  var seg=el("tu_seg"); if(seg){ Array.prototype.forEach.call(seg.children,function(b){ b.classList.toggle("on", b.textContent===(u+"分")); }); }
  toast("⏱ 時間の単位を"+u+"分にしました"); }
var TAB="today";

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function el(id){ return document.getElementById(id); }
function yen(n){ return "¥"+(Number(n)||0).toLocaleString(); }
function showMsg(t,k){ var m=el("m"); if(m) m.innerHTML='<div class="msg '+(k||"err")+'">'+esc(t)+'</div>'; }

/* ===== 日付ヘルパ ===== */
function pad(n){ return String(n).padStart(2,"0"); }
function nowHM(){ var d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function defHM(){ var d=new Date(); return pad(d.getHours())+":00"; }   // 初期値は「今の時」の:00（分は00始まり）
/* 5分刻みの時間ドロップダウン（ネイティブtimeのstepが効かない端末対策） */
function timeOptions(sel){
  var opts="", found=false;
  for(var h=5; h<=22; h++){ for(var m=0;m<60;m+=TIME_UNIT){ var v=pad(h)+":"+pad(m); if(v===sel)found=true; opts+='<option value="'+v+'"'+(v===sel?" selected":"")+'>'+v+'</option>'; } }
  if(sel && !found){ opts='<option value="'+esc(sel)+'" selected>'+esc(sel)+'（そのまま）</option>'+opts; }
  return opts;
}
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function curMonth(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function shiftMonth(ym,delta){ var p=ym.split("-"); var d=new Date(+p[0],+p[1]-1+delta,1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
var WK=["日","月","火","水","木","金","土"];
function dateLabel(d){ if(!d) return "日付未定"; var p=d.split("-"); if(p.length!==3) return d; var dt=new Date(+p[0],+p[1]-1,+p[2]); return (+p[1])+"月"+(+p[2])+"日（"+WK[dt.getDay()]+"）"; }
function monthLabel(ym){ var p=ym.split("-"); return (+p[0])+"年"+(+p[1])+"月"; }

/* ===== トースト ===== */
var toastTimer=null;
function toast(msg){ var t=el("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); } t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove("show"); },2600); }

/* ===== シート（下から出るフォーム） ===== */
function openSheet(html){ el("sheetBody").innerHTML=html; el("overlay").classList.add("show"); document.querySelector("#overlay .sheet").scrollTop=0; }
function closeSheet(){ el("overlay").classList.remove("show"); el("sheetBody").innerHTML=""; }

/* ===== 起動 ===== */
async function boot(){
  var s=await sb.auth.getSession();
  ME=s.data.session?s.data.session.user:null;
  if(!ME){ renderAuth(); return; }
  await loadProfile();
  if(!PROFILE){ await ensurePersonalSpace(); await loadProfile(); }
  if(!PROFILE){ renderAuth(); return; }
  loadStdMenu();
  loadTimeUnit(); loadStateColors(); applyStateColors();
  await loadAll();
  renderApp();
  subscribeRealtime();
}
async function loadProfile(){ var r=await sb.from("profiles").select("*").eq("id",ME.id).maybeSingle(); PROFILE=r.data||null; }
async function ensurePersonalSpace(){
  var nm=(ME.user_metadata&&ME.user_metadata.name)?ME.user_metadata.name:((ME.email||"マイ").split("@")[0]);
  await sb.rpc("create_org_and_join",{ org_name:(nm+"の空間"), display_name:nm });
}
async function loadAll(){
  var a=await sb.from("clients").select("*").order("created_at",{ascending:true});
  CL=a.error?[]:(a.data||[]);
  var b=await sb.from("bookings").select("*");
  BK=b.error?[]:(b.data||[]);
  var c=await sb.from("records").select("*");
  RC=c.error?[]:(c.data||[]);
  var d=await sb.from("time_blocks").select("*");
  TB=d.error?[]:(d.data||[]);
}
async function reloadTimeBlocks(){ var d=await sb.from("time_blocks").select("*"); if(!d.error) TB=d.data||[]; renderTab(); }

/* ===== ログイン / 新規登録 ===== */
function setAuthMode(mmode){ var e=el("email"),p=el("pw"),n=el("nm"); if(e)window._ae=e.value; if(p)window._ap=p.value; if(n)window._an=n.value; window._am=mmode; renderAuth(); }
function renderAuth(){
  var mode=window._am||"signin", su=(mode==="signup");
  APP.innerHTML='<div class="center-narrow">'+
    '<h1 class="brand">訪問美容 楽々アプリ</h1><div class="sub" style="text-align:center;margin-bottom:16px;">予約・顧客・売上まで、これひとつ。<br>訪問美容のためのオールインワン</div>'+
    '<div class="card">'+
    '<div class="seg-wrap" style="margin-bottom:12px;">'+
      '<button class="seg'+(su?"":" on")+'" onclick="setAuthMode(\'signin\')">ログイン</button>'+
      '<button class="seg'+(su?" on":"")+'" onclick="setAuthMode(\'signup\')">新規登録</button>'+
    '</div>'+
    (su?'<div class="hint">お名前</div><input id="nm" placeholder="例：板谷 直澄" value="'+esc(window._an||"")+'">':"")+
    '<div class="hint" style="margin-top:'+(su?"8px":"0")+';">メールアドレス</div><input id="email" type="email" autocomplete="username" placeholder="you@example.com" value="'+esc(window._ae||"")+'">'+
    '<div class="hint" style="margin-top:8px;">パスワード</div><input id="pw" type="password" autocomplete="'+(su?"new-password":"current-password")+'" placeholder="6文字以上" value="'+esc(window._ap||"")+'">'+
    (su?'<div class="warn">⚠️ この<b>メールとパスワード</b>は次回のログインに必要です。必ず控えてください。</div>':"")+
    '<button class="btn primary" onclick="'+(su?"doSignUp()":"doSignIn()")+'">'+(su?"登録して始める":"ログイン")+'</button>'+
    '<div id="m"></div>'+
    '</div></div>';
}
async function doSignIn(){
  var email=el("email").value.trim(), pw=el("pw").value;
  if(!email||!pw){ showMsg("メールとパスワードを入力してください"); return; }
  showMsg("ログイン中…","ok");
  var r=await sb.auth.signInWithPassword({email:email,password:pw});
  if(r.error){ showMsg("ログインできません："+esc(r.error.message)); return; }
  ME=r.data.user; window._ae=window._ap=""; boot();
}
async function doSignUp(){
  var name=el("nm").value.trim(), email=el("email").value.trim(), pw=el("pw").value;
  if(!name){ showMsg("お名前を入力してください"); return; }
  if(!email||pw.length<6){ showMsg("メールと6文字以上のパスワードを入力してください"); return; }
  showMsg("登録中…","ok");
  var r=await sb.auth.signUp({email:email,password:pw,options:{data:{name:name}}});
  if(r.error){ showMsg("登録エラー："+esc(r.error.message)); return; }
  if(!r.data.session){ showMsg("確認メールが有効です。Supabaseでメール確認をオフにするか、Add user(Auto Confirm)で作成してください。"); return; }
  ME=r.data.user; window._ae=window._ap=window._an=""; boot();
}

/* ===== アプリ本体（上部バー＋タブ） ===== */
function renderApp(){
  APP.innerHTML=
    '<div class="topbar"><div class="t" id="topTitle"></div><button class="gear" onclick="openSettings()">⚙️</button></div>'+
    '<div class="view" id="view"></div>'+
    '<div class="tabbar">'+
      tabBtn("today","🏠","今日")+tabBtn("plan","📅","予定")+tabBtn("clients","👥","顧客")+tabBtn("sales","💰","売上")+
    '</div>';
  renderTab();
}
function tabBtn(id,ic,label){ return '<button class="'+(TAB===id?"on":"")+'" onclick="switchTab(\''+id+'\')"><span class="ic">'+ic+'</span>'+label+'</button>'; }
function switchTab(t){ TAB=t; renderApp(); window.scrollTo(0,0); }
function renderTab(){
  var titles={today:"今日",plan:"予定",clients:"顧客・施設",sales:"売上"};
  el("topTitle").textContent=titles[TAB]||"";
  if(TAB==="today") renderToday();
  else if(TAB==="plan") renderPlan();
  else if(TAB==="clients") renderClients();
  else if(TAB==="sales") renderSales();
}

/* ===== 予約・売上の紐付けヘルパ ===== */
function clientById(id){ return CL.find(function(x){return x.id===id;}); }
function clientName(id){ var c=clientById(id); return c?c.name:"（未設定）"; }
/* 追加項目（名前・時間・区分）は既存の photos(jsonb) 列に格納＝SQL不要。{nm,t,pk} */
function exRec(r){ var e=r&&r.photos; return (e&&typeof e==="object"&&!Array.isArray(e))?e:{}; }
function recExtra(o){ var x={}; if(o.nm)x.nm=o.nm; if(o.t)x.t=o.t; if(o.pk)x.pk=o.pk; if(o.dur)x.dur=o.dur; if(o.travel)x.travel=o.travel; if(o.room)x.room=o.room; if(o.fee)x.fee=o.fee; return x; }
function recFee(r){ return Number(exRec(r).fee)||0; }   // 訪問出張料
function recTotal(r){ return (r.amount||0)+recFee(r); }   // 施術料＋出張料
function recordWho(r){ var e=exRec(r); var room=e.room?('🚪'+esc(e.room)+' '):""; if(r.client_id){ return e.nm?(esc(clientName(r.client_id))+' ／ '+room+esc(e.nm)):esc(clientName(r.client_id)); } var pk=e.pk?("["+esc(e.pk)+"] "):""; return pk+room+(e.nm?esc(e.nm):"お客様"); }
/* DBにまだ無い列があっても保存が止まらないよう、足りない列を外して再試行。
   ただし捨てた項目は「黙って消さず」に警告する（初期設定SQLの未実行を知らせる） */
var COLJP={member_name:"お客様名",place_kind:"区分",time:"時間"};
function stripCol(rows, col){ return (Array.isArray(rows)?rows:[rows]).map(function(o){ var c=Object.assign({},o); delete c[col]; return c; }); }
function warnDropped(dropped){ if(dropped.length){ toast("⚠️ "+dropped.map(function(c){return COLJP[c]||c;}).join("・")+" は未保存（設定→データ準備のSQLを実行してください）"); } }
async function insertRecords(rows){
  var dropped=[];
  async function go(rw){ var r=await sb.from("records").insert(rw); var m=r.error&&r.error.message&&r.error.message.match(/Could not find the '(\w+)' column/); if(m){ dropped.push(m[1]); return await go(stripCol(rw,m[1])); } return r; }
  var res=await go(rows); if(!res.error) warnDropped(dropped); return res;
}
async function updateRecord(id, data){
  var dropped=[];
  async function go(d){ var r=await sb.from("records").update(d).eq("id",id); var m=r.error&&r.error.message&&r.error.message.match(/Could not find the '(\w+)' column/); if(m){ dropped.push(m[1]); var d2=Object.assign({},d); delete d2[m[1]]; return await go(d2); } return r; }
  var res=await go(data); if(!res.error) warnDropped(dropped); return res;
}

/* ===== その日のタイムスケジュール（時間軸で目視） ===== */
function hm2min(t){ if(!t) return null; var p=String(t).split(":"); return (+p[0])*60+(+(p[1]||0)); }
function itDur(it){ return it.kind==="bk" ? (it.b.duration||60) : it.kind==="fac" ? (Number(exRec(it.recs[0]).dur)||60) : (Number(exRec(it.r).dur)||30); }   // 施術時間(分)
function itemDone(it){ return it.kind==="bk" ? (it.b.status==="施術終了") : it.kind==="fac" ? it.recs.every(function(r){return !!exRec(r).done;}) : !!exRec(it.r).done; }
function movesForDay(iso){ return TB.filter(function(m){return m.date===iso && m.time;}); }   // 独立した移動ブロック
function dayScheduleHtml(iso){
  var items=dayTimeline(iso);
  var timed=items.filter(function(it){return it.t;});
  var untimed=items.filter(function(it){return !it.t;});
  var moves=movesForDay(iso);
  var startH=9, endH=18;
  timed.forEach(function(it){ var m=hm2min(it.t); var sh=Math.floor(m/60); if(sh<startH)startH=sh; var eh=Math.ceil((m+itDur(it))/60); if(eh>endH)endH=eh; });
  moves.forEach(function(mv){ var m=hm2min(mv.time); var sh=Math.floor(m/60); if(sh<startH)startH=sh; var eh=Math.ceil((m+(mv.duration||15))/60); if(eh>endH)endH=eh; });
  if(endH<=startH) endH=startH+1;
  var hourH=48, ppm=hourH/60, top0=startH*60, PAD=8;
  var h='<div class="muted" style="font-size:11px;margin:2px 0 4px;">空きをタップで追加・ブロックをドラッグで時間移動　｜　<span style="color:var(--c-plan,var(--accent));">■</span>予定　<span style="color:var(--c-fin,var(--muted));">■</span>施術終了　<span style="color:var(--c-move,#d8a85f);">■</span>移動'+(iso===todayISO()?'　<span style="color:var(--danger);">—</span>今':'')+'</div>';
  h+='<div class="sched" data-start="'+startH+'" style="height:'+((endH-startH)*hourH+PAD*2)+'px;touch-action:pan-y;" onclick="schedClick(event,\''+iso+'\')" onpointerdown="schedDown(event)">';
  for(var hh=startH; hh<=endH; hh++){ var y=(hh-startH)*hourH+PAD; h+='<div class="sched-hline" style="top:'+y+'px;"></div><div class="sched-hlabel" style="top:'+y+'px;">'+pad(hh)+':00</div>'; }
  if(iso===todayISO()){ var nm=(new Date()).getHours()*60+(new Date()).getMinutes(); if(nm>=top0 && nm<=endH*60){ var ny=(nm-top0)*ppm+PAD; h+='<div class="sched-now" style="top:'+ny+'px;"><span class="sched-now-dot"></span></div>'; } }
  timed.forEach(function(it){
    var m=hm2min(it.t), top=(m-top0)*ppm+PAD, hgt=Math.max(itDur(it)*ppm, 34);
    var isBk=it.kind==="bk", isFac=it.kind==="fac";
    var done, label, sub, dataAttr;
    if(isFac){ done=it.recs.every(function(r){return !!exRec(r).done;}); label='🏢 '+esc(clientName(it.clientId))+'（'+it.recs.length+'名）'; sub=esc(menuSummary(it.recs))+'　'+yen(it.recs.reduce(function(a,r){return a+(r.amount||0);},0)); dataAttr='data-mv="fac" data-cid="'+esc(it.clientId)+'" data-iso="'+esc(it.iso)+'" data-t="'+esc(it.t)+'"'; }
    else if(isBk){ done=(it.b.status==="施術終了"); label=esc(clientName(it.b.client_id)); sub=done?'✅ 施術終了':(it.b.duration?it.b.duration+'分':'予定'); dataAttr='data-mv="bk" data-id="'+esc(it.b.id)+'"'; }
    else { done=!!exRec(it.r).done; label=recordWho(it.r); sub=esc(it.r.menu||'')+(it.r.amount?'　'+yen(it.r.amount):''); dataAttr='data-mv="rc" data-id="'+esc(it.r.id)+'"'; }
    var cls=done?"fin":"plan";   // 未=予定(緑)/済=施術終了(灰)
    h+='<div class="sched-ev '+cls+'" '+dataAttr+' style="top:'+top+'px;height:'+hgt+'px;cursor:grab;">'+
      '<b>'+esc(it.t)+'</b> '+label+(sub?'<div style="opacity:.85;">'+sub+'</div>':'')+'<div class="sched-resize"></div></div>';
  });
  // 独立した移動ブロック（好きな時間・場所に配置）
  moves.forEach(function(mv){
    var m=hm2min(mv.time), top=(m-top0)*ppm+PAD, mh=Math.max((mv.duration||15)*ppm,20);
    h+='<div class="sched-move" data-mv="mv" data-id="'+esc(mv.id)+'" style="top:'+top+'px;height:'+mh+'px;cursor:grab;">🚗 '+esc(mv.label||"移動")+(mv.duration?' '+mv.duration+'分':'')+'<div class="sched-resize"></div></div>';
  });
  h+='</div>';
  if(untimed.length){
    h+='<div class="hint" style="margin-top:12px;">時間未設定</div>';
    untimed.forEach(function(it){ h+=timelineItemHtml(it); });
  }
  return h;
}
/* ===== ブロックをドラッグして時間移動 ===== */
var _sdrag=null;
function schedDown(ev){
  var isResize=!!(ev.target.closest && ev.target.closest(".sched-resize"));
  var block=ev.target.closest?ev.target.closest(".sched-ev, .sched-move"):null; if(!block) return;
  var sched=block.closest(".sched"); var startH=+sched.getAttribute("data-start")||9;
  _sdrag={ block:block, startH:startH, y0:ev.clientY, top0:parseFloat(block.style.top)||8, h0:parseFloat(block.style.height)||34, moved:false, mode:(isResize?"resize":"move") };
  window.addEventListener("pointermove", schedMove, {passive:false});
  window.addEventListener("pointerup", schedUp);
}
function schedMove(ev){
  if(!_sdrag) return; var dy=ev.clientY-_sdrag.y0;
  if(!_sdrag.moved && Math.abs(dy)>4) _sdrag.moved=true;
  if(_sdrag.moved){ if(ev.cancelable) ev.preventDefault();
    if(_sdrag.mode==="resize"){ var nh=_sdrag.h0+dy; if(nh<16)nh=16; _sdrag.block.style.height=nh+"px"; _sdrag.block.style.opacity="0.85"; _sdrag.block.style.zIndex="20"; }
    else { var nt=_sdrag.top0+dy; if(nt<8)nt=8; _sdrag.block.style.top=nt+"px"; _sdrag.block.style.opacity="0.75"; _sdrag.block.style.zIndex="20"; _sdrag.block.style.cursor="grabbing"; }
  }
}
async function schedUp(ev){
  window.removeEventListener("pointermove", schedMove); window.removeEventListener("pointerup", schedUp);
  var d=_sdrag; _sdrag=null; if(!d) return;
  d.block.style.opacity=""; d.block.style.zIndex=""; d.block.style.cursor="grab";
  if(!d.moved){ if(d.mode!=="resize") schedOpen(d.block); return; }
  var ppm=48/60, PAD=8, top0=d.startH*60;
  if(d.mode==="resize"){ var newH=parseFloat(d.block.style.height)||16; var dur=snapUnit(newH/ppm); if(dur<TIME_UNIT)dur=TIME_UNIT; await resizeSchedItem(d.block, dur); }
  else { var newTop=parseFloat(d.block.style.top)||PAD; var min=snapUnit((newTop-PAD)/ppm+top0); if(min<0)min=0; if(min>1435)min=1435; await moveSchedItem(d.block, pad(Math.floor(min/60))+":"+pad(min%60)); }
}
async function resizeSchedItem(block, dur){
  var kind=block.getAttribute("data-mv");
  if(kind==="bk"){ var id=block.getAttribute("data-id"); var b=BK.find(function(x){return x.id===id;}); if(!b) return;
    var r=await sb.from("bookings").update({duration:dur}).eq("id",id); if(r.error){ toast("変更できませんでした"); renderTab(); return; } b.duration=dur; }
  else if(kind==="rc"){ var id2=block.getAttribute("data-id"); var rec=RC.find(function(x){return x.id===id2;}); if(!rec) return;
    var p=Object.assign({},exRec(rec)); p.dur=dur; var res=await updateRecord(id2,{photos:p}); if(res.error){ toast("変更できませんでした"); renderTab(); return; } rec.photos=p; }
  else if(kind==="fac"){ var cid=block.getAttribute("data-cid"), iso=block.getAttribute("data-iso"), t=block.getAttribute("data-t");
    var recs=facGroupRecs(cid,iso,t); for(var i=0;i<recs.length;i++){ var rr=recs[i]; var pp=Object.assign({},exRec(rr)); pp.dur=dur; var rs=await updateRecord(rr.id,{photos:pp}); if(!rs.error) rr.photos=pp; } }
  else if(kind==="mv"){ var mid=block.getAttribute("data-id"); var mv=TB.find(function(x){return x.id===mid;}); if(!mv) return;
    var rm=await sb.from("time_blocks").update({duration:dur}).eq("id",mid); if(rm.error){ toast("変更できませんでした"); renderTab(); return; } mv.duration=dur; }
  toast("⏱ "+dur+"分にしました"); renderTab();
}
function schedOpen(block){
  var kind=block.getAttribute("data-mv");
  if(kind==="bk") openBookingForm(block.getAttribute("data-id"));
  else if(kind==="rc") openRecordForm(block.getAttribute("data-id"));
  else if(kind==="fac") openFacVisit(block.getAttribute("data-cid"),block.getAttribute("data-iso"),block.getAttribute("data-t"));
  else if(kind==="mv") openMoveForm(block.getAttribute("data-id"));
}
async function moveSchedItem(block, newT){
  var kind=block.getAttribute("data-mv");
  if(kind==="bk"){ var id=block.getAttribute("data-id"); var b=BK.find(function(x){return x.id===id;}); if(!b) return;
    var r=await sb.from("bookings").update({time:newT}).eq("id",id); if(r.error){ toast("移動できませんでした"); renderTab(); return; } b.time=newT; }
  else if(kind==="rc"){ var id2=block.getAttribute("data-id"); var rec=RC.find(function(x){return x.id===id2;}); if(!rec) return;
    var p=Object.assign({},exRec(rec)); p.t=newT; var res=await updateRecord(id2,{photos:p}); if(res.error){ toast("移動できませんでした"); renderTab(); return; } rec.photos=p; }
  else if(kind==="fac"){ var cid=block.getAttribute("data-cid"), iso=block.getAttribute("data-iso"), oldT=block.getAttribute("data-t");
    var recs=facGroupRecs(cid,iso,oldT); for(var i=0;i<recs.length;i++){ var rr=recs[i]; var pp=Object.assign({},exRec(rr)); pp.t=newT; var rs=await updateRecord(rr.id,{photos:pp}); if(!rs.error) rr.photos=pp; } }
  else if(kind==="mv"){ var mid=block.getAttribute("data-id"); var mv=TB.find(function(x){return x.id===mid;}); if(!mv) return;
    var rm=await sb.from("time_blocks").update({time:newT}).eq("id",mid); if(rm.error){ toast("移動できませんでした"); renderTab(); return; } mv.time=newT; }
  toast("⏰ "+newT+"に移動しました"); renderTab();
}
/* 空き時間タップ→その時刻に予約/施術を追加 */
function schedClick(ev, iso){
  if(ev.target.closest && ev.target.closest(".sched-ev, .sched-move")) return;   // ブロック上はドラッグ/開くで処理
  var sched=ev.currentTarget; var rect=sched.getBoundingClientRect();
  var startH=+sched.getAttribute("data-start")||9;
  var y=ev.clientY-rect.top-8; if(y<0)y=0;              // PAD=8
  var min=startH*60 + y/(48/60); min=snapUnit(min);   // 時間の単位でスナップ
  var t=pad(Math.floor(min/60))+":"+pad(min%60);
  openNewAt(iso, t);
}

/* ===== 予約＋記録を「その日」に束ねる共通処理 ===== */
function dayTimeline(iso){
  var items=BK.filter(function(b){return b.date===iso;}).map(function(b){return {t:b.time||"",kind:"bk",b:b};});
  var groups={};
  RC.filter(function(r){return r.date===iso && !r.booking_id;}).forEach(function(r){
    var c=clientById(r.client_id);
    if(r.client_id && isFacility(c)){   // 施設は1件にまとめる（時間ごと）
      var t=exRec(r).t||""; var key=r.client_id+"|"+t;
      if(!groups[key]){ groups[key]={t:t,kind:"fac",clientId:r.client_id,iso:iso,recs:[]}; items.push(groups[key]); }
      groups[key].recs.push(r);
    } else { items.push({t:exRec(r).t||"",kind:"rc",r:r}); }
  });
  return items.sort(function(a,b){return (a.t||"").localeCompare(b.t||"");});
}
/* 施設グループの補助 */
function menuSummary(recs){ var map={},order=[]; recs.forEach(function(r){ var m=(r.menu||"").trim()||"施術"; if(!(m in map)){map[m]=0;order.push(m);} map[m]++; }); return order.map(function(m){ return map[m]>1?(m+"×"+map[m]):m; }).join("・"); }
function facGroupRecs(clientId, iso, t){ return RC.filter(function(r){ return r.client_id===clientId && r.date===iso && !r.booking_id && (exRec(r).t||"")===t; }); }
async function toggleFacDone(clientId, iso, t){
  var recs=facGroupRecs(clientId,iso,t); if(!recs.length) return;
  var nd=!recs.every(function(r){return !!exRec(r).done;});
  for(var i=0;i<recs.length;i++){ var r=recs[i]; var p=Object.assign({},exRec(r)); if(nd)p.done=true; else delete p.done; var res=await updateRecord(r.id,{photos:p}); if(!res.error) r.photos=p; }
  if(el("overlay")&&el("overlay").classList.contains("show")) closeSheet();
  toast(nd?"✅ 全員 施術終了にしました":"↩ 予定に戻しました"); renderTab();
}
/* 施設の1訪問を開く＝中の全員リスト */

    '<div class="muted" style="margin-bottom:8px;">利用者 '+recs.length+'名。<b>メニュー・料金・時間はここで直せます</b>（名前タップで詳細編集）。</div>'+
    '<div class="row"><div><div class="hint">時間（全員）</div><select id="fv_time">'+timeOptions(t||defHM())+'</select></div>'+
      '<div><div class="hint">施術時間（分）</div><input id="fv_dur" type="number" step="'+TIME_UNIT+'" value="'+(Number(exRec(recs[0]||{}).dur)||60)+'"></div></div>'+
    '<button class="btn '+(allDone?"ghost":"primary")+'" style="margin-top:8px;" onclick="toggleFacDone(\''+clientId+'\',\''+iso+'\',\''+t+'\')">'+(allDone?"↩ 予定に戻す":"✅ 全員 施術終了")+'</button>'+
    '<datalist id="fvMenuDL">'+plArr.map(function(p){return '<option value="'+esc(p.name)+'"></option>';}).join("")+'</datalist>'+
    recs.map(function(r){ var e=exRec(r); var rf=!!e.done;
      return '<div class="item" data-rid="'+r.id+'">'+
        '<div class="top"><div class="name" style="font-size:14px;cursor:pointer;" onclick="closeSheet();openRecordForm(\''+r.id+'\')">'+(e.room?'🚪'+esc(e.room)+' ':'')+esc(e.nm||"お客様")+' ›</div>'+
          '<span class="pill '+(rf?"plan":"done")+'">'+(rf?"済":"予定")+'</span></div>'+
        '<input class="fv_menu" list="fvMenuDL" value="'+esc(r.menu||"")+'" placeholder="メニュー" onchange="fvMenuChange(this,\''+clientId+'\')" style="margin-top:6px;">'+
        '<input class="fv_amt" type="number" value="'+(r.amount||"")+'" placeholder="料金（円）" style="margin-top:6px;">'+
      '</div>';
    }).join("")+
    '<button class="btn primary" style="margin-top:8px;" onclick="saveFacVisit(\''+clientId+'\',\''+iso+'\',\''+t+'\')">💾 保存</button>'+
    '<button class="btn ghost accent" onclick="openFacilityBatch(\''+clientId+'\',{date:\''+iso+'\'})">＋ 利用者を追加・名簿を貼り付け</button>'+
    '<button class="btn ghost" onclick="closeSheet()">閉じる</button>';
  openSheet(body);
}
function fvMenuChange(inp, clientId){ var c=clientById(clientId)||{}; var pl=Array.isArray(c.price_list)?c.price_list:[]; var f=pl.find(function(p){return p.name===inp.value.trim();}); if(f&&f.price!=null){ var amt=inp.parentNode.querySelector(".fv_amt"); if(amt) amt.value=f.price; } }
async function saveFacVisit(clientId, iso, t){
  var newT=(el("fv_time")||{}).value||t; var dur=(el("fv_dur")?Number(el("fv_dur").value)||0:0);
  var rows=document.querySelectorAll("#sheetBody .item[data-rid]"); var n=0;
  for(var i=0;i<rows.length;i++){ var row=rows[i]; var rid=row.getAttribute("data-rid"); var rec=RC.find(function(x){return x.id===rid;}); if(!rec) continue;
    var menu=row.querySelector(".fv_menu").value.trim(); var amt=Number(row.querySelector(".fv_amt").value)||0;
    var p=Object.assign({},exRec(rec)); if(newT)p.t=newT; else delete p.t; if(dur)p.dur=dur; else delete p.dur;
    var res=await updateRecord(rid,{menu:menu, amount:amt, photos:p}); if(!res.error){ rec.menu=menu; rec.amount=amt; rec.photos=p; n++; }
  }
  closeSheet(); toast("💾 "+n+"件を更新しました"); await loadAll(); renderTab();
}

function dateHasEntries(iso){ return BK.some(function(b){return b.date===iso;}) || RC.some(function(r){return r.date===iso && !r.booking_id;}); }

/* ===== 動線マップ（Leaflet＋OSM・無料） ===== */
var _map=null;
/* その日の訪問先を時間順に。住所ありの顧客のみ・重複はまとめる */
function stopsFor(iso){
  var items=dayTimeline(iso);
  var seen={}, out=[];
  items.forEach(function(it){
    var cid=it.kind==="bk"?it.b.client_id:it.r.client_id;
    if(!cid) return;
    var c=clientById(cid);
    if(!c || !(c.address&&c.address.trim())) return;
    if(seen[cid]) return; seen[cid]=1;
    out.push({client:c, t:it.t||""});
  });
  return out;
}
/* 住所→緯度経度（Nominatim・無料）。結果は clients.lat/lng に保存してキャッシュ */
/* 全角数字・ハイフンを半角に寄せる（住所の表記ゆれ対策） */
function normAddr(s){
  return String(s||"").replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);})
    .replace(/[‐‑–—ー－]/g,"-").replace(/\s+/g," ").trim();
}
async function geocodeAddr(addr){
  var q=normAddr(addr); if(!q) return null;
  // ①国土地理院ジオコーダ（日本の住所に強い・丁目/番地/号までヒット・無料・キー不要）
  try{
    var r=await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(q));
    var j=await r.json();
    if(j&&j[0]&&j[0].geometry&&j[0].geometry.coordinates){ var co=j[0].geometry.coordinates; return {lat:+co[1], lng:+co[0]}; }
  }catch(e){}
  // ②OSM Nominatim（フォールバック）
  try{
    var u="https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&accept-language=ja&q="+encodeURIComponent(q);
    var r2=await fetch(u); var j2=await r2.json(); if(j2&&j2[0]) return {lat:+j2[0].lat, lng:+j2[0].lon};
  }catch(e){}
  return null;
}
async function ensureGeocoded(stops){
  var need=stops.filter(function(s){ return !(s.client.lat&&s.client.lng); });
  for(var i=0;i<need.length;i++){
    var c=need[i].client;
    toast("住所を地図に変換中… ("+(i+1)+"/"+need.length+")");
    var g=await geocodeAddr(c.address);
    if(g){ c.lat=g.lat; c.lng=g.lng; try{ await sb.from("clients").update({lat:g.lat,lng:g.lng}).eq("id",c.id); }catch(e){} }
    if(i<need.length-1) await new Promise(function(res){ setTimeout(res,400); });   // 連続呼び出しを軽く間引き
  }
}
/* 番号付きピン */
function numIcon(n){ return L.divIcon({className:"",iconSize:[28,28],iconAnchor:[14,14],html:'<div style="background:var(--accent,#2f9e7d);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);">'+n+'</div>'}); }
function navUrl(lat,lng){ return "https://www.google.com/maps/dir/?api=1&destination="+lat+","+lng; }
function navAllUrl(pts){
  if(!pts.length) return "";
  var dest=pts[pts.length-1];
  var wp=pts.slice(0,-1).map(function(p){return p.client.lat+","+p.client.lng;}).join("|");
  var u="https://www.google.com/maps/dir/?api=1&destination="+dest.client.lat+","+dest.client.lng;
  if(wp) u+="&waypoints="+encodeURIComponent(wp);
  return u;
}
async function showRouteMap(iso){
  var box=el("routeMap"); if(!box) return;
  box.style.display="block";
  var stops=stopsFor(iso);
  if(!stops.length){ box.innerHTML='<div class="list-empty">住所が登録された訪問先がありません。<br>顧客の編集で住所を入れると、地図に表示されます。</div>'; return; }
  box.innerHTML='<div class="muted" style="font-size:12px;margin:2px 0 6px;">地図を準備中…</div>';
  await ensureGeocoded(stops);
  var pts=stops.filter(function(s){ return s.client.lat&&s.client.lng; });
  if(!pts.length){ box.innerHTML='<div class="list-empty">この住所を地図で特定できませんでした：<br>'+
    stops.map(function(s){return '・'+esc(s.client.name)+'（'+esc(s.client.address||"住所なし")+'）';}).join("<br>")+
    '<br><br>「神戸市〇〇区〇〇1-2-3」のように<b>市区町村＋番地</b>まで入れると出ます。予定の施術／予約をタップ→お客様情報の住所を直してください。</div>'; return; }
  box.innerHTML='<div id="mapCanvas" style="height:300px;border-radius:12px;overflow:hidden;border:1px solid var(--line,#e3e3e3);"></div>'+
    '<a class="btn primary" style="margin-top:8px;display:block;text-align:center;text-decoration:none;" href="'+navAllUrl(pts)+'" target="_blank" rel="noopener">🚗 全部まとめてナビ（'+pts.length+'件）</a>'+
    '<div id="routeList" style="margin-top:8px;"></div>';
  if(_map){ _map.remove(); _map=null; }
  _map=L.map("mapCanvas");
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(_map);
  var latlngs=[];
  pts.forEach(function(s,i){
    var ll=[s.client.lat,s.client.lng]; latlngs.push(ll);
    L.marker(ll,{icon:numIcon(i+1)}).addTo(_map)
      .bindPopup('<b>'+(i+1)+'. '+esc(s.client.name)+'</b>'+(s.t?'　'+esc(s.t):'')+'<br><a href="'+navUrl(s.client.lat,s.client.lng)+'" target="_blank" rel="noopener">Googleマップでナビ</a>');
  });
  if(latlngs.length>1) L.polyline(latlngs,{color:"#2f9e7d",weight:3,opacity:.7,dashArray:"6,6"}).addTo(_map);
  if(latlngs.length>1) _map.fitBounds(latlngs,{padding:[30,30]}); else _map.setView(latlngs[0],15);
  setTimeout(function(){ if(_map) _map.invalidateSize(); },150);
  // 下のリスト（順番＋個別ナビ）
  var lh=pts.map(function(s,i){
    return '<div class="item" style="display:flex;justify-content:space-between;align-items:center;">'+
      '<div><span style="display:inline-block;min-width:22px;font-weight:700;color:var(--accent,#2f9e7d);">'+(i+1)+'.</span>'+
      (s.t?'<b>'+esc(s.t)+'</b>　':'')+esc(s.client.name)+'</div>'+
      '<a class="btn ghost sm" style="width:auto;text-decoration:none;" href="'+navUrl(s.client.lat,s.client.lng)+'" target="_blank" rel="noopener">ナビ</a></div>';
  }).join("");
  el("routeList").innerHTML=lh;
}

/* ===== 売上タブ ===== */
var SALES_MONTH=null;
function renderSales(){
  var v=el("view"); if(!SALES_MONTH) SALES_MONTH=curMonth();
  var recs=RC.filter(function(r){return (r.date||"").slice(0,7)===SALES_MONTH && recDone(r);})   // 施術終了のみ売上に反映
    .sort(function(a,b){return (b.date||"").localeCompare(a.date||"");});
  var tot=recs.reduce(function(a,r){return a+recTotal(r);},0);
  var feeTot=recs.reduce(function(a,r){return a+recFee(r);},0);

      '<div class="muted" style="font-size:11px;margin-top:4px;">※「施術終了」にした分だけ売上に反映されます</div>'+
    '</div>';
  if(!recs.length){ html+='<div class="list-empty">この月の売上はまだありません。<br>予定を「✅施術終了」にすると、ここに反映されます。</div>'; v.innerHTML=html; return; }
  html+=breakdownCard("🏢 顧客先・お客様別", sumBy(recs,function(r){ return r.client_id?clientName(r.client_id):(exRec(r).nm||"その他"); }));
  html+=breakdownCard("✂️ メニュー別", sumBy(recs,function(r){ return (r.menu||"").trim()||"（メニュー未記入）"; }));
  html+='<div class="sec">📋 日別明細</div>';
  var lastD="";
  recs.forEach(function(r){
    if(r.date!==lastD){ html+='<div class="sec">📅 '+esc(dateLabel(r.date))+'</div>'; lastD=r.date; }
    var who=recordWho(r);
    html+='<div class="item" onclick="openRecordForm(\''+r.id+'\')"><div class="top">'+
      '<div><div class="name">'+who+'</div>'+
        '<div class="meta">'+(exRec(r).t?'🕐 '+esc(exRec(r).t)+'　':'')+'✂️ '+esc(r.menu||"（メニュー未記入）")+(recFee(r)?'　🚗'+yen(recFee(r)):'')+(r.note?'　📝 '+esc(r.note):"")+'</div></div>'+
      '<span class="amt">'+yen(r.amount)+'</span></div></div>';
  });
  v.innerHTML=html;
}

/* 売上をキー別に集計（金額の多い順） */
function sumBy(recs, keyFn){
  var map={}, order=[];
  recs.forEach(function(r){ var k=keyFn(r)||"（未設定）"; if(!(k in map)){ map[k]={amount:0,count:0}; order.push(k); } map[k].amount+=(r.amount||0); map[k].count++; });
  return order.map(function(k){ return {name:k, amount:map[k].amount, count:map[k].count}; }).sort(function(a,b){ return b.amount-a.amount; });
}
/* 集計カード（上位＋棒グラフ、残りはまとめて表示） */
function breakdownCard(title, rows){
  if(!rows.length) return "";
  var max=rows[0].amount||1, top=rows.slice(0,6);
  var h='<div class="sec">'+title+'</div><div class="card" style="padding:12px;">';
  top.forEach(function(r){
    var pct=Math.max(3,Math.round(r.amount/max*100));
    h+='<div style="margin-bottom:9px;">'+
      '<div style="display:flex;justify-content:space-between;font-size:13px;"><span>'+esc(r.name)+' <span class="muted">('+r.count+')</span></span><span class="amt">'+yen(r.amount)+'</span></div>'+
      '<div style="height:6px;background:var(--bg);border-radius:3px;margin-top:3px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:var(--accent);border-radius:3px;"></div></div>'+
    '</div>';
  });
  if(rows.length>6){ var rest=rows.slice(6).reduce(function(a,r){return a+r.amount;},0); h+='<div class="muted" style="font-size:12px;">ほか'+(rows.length-6)+'件 '+yen(rest)+'</div>'; }
  return h+'</div>';
}

  // お客様情報（住所・電話）も一緒に更新。住所を変えたら地図の座標キャッシュを消す

function usedMenusFor(clientId){   // その顧客の過去メニューだけ（全体を寄せ集めない）
  if(!clientId) return [];
  var recs=RC.filter(function(r){return r.client_id===clientId;}).sort(function(a,b){return (b.date||"").localeCompare(a.date||"");});
  var seen={}, out=[];
  recs.forEach(function(r){ var m=(r.menu||"").trim(); if(!m||seen[m]) return; seen[m]=true; out.push({name:m, price:r.amount||0}); });
  return out;
}
function priceListFor(clientId){
  var c=clientById(clientId);
  if(c&&Array.isArray(c.price_list)&&c.price_list.length) return c.price_list;   // ①顧客/施設の料金表
  if(STD_MENU&&STD_MENU.length) return STD_MENU;                                  // ②標準メニュー（マイ料金表）
  return usedMenusFor(clientId);                                                  // ③この顧客の過去メニューのみ
}
function menuOptionsFor(clientId, selMenu){
  var opts='<option value="">（自由入力）</option>';
  priceListFor(clientId).forEach(function(p){ opts+='<option value="'+esc(p.name)+'" data-price="'+(p.price||0)+'"'+(p.name===selMenu?" selected":"")+'>'+esc(p.name)+' '+yen(p.price)+'</option>'; });
  return opts;
}

/* ===== 施設一括入力の下書き自動保存（途中で離れても消えない） ===== */
function batchDraftKey(){ return "batchdraft_"+(ME&&ME.id); }
function loadBatchDraft(){ try{ return JSON.parse(localStorage.getItem(batchDraftKey())||"null"); }catch(e){ return null; } }
function clearBatchDraft(){ try{ localStorage.removeItem(batchDraftKey()); }catch(e){} }
function readBatchRows(){ var rows=[]; Array.prototype.forEach.call(document.querySelectorAll("#ba_rows .ba-row"),function(row){
  rows.push({ name:row.getAttribute("data-name")||"", mid:row.getAttribute("data-mid")||"", note:row.getAttribute("data-note")||"",
    checked:!!(row.querySelector(".ba_chk")&&row.querySelector(".ba_chk").checked), room:(row.querySelector(".ba_room")||{}).value||"",
    menu:(row.querySelector(".ba_menu")||{}).value||"", amount:(row.querySelector(".ba_amount")||{}).value||"" }); }); return rows; }
function captureBatchDraft(){ if(!window._batch||!el("ba_rows")) return;
  try{ localStorage.setItem(batchDraftKey(), JSON.stringify({ clientId:window._batch.clientId, date:(el("ba_date")||{}).value||"", time:(el("ba_time")||{}).value||"", addr:(el("ba_caddr")||{}).value||"", phone:(el("ba_cphone")||{}).value||"", rows:readBatchRows(), ts:Date.now() })); }catch(e){} }
function wireBatchAutosave(){ if(window._baWired) return; window._baWired=true; var sb2=document.getElementById("sheetBody"); if(!sb2) return;
  var fn=function(){ if(window._batch&&el("ba_rows")){ clearTimeout(window._baT); window._baT=setTimeout(captureBatchDraft,400); } };
  sb2.addEventListener("input",fn); sb2.addEventListener("change",fn); }
function discardBatchDraft(){ if(!confirm("入力途中の内容を破棄して、新規で始めますか？")) return; clearBatchDraft(); var b=window._batch||{}; openFacilityBatch(b.clientId,{date:b.date, booking_id:b.bookingId}); }
async function clearFacilityRoster(){
  var b=window._batch||{}; if(!b.clientId) return;

/* メニューを自由入力。料金表に一致すれば料金を自動セット */
function batchMenuInput(inp){
  var row=inp.closest(".ba-row"); var c=clientById(window._batch.clientId)||{}; var pl=Array.isArray(c.price_list)?c.price_list:[];
  var f=pl.find(function(p){return p.name===inp.value.trim();}); if(f && f.price!=null){ row.querySelector(".ba_amount").value=f.price; }
  var chk=row.querySelector(".ba_chk"); if(inp.value.trim() && !chk.checked){ chk.checked=true; batchToggle(chk); }

function batchToggle(chk){ var row=chk.closest(".ba-row"); row.querySelector(".ba-detail").style.display=chk.checked?"block":"none"; row.classList.toggle("on",chk.checked); }
function batchMenu(sel){ var opt=sel.options[sel.selectedIndex]; if(!opt) return; var row=sel.closest(".ba-row"); var p=opt.getAttribute("data-price"); if(p!=null&&p!=="") row.querySelector(".ba_amount").value=p; var chk=row.querySelector(".ba_chk"); if(!chk.checked){ chk.checked=true; batchToggle(chk); } }
function batchMenuOptions(pl){ return '<option value="">（メニュー）</option>'+pl.map(function(p){ return '<option value="'+esc(p.name)+'" data-price="'+(p.price||0)+'">'+esc(p.name)+' '+yen(p.price)+'</option>'; }).join(""); }

function batchCheckAll(on){ Array.prototype.forEach.call(document.querySelectorAll("#ba_rows .ba-row"),function(row){ var chk=row.querySelector(".ba_chk"); chk.checked=on; batchToggle(chk); }); captureBatchDraft(); }
/* チェック中の全員に、同じメニュー・料金を一括適用 */
function batchApplyAll(){
  var me=el("ba_bulkmenu"); var menu=me?me.value.trim():"";
  var amtEl=el("ba_bulkamt"); var amt=(amtEl&&amtEl.value!=="")?Number(amtEl.value):null;
  var price=null; if(me&&me.tagName==="SELECT"){ var o=me.options[me.selectedIndex]; if(o){ var p=o.getAttribute("data-price"); if(p!=null&&p!=="") price=Number(p); } }
  var n=0;
  Array.prototype.forEach.call(document.querySelectorAll("#ba_rows .ba-row"),function(row){ if(!row.querySelector(".ba_chk").checked) return; n++;
    if(menu){ var ms=row.querySelector(".ba_menu"); if(ms) ms.value=menu; }
    var aEl=row.querySelector(".ba_amount"); if(aEl){ if(amt!=null) aEl.value=amt; else if(price!=null) aEl.value=price; }
  });
  if(!n){ showMsg("先にチェックを入れてください（「✓ 全員チェック」でもOK）"); return; }
  toast(n+"人に適用しました"); captureBatchDraft();
}
async function batchAdd(){
  var name=prompt("追加する利用者名を入力してください"); if(!name||!name.trim()) return; name=name.trim();

function splitCells(ln){ return ln.indexOf("\t")>=0 ? ln.split("\t") : ln.split(","); }
var MENU_WORDS=/カット|カラー|パーマ|顔|そり|剃|シャンプー|ブロー|セット|白髪|トリート|マッサージ/;
/* 貼り付けた表を列ごとに解析し、氏名/メニュー/料金/特記の列を推測 */
function guessCols(grid){
  var head=grid[0]||[];
  var isHead=head.some(function(h){return /氏名|名前|利用者|お名前|施術|メニュー|内容|料金|金額/.test(h||"");});
  var body=isHead?grid.slice(1):grid;
  var ncol=0; grid.forEach(function(r){ if(r.length>ncol)ncol=r.length; });
  var map={name:null,menu:null,amount:null,note:null,room:null};
  if(isHead){ head.forEach(function(h,i){ h=(h||"").trim();
    if(map.name==null&&/氏名|名前|利用者|お名前/.test(h))map.name=i;
    else if(map.room==null&&/部屋|号室|場所|room/i.test(h))map.room=i;
    else if(map.menu==null&&/施術|メニュー|内容/.test(h))map.menu=i;
    else if(map.amount==null&&/料金|金額|価格/.test(h))map.amount=i;
    else if(map.note==null&&/特記|備考|要望|メモ/.test(h))map.note=i; }); }
  var score=[]; for(var c=0;c<ncol;c++){ var num=0,menu=0,jp=0,len=0; body.forEach(function(r){ var v=(r[c]||"").trim(); if(!v)return;
    var vn=v.replace(/[¥￥,，円]/g,""); if(/^\d+$/.test(vn) && Number(vn)>=100) num++;   // 料金らしい数字(100以上)。連番など小さい数は除外
    if(MENU_WORDS.test(v))menu++; if(/[぀-ヿ一-鿿]/.test(v)&&!/^\d/.test(v)){jp++; len+=v.length;} });
    score[c]={num:num,menu:menu,jp:jp,avg:jp?len/jp:0}; }
  if(map.amount==null){ var bA=0,iA=null; score.forEach(function(s,i){ if(s.num>bA){bA=s.num;iA=i;} }); map.amount=iA; }
  if(map.menu==null){ var bM=0,iM=null; score.forEach(function(s,i){ if(s.menu>bM){bM=s.menu;iM=i;} }); map.menu=iM; }
  if(map.name==null){ var bN=0,iN=null; score.forEach(function(s,i){ if(i===map.amount||i===map.menu)return; if(s.jp>bN && s.avg>=2 && s.avg<=6){bN=s.jp;iN=i;} }); map.name=iN; }
  // 前回の割り当てを記憶していれば優先
  try{ var saved=JSON.parse(localStorage.getItem("bulkcolmap_"+(ME&&ME.id))||"null"); if(saved){ ["name","menu","amount","note","room"].forEach(function(k){ if(saved[k]!=null && saved[k]<ncol) map[k]=saved[k]; }); } }catch(e){}
  return {isHead:isHead, body:body, ncol:ncol, map:map};
}

function analyzeBulk(){

    if(kind==="施設"||kind==="病院"){
      var names=[]; Array.prototype.forEach.call(document.querySelectorAll("#cf_newmembers .cf_nm"),function(inp){ var n=inp.value.trim(); if(n) names.push({org_id:PROFILE.org_id,client_id:r.data.id,name:n}); });
      if(names.length) await sb.from("members_t").insert(names);
    }
  }
  closeSheet(); toast("💾 保存しました"); await reloadClients();
}
async function delClient(id){
  if(!confirm("この顧客・施設を削除しますか？（関連する予約・売上も消えます）")) return;
  var r=await sb.from("clients").delete().eq("id",id);
  if(r.error){ showMsg("削除エラー："+esc(r.error.message)); return; }
  closeSheet(); toast("🗑 削除しました"); await loadAll(); renderTab();
}
/* 施設の利用者名簿 */
async function loadRoster(clientId){
  var box=el("cf_members"); if(!box) return;
  var r=await sb.from("members_t").select("*").eq("client_id",clientId).order("created_at",{ascending:true});
  var rows=r.error?[]:(r.data||[]);
  var list=rows.map(function(m){ return '<div class="price-row"><input class="pn" value="'+esc(m.name)+'" onchange="rosterRename(\''+m.id+'\',this.value)"><button class="px" onclick="rosterDel(\''+m.id+'\',\''+clientId+'\')">×</button></div>'; }).join("");
  box.innerHTML=(rows.length?list:'<div class="muted" style="font-size:12px;padding:4px 0;">まだ利用者が登録されていません。</div>')+
    '<div class="price-row" style="margin-top:8px;"><input id="rm_name" class="pn" placeholder="利用者名（例：田中 花子）"><button class="btn ghost accent sm" style="width:auto;" onclick="rosterAdd(\''+clientId+'\')">追加</button></div>';
}
async function rosterAdd(clientId){ var name=el("rm_name").value.trim(); if(!name){ showMsg("利用者名を入力してください"); return; } var r=await sb.from("members_t").insert({org_id:PROFILE.org_id,client_id:clientId,name:name}); if(r.error){ showMsg("追加エラー："+esc(r.error.message)); return; } loadRoster(clientId); }
async function rosterRename(id,name){ name=(name||"").trim(); if(!name) return; await sb.from("members_t").update({name:name}).eq("id",id); }
async function rosterDel(id,clientId){ if(!confirm("この利用者を削除しますか？")) return; var r=await sb.from("members_t").delete().eq("id",id); if(r.error){ showMsg("削除エラー："+esc(r.error.message)); return; } loadRoster(clientId); }

/* ===== 部分リロード ===== */
async function reloadClients(){ var a=await sb.from("clients").select("*").order("created_at",{ascending:true}); CL=a.error?CL:(a.data||[]); renderTab(); }
async function reloadBookings(){ var b=await sb.from("bookings").select("*"); BK=b.error?BK:(b.data||[]); renderTab(); }
async function reloadRecords(){ var c=await sb.from("records").select("*"); RC=c.error?RC:(c.data||[]); renderTab(); }

/* ===== 自動更新（Realtime） ===== */
var RT=null, rtTimer=null, rtFlags={};
function subscribeRealtime(){
  if(RT||!PROFILE) return;
  RT=sb.channel("me-"+PROFILE.org_id)
    .on("postgres_changes",{event:"*",schema:"public",table:"bookings"},function(){ rtBump("bk"); })
    .on("postgres_changes",{event:"*",schema:"public",table:"records"},function(){ rtBump("rc"); })
    .on("postgres_changes",{event:"*",schema:"public",table:"clients"},function(){ rtBump("cl"); })
    .subscribe();
}
function rtBump(f){ rtFlags[f]=1; clearTimeout(rtTimer); rtTimer=setTimeout(async function(){ if(rtFlags.cl){ var a=await sb.from("clients").select("*").order("created_at",{ascending:true}); CL=a.error?CL:(a.data||[]);} if(rtFlags.bk){ var b=await sb.from("bookings").select("*"); BK=b.error?BK:(b.data||[]);} if(rtFlags.rc){ var c=await sb.from("records").select("*"); RC=c.error?RC:(c.data||[]);} rtFlags={}; if(!el("overlay").classList.contains("show")) renderTab(); },500); }
function unsubscribeRealtime(){ if(RT){ sb.removeChannel(RT); RT=null; } }

/* ===== 使い方・ヘルプ ===== */
function helpItem(title, body){ return '<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:4px;">'+title+'</div><div class="muted" style="font-size:13px;line-height:1.7;">'+body+'</div></div>'; }
function openHelp(){
  var body='<div class="sheet-title">使い方・ヘルプ</div>'+
    '<div class="muted" style="margin-bottom:8px;">訪問美容の <b>予約・顧客・売上</b> をこれひとつで管理できます。</div>'+
    helpItem("① 始め方（3ステップ）","1. <b>顧客・施設を登録</b>（顧客タブ）<br>2. <b>予約を作る</b>（予定タブ／任意）<br>3. <b>施術を記録</b>（今日タブ）→ 料金が<b>売上に自動集計</b>されます。")+
    helpItem("🏢 施設の使い方","施設を登録する画面で、<b>利用者（入居者）の名簿</b>も一緒に入れられます（あとから編集も可）。<br>訪問したら「施術を記録」で名簿が出るので、<b>その日対応した人だけチェック</b>してまとめて保存。<br>※名簿は候補。前回対応した人は<b>自動でチェック済み</b>になります。入退居は随時直せます。")+
    helpItem("💴 施術情報を入力 / 📅 予約を入力","今日タブ・予定タブ・顧客タブのどこからでも、同じ<b>施術カード</b>（住所・時間・メニュー・料金・出張料など）で入力できます。施設は選ぶと団体入力（名簿貼り付け・全員一括）になります。")+
    helpItem("📅 予約","先の予定も入れられます。予約をタップ→「この予約の施術を記録」で、顧客や日付が引き継がれてラクに記録できます。")+
    helpItem("💰 売上の見方","売上タブで、月ごとの合計と一覧が見られます。上の ‹ › で月を切り替え。")+
    helpItem("📱 複数の端末・自動更新","同じアカウントでログインすれば、どの端末でも同じデータ。変更は自動で反映されます（電波がある時）。")+
    helpItem("🧹 データのリセット","設定 → 「データをすべてリセット」で、自分のデータを全部消せます（元に戻せません）。")+
    '<button class="btn ghost" onclick="closeSheet()">閉じる</button>';
  openSheet(body);
}

/* ===== 標準メニュー（マイ料金表） ===== */
function openStdMenu(){
  var body='<div class="sheet-title">標準メニュー（料金表）</div>'+
    '<div class="muted" style="margin-bottom:8px;">よく使うメニューと料金を登録しておくと、<b>どのお客様の記録でも選べます</b>（施設など個別の料金表を設定した先は、そちらが優先）。</div>'+
    '<div id="sm_rows">'+(STD_MENU.length?STD_MENU.map(function(p){return priceRow(p.name,p.price);}).join(""):priceRow("",""))+'</div>'+
    '<button class="btn ghost sm" style="width:auto;" onclick="el(\'sm_rows\').insertAdjacentHTML(\'beforeend\', priceRow(\'\',\'\'))">＋ メニューを追加</button>'+
    '<div id="m"></div>'+
    '<button class="btn primary" onclick="saveStdMenuForm()">保存</button>'+
    '<button class="btn ghost" onclick="closeSheet()">閉じる</button>';
  openSheet(body);
}
function saveStdMenuForm(){
  var out=[]; Array.prototype.forEach.call(document.querySelectorAll("#sm_rows .price-row"),function(r){ var n=r.querySelector(".pn").value.trim(); var p=Number(r.querySelector(".pp").value)||0; if(n) out.push({name:n,price:p}); });
  STD_MENU=out; localStorage.setItem("stdmenu_"+ME.id, JSON.stringify(out));
  closeSheet(); toast("🧾 標準メニューを保存しました");
}

/* ===== 設定 ===== */
function openSettings(){
  var body='<div class="sheet-title">設定</div>'+
    '<div class="card"><div class="hint">お名前</div><div style="font-weight:700;">'+esc(PROFILE.name||"")+'</div>'+
      '<div class="hint" style="margin-top:8px;">メール</div><div>'+esc(ME.email||"")+'</div></div>'+
    '<button class="btn ghost accent" onclick="openStdMenu()">🧾 標準メニュー（料金表）</button>'+
    '<button class="btn ghost accent" onclick="downloadRosterTemplate()">📥 名簿の雛形をダウンロード</button>'+
    '<div class="muted" style="font-size:11px;margin:-2px 0 6px;">施設や協力スタッフに配って、同じ形式で名簿をもらえます（そのまま取り込み可）。</div>'+
    '<div class="hint" style="margin-top:4px;">⏱ 時間の単位（予約・ドラッグ移動/伸縮の刻み）</div>'+
    '<div class="seg-wrap" id="tu_seg" style="margin-bottom:8px;">'+[5,10,15,30].map(function(u){return '<button class="seg'+(TIME_UNIT===u?" on":"")+'" onclick="setTimeUnit('+u+')">'+u+'分</button>';}).join("")+'</div>'+
    '<button class="btn ghost accent" onclick="openColorSettings()">🎨 表示の色（予定・施術終了・移動）</button>'+
    '<button class="btn ghost accent" onclick="openHelp()">❓ 使い方・ヘルプ</button>'+
    '<div class="card"><div class="hint">組織リンク（今後）</div><div class="muted" style="font-size:12px;">サロン等で使う場合、ここに組織コードを入れると情報を共有できるようにする予定です。</div></div>'+
    '<button class="btn danger" onclick="resetAll()">🧹 自分のデータをすべてリセット</button>'+
    '<div class="muted" style="font-size:12px;text-align:center;">顧客・予約・施術の記録を全部消します。元に戻せません。</div>'+
    '<button class="btn ghost" onclick="doSignOut()" style="color:var(--hint);">ログアウト</button>'+
    '<button class="btn ghost" onclick="closeSheet()">閉じる</button>';
  openSheet(body);
}
async function resetAll(){
  if(!confirm("⚠️ 自分の【顧客・利用者・予約・売上】をすべて削除します。\n元に戻せません。よろしいですか？")) return;
  if(!confirm("最終確認：本当に全部削除しますか？")) return;
  var org=PROFILE.org_id, tables=["records","bookings","members_t","clients"];
  for(var i=0;i<tables.length;i++){ var r=await sb.from(tables[i]).delete().eq("org_id",org); if(r.error){ alert("リセットエラー："+r.error.message); return; } }
  await loadAll(); closeSheet(); toast("🧹 リセットしました"); renderTab();
}
async function doSignOut(){ unsubscribeRealtime(); await sb.auth.signOut(); ME=null; PROFILE=null; closeSheet(); renderAuth(); }

boot();
</script>
