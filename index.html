<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1d9e75">
<title>訪問美容 管理</title>
<style>
  :root{
    --bg:#f4f6f5; --surface:#ffffff; --line:#e4e8e6;
    --text:#1f2624; --muted:#6b7572; --hint:#9aa3a0;
    --accent:#1d9e75; --accent-soft:#e1f5ee; --accent-text:#0f6e56;
    --warn:#ba7517; --warn-soft:#faeeda; --danger:#a32d2d;
    --radius:12px; --radius-sm:8px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; padding-bottom:72px;}
  h1,h2,h3{font-weight:600; margin:0;}
  button{font-family:inherit; cursor:pointer;}
  .wrap{max-width:920px; margin:0 auto; padding:16px;}

  header.top{position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line);}
  .top-in{max-width:920px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between;}
  .brand{font-size:17px; font-weight:600;}
  .brand small{display:block; font-size:11px; color:var(--muted); font-weight:400;}
  .date-nav{display:flex; align-items:center; gap:6px;}
  .date-nav button{border:1px solid var(--line); background:var(--surface); width:34px; height:34px; border-radius:var(--radius-sm); font-size:16px; color:var(--text);}
  .date-nav .d{font-size:14px; min-width:104px; text-align:center;}

  .cards{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px;}
  .card .lbl{font-size:12px; color:var(--muted);}
  .card .val{font-size:22px; font-weight:600; margin-top:2px;}

  .sec-title{font-size:13px; color:var(--muted); margin:18px 4px 8px;}

  .visit{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px; cursor:pointer;}
  .visit:active{background:#fafbfb;}
  .visit .row1{display:flex; align-items:center; justify-content:space-between;}
  .visit .name{font-size:16px; font-weight:600;}
  .visit .time{font-size:13px; color:var(--muted);}
  .visit .meta{font-size:13px; color:var(--muted); margin-top:4px;}
  .tag{display:inline-block; font-size:11px; padding:2px 9px; border-radius:20px; margin-top:8px;}
  .tag.plan{background:#eef1f0; color:var(--muted);}
  .tag.done{background:var(--accent-soft); color:var(--accent-text);}
  .tag.todo{background:var(--warn-soft); color:var(--warn);}

  .empty{text-align:center; color:var(--hint); padding:34px 16px; font-size:14px;}
  .empty .btn{max-width:320px; margin:16px auto 0;}

  .fab{position:fixed; right:18px; bottom:84px; z-index:30; background:var(--accent); color:#fff; border:none;
    width:56px; height:56px; border-radius:50%; font-size:28px; box-shadow:0 4px 14px rgba(29,158,117,.4);}

  nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--surface); border-top:1px solid var(--line); display:flex;}
  nav.tabs button{flex:1; border:none; background:none; padding:9px 0 8px; color:var(--muted); font-size:11px; display:flex; flex-direction:column; align-items:center; gap:3px;}
  nav.tabs button .ic{font-size:20px; line-height:1;}
  nav.tabs button.on{color:var(--accent);}

  /* モーダル */
  .modal-bg{position:fixed; inset:0; background:rgba(20,28,25,.45); z-index:40; display:none; align-items:flex-end; justify-content:center;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--surface); width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:18px 18px 0 0; padding:18px 18px 28px;}
  @media(min-width:640px){ .modal-bg{align-items:center;} .modal{border-radius:18px;} }
  .modal h2{font-size:17px; margin-bottom:6px;}
  .modal .lead{font-size:13px; color:var(--muted); margin-bottom:8px;}
  label{display:block; font-size:13px; color:var(--muted); margin:12px 0 5px;}
  input,select,textarea{width:100%; font-family:inherit; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface); color:var(--text);}
  textarea{resize:vertical; min-height:54px;}
  .btn{display:block; width:100%; padding:13px; border:none; border-radius:var(--radius-sm); font-size:15px; font-weight:600; margin-top:18px;}
  .btn.primary{background:var(--accent); color:#fff;}
  .btn.ghost{background:none; border:1px solid var(--line); color:var(--muted); font-weight:400; margin-top:8px;}
  .btn.danger{background:none; border:1px solid var(--line); color:var(--danger); font-weight:400; margin-top:8px;}
  .row-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{padding:8px 14px; border:1px solid var(--line); border-radius:20px; font-size:14px; background:var(--surface);}
  .chip.sel{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-text);}

  .rec-row{display:grid; grid-template-columns:1fr 104px; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line);}
  .rec-row .cn{font-size:14px;}
  .rec-row .care{font-size:11px; color:var(--warn); margin-top:2px;}
  .rec-row input{padding:9px 10px; font-size:14px;}

  .fac-block{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
  .fac-block .fn{font-size:15px; font-weight:600; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .fac-block .fn .edit{font-size:12px; color:var(--muted); font-weight:400; background:none; border:none; padding:4px;}
  .cust-li{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:14px;}
  .cust-li .cc{color:var(--warn); font-size:12px;}
  .cust-li .del{background:none; border:none; color:var(--hint); font-size:16px; padding:2px 6px;}
  .add-link{background:none; border:none; color:var(--accent); font-size:14px; padding:8px 0; font-weight:500;}
  .list-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--line); font-size:15px;}
  .list-row:first-child{border-top:none;}
  .list-row .del{background:none; border:none; color:var(--hint); font-size:16px; padding:2px 8px;}

  .sum-bar{display:flex; align-items:center; gap:8px; margin:8px 0;}
  .sum-bar .nm{width:104px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sum-bar .track{flex:1; height:14px; background:#eef1f0; border-radius:7px; overflow:hidden;}
  .sum-bar .fill{height:100%; background:var(--accent);}
  .sum-bar .am{width:84px; text-align:right; font-size:13px;}
  .toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#1f2624; color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; z-index:60; opacity:0; transition:opacity .25s; pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header class="top" id="topbar" style="display:none">
  <div class="top-in">
    <div class="brand" id="brand">訪問美容<small>管理</small></div>
    <div class="date-nav" id="dateNav">
      <button onclick="shiftDay(-1)">‹</button>
      <span class="d" id="dLabel"></span>
      <button onclick="shiftDay(1)">›</button>
    </div>
  </div>
</header>

<div class="wrap" id="view"></div>

<button class="fab" id="fab" onclick="onFab()" style="display:none">＋</button>

<nav class="tabs" id="tabs" style="display:none">
  <button data-tab="today" class="on" onclick="go('today')"><span class="ic">📅</span>今日</button>
  <button data-tab="customers" onclick="go('customers')"><span class="ic">👥</span>顧客台帳</button>
  <button data-tab="summary" onclick="go('summary')"><span class="ic">📊</span>売上集計</button>
  <button data-tab="settings" onclick="go('settings')"><span class="ic">⚙️</span>設定</button>
</nav>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   DB層 ―― ここだけ後でクラウド(Supabase等)に差し替えれば共有化できる
   今は端末内(localStorage)に保存する
   ============================================================ */
var STORE_KEY = "houmon_app_v2";

function loadDB(){
  var raw = localStorage.getItem(STORE_KEY);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return emptyDB();
}
function saveDB(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* 空のDB（どの事業者でも使える初期状態） */
function emptyDB(){
  return {
    settings: {bizName:"", ready:false},
    staff: [], facilities: [], customers: [], visits: [], records: []
  };
}

/* 任意：サンプルデータ（お試し用） */
function fillSample(){
  var t = ymd(new Date());
  DB.staff = [{id:"s1",name:"担当A"},{id:"s2",name:"担当B"}];
  DB.facilities = [
    {id:"f1",name:"サンプル園",type:"施設",address:"",note:""},
    {id:"f2",name:"在宅 サンプル様",type:"在宅",address:"",note:""}
  ];
  DB.customers = [
    {id:"c1",facilityId:"f1",name:"利用者 一郎",care:"車椅子"},
    {id:"c2",facilityId:"f1",name:"利用者 花子",care:""},
    {id:"c3",facilityId:"f2",name:"サンプル 様",care:""}
  ];
  DB.visits = [
    {id:"v1",date:t,time:"13:00",facilityId:"f1",staffIds:["s1","s2"],status:"plan",note:""},
    {id:"v2",date:t,time:"15:30",facilityId:"f2",staffIds:["s1"],status:"plan",note:""}
  ];
  DB.records = [];
}

var DB = loadDB();

/* ============================================================
   ユーティリティ
   ============================================================ */
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function yen(n){ return "¥"+(n||0).toLocaleString("ja-JP"); }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function facName(id){ var f=DB.facilities.find(function(x){return x.id===id;}); return f?f.name:"(不明)"; }
function staffName(id){ var s=DB.staff.find(function(x){return x.id===id;}); return s?s.name:"?"; }
function custOf(facId){ return DB.customers.filter(function(c){return c.facilityId===facId;}); }
function recOfVisit(vid){ return DB.records.filter(function(r){return r.visitId===vid;}); }
function visitTotal(vid){ return recOfVisit(vid).reduce(function(a,r){return a+(Number(r.amount)||0);},0); }

var current = new Date();
var tab = "today";

function shiftDay(n){ current.setDate(current.getDate()+n); render(); }
function go(t){ tab=t; document.querySelectorAll("nav.tabs button").forEach(function(b){b.classList.toggle("on", b.dataset.tab===t);});
  document.getElementById("dateNav").style.visibility = (t==="today")?"visible":"hidden";
  document.getElementById("fab").style.display = (t==="today"||t==="customers")?"block":"none";
  render();
}
function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(function(){t.classList.remove("show");},1600); }

/* ============================================================
   描画
   ============================================================ */
function render(){
  document.getElementById("brand").innerHTML = esc(DB.settings.bizName||"訪問美容")+"<small>訪問美容 管理</small>";
  document.getElementById("dLabel").textContent = fmtDate(current);
  if(tab==="today") renderToday();
  else if(tab==="customers") renderCustomers();
  else if(tab==="summary") renderSummary();
  else renderSettings();
}
function fmtDate(d){ var w=["日","月","火","水","木","金","土"]; return (d.getMonth()+1)+"/"+d.getDate()+" ("+w[d.getDay()]+")"; }

function renderToday(){
  var ds = ymd(current);
  var vs = DB.visits.filter(function(v){return v.date===ds;}).sort(function(a,b){return a.time.localeCompare(b.time);});
  var people = vs.reduce(function(a,v){return a+custOf(v.facilityId).length;},0);
  var sales = vs.reduce(function(a,v){return a+visitTotal(v.id);},0);

  var h = '<div class="cards">'
    + card("訪問", vs.length+"件")
    + card("対象人数", people+"名")
    + card("売上", yen(sales))
    + '</div>';

  if(vs.length===0){
    h += '<div class="empty">この日の訪問予約はありません。'
      + '<button class="btn primary" onclick="addVisitForm()">＋ 訪問を追加</button></div>';
  } else {
    vs.forEach(function(v){
      var done = v.status==="done";
      var tg = done ? '<span class="tag done">完了 '+yen(visitTotal(v.id))+'</span>'
                    : (recOfVisit(v.id).length>0 ? '<span class="tag todo">入力中</span>' : '<span class="tag plan">予定</span>');
      h += '<div class="visit" onclick="openVisit(\''+v.id+'\')">'
        + '<div class="row1"><span class="name">'+esc(facName(v.facilityId))+'</span><span class="time">'+v.time+'</span></div>'
        + '<div class="meta">利用者 '+custOf(v.facilityId).length+'名 ・ 担当 '+(v.staffIds.map(staffName).join("/")||"未設定")+'</div>'
        + tg + '</div>';
    });
  }
  document.getElementById("view").innerHTML = h;
}
function card(l,v){ return '<div class="card"><div class="lbl">'+l+'</div><div class="val">'+v+'</div></div>'; }

function renderCustomers(){
  var h = '<div class="sec-title">施設・在宅先 と 利用者</div>';
  h += '<button class="btn primary" onclick="addFacilityForm()" style="margin:0 0 14px">＋ 訪問先を追加</button>';
  if(DB.facilities.length===0){
    h += '<div class="empty">訪問先がまだありません。<br>上のボタンから施設・在宅先を登録してください。</div>';
  }
  DB.facilities.forEach(function(f){
    var cs = custOf(f.id);
    h += '<div class="fac-block"><div class="fn"><span>'+esc(f.name)+' <span style="font-size:11px;color:var(--muted)">'+esc(f.type)+'</span></span>'
      + '<button class="edit" onclick="editFacilityForm(\''+f.id+'\')">編集</button></div>';
    cs.forEach(function(c){
      var sub = [];
      if(c.menu) sub.push(esc(c.menu)+(c.price?" "+yen(c.price):""));
      else if(c.price) sub.push(yen(c.price));
      if(c.phone) sub.push("☎ "+esc(c.phone));
      var subline = sub.length? '<div style="font-size:12px;color:var(--muted)">'+sub.join("　")+'</div>':'';
      h += '<div class="cust-li" onclick="customerForm(\''+f.id+'\',\''+c.id+'\')"><div><div>'+esc(c.name)
        +(c.care?' <span class="cc">⚠ '+esc(c.care)+'</span>':'')+'</div>'+subline+'</div>'
        + '<button class="del" onclick="event.stopPropagation();delCustomer(\''+c.id+'\')">✕</button></div>';
    });
    h += '<button class="add-link" onclick="customerForm(\''+f.id+'\')">＋ 利用者を追加</button>';
    h += '</div>';
  });
  document.getElementById("view").innerHTML = h;
}

function renderSummary(){
  var ym = ymd(current).slice(0,7);
  var recs = DB.records.filter(function(r){
    var v = DB.visits.find(function(x){return x.id===r.visitId;});
    return v && v.date.slice(0,7)===ym;
  });
  var total = recs.reduce(function(a,r){return a+(Number(r.amount)||0);},0);

  var byStaff = {}, byFac = {};
  recs.forEach(function(r){
    byStaff[r.staffId] = (byStaff[r.staffId]||0) + (Number(r.amount)||0);
    var v = DB.visits.find(function(x){return x.id===r.visitId;});
    if(v) byFac[v.facilityId] = (byFac[v.facilityId]||0) + (Number(r.amount)||0);
  });

  var h = '<div class="sec-title">'+ym.replace("-","年")+'月 の売上</div>';
  h += '<div class="card" style="margin-bottom:16px"><div class="lbl">月間売上合計</div><div class="val">'+yen(total)+'</div></div>';
  h += '<div class="sec-title">担当別</div>' + bars(byStaff, staffName, total);
  h += '<div class="sec-title">施設別</div>' + bars(byFac, facName, total);
  if(total===0) h += '<div class="empty">この月の売上入力はまだありません。</div>';
  document.getElementById("view").innerHTML = h;
}
function bars(obj, nameFn, total){
  var keys = Object.keys(obj).sort(function(a,b){return obj[b]-obj[a];});
  if(keys.length===0) return '';
  var max = Math.max.apply(null, keys.map(function(k){return obj[k];}));
  var h='<div class="card">';
  keys.forEach(function(k){
    var pct = max? Math.round(obj[k]/max*100):0;
    h += '<div class="sum-bar"><span class="nm">'+esc(nameFn(k))+'</span><span class="track"><span class="fill" style="width:'+pct+'%"></span></span><span class="am">'+yen(obj[k])+'</span></div>';
  });
  return h+'</div>';
}

function renderSettings(){
  var h = '<div class="sec-title">事業者</div><div class="card">'
    + '<div class="list-row"><span>事業者名</span><span style="color:var(--muted)">'+esc(DB.settings.bizName||"未設定")+'</span></div>'
    + '<button class="add-link" onclick="editBizForm()">事業者名を変更</button></div>';

  h += '<div class="sec-title">担当（スタッフ）</div><div class="card">';
  if(DB.staff.length===0) h += '<div style="font-size:13px;color:var(--muted)">担当が未登録です。</div>';
  DB.staff.forEach(function(s){
    h += '<div class="list-row"><span>'+esc(s.name)+'</span><button class="del" onclick="delStaff(\''+s.id+'\')">✕</button></div>';
  });
  h += '<button class="add-link" onclick="addStaffForm()">＋ 担当を追加</button></div>';

  h += '<div class="sec-title">データ</div><div class="card">';
  h += '<div style="font-size:13px;color:var(--muted);margin-bottom:8px">このデータはこの端末の中だけに保存されています（無料・お試し版）。複数人で共有するには次の段階でクラウド接続します。</div>';
  h += '<button class="btn ghost" onclick="exportJSON()">バックアップを書き出す</button>';
  h += '<button class="btn danger" onclick="resetDB()">すべてのデータを消去</button>';
  h += '</div>';
  document.getElementById("view").innerHTML = h;
}

/* ============================================================
   モーダル
   ============================================================ */
function openModal(html){ document.getElementById("modal").innerHTML=html; document.getElementById("modalBg").classList.add("open"); }
function closeModal(){ document.getElementById("modalBg").classList.remove("open"); }

function onFab(){ if(tab==="today") addVisitForm(); else if(tab==="customers") addFacilityForm(); }

/* ---- 初回セットアップ ---- */
function setupForm(){
  document.getElementById("modalBg").classList.add("open");
  document.getElementById("modal").innerHTML =
    '<h2>はじめに</h2><div class="lead">このアプリを使う事業者の情報を登録します（あとで変更できます）。</div>'
    + '<label>事業者名・屋号</label><input id="suBiz" placeholder="例：○○ビューティー">'
    + '<label>最初の担当者（あなたの名前）</label><input id="suStaff" placeholder="例：山田">'
    + '<label style="margin-top:16px"><input type="checkbox" id="suSample" style="width:auto;vertical-align:-2px;margin-right:6px">サンプルデータを入れて使い方を試す</label>'
    + '<button class="btn primary" onclick="saveSetup()">はじめる</button>';
}
function saveSetup(){
  var biz=document.getElementById("suBiz").value.trim();
  var staff=document.getElementById("suStaff").value.trim();
  if(!biz){ toast("事業者名を入力してください"); return; }
  if(document.getElementById("suSample").checked){ fillSample(); }
  DB.settings.bizName = biz;
  DB.settings.ready = true;
  if(staff) DB.staff.push({id:uid(), name:staff});
  saveDB(); closeModal(); boot();
}

/* ---- 予約追加（その場で訪問先も作れる） ---- */
function addVisitForm(){
  var facOpts = DB.facilities.map(function(f){return '<option value="'+f.id+'">'+esc(f.name)+'</option>';}).join("");
  facOpts += '<option value="__new__">＋ 新しい訪問先を入力…</option>';
  var staffChips = DB.staff.length
    ? DB.staff.map(function(s){return '<span class="chip" data-sid="'+s.id+'" onclick="this.classList.toggle(\'sel\')">'+esc(s.name)+'</span>';}).join("")
    : '<span style="font-size:13px;color:var(--muted)">担当は設定タブで追加できます</span>';
  openModal(
    '<h2>訪問を追加</h2>'
    + '<label>訪問先</label><select id="mFac" onchange="toggleNewFac()">'+facOpts+'</select>'
    + '<div id="newFacWrap" style="display:none"><label>新しい訪問先の名前</label><input id="mNewFac" placeholder="例：○○園 / 在宅 △△様">'
    + '<label>種別</label><select id="mNewFacType"><option>施設</option><option>在宅</option></select></div>'
    + '<div class="row-2"><div><label>日付</label><input type="date" id="mDate" value="'+ymd(current)+'"></div>'
    + '<div><label>時間</label><input type="time" id="mTime" value="13:00"></div></div>'
    + '<label>担当（複数可）</label><div class="chips" id="mStaff">'+staffChips+'</div>'
    + '<label>メモ</label><textarea id="mNote" placeholder="駐車場・持ち物など"></textarea>'
    + '<button class="btn primary" onclick="saveVisit()">保存</button>'
    + '<button class="btn ghost" onclick="closeModal()">キャンセル</button>'
  );
  if(DB.facilities.length===0){ document.getElementById("mFac").value="__new__"; toggleNewFac(); }
}
function toggleNewFac(){
  var isNew = document.getElementById("mFac").value==="__new__";
  document.getElementById("newFacWrap").style.display = isNew? "block":"none";
}
function saveVisit(){
  var facId = document.getElementById("mFac").value;
  if(facId==="__new__"){
    var nm=document.getElementById("mNewFac").value.trim();
    if(!nm){ toast("新しい訪問先の名前を入力してください"); return; }
    facId = uid();
    DB.facilities.push({id:facId, name:nm, type:document.getElementById("mNewFacType").value, address:"", note:""});
  }
  var sids = Array.prototype.slice.call(document.querySelectorAll("#mStaff .chip.sel")).map(function(c){return c.dataset.sid;});
  var v = {id:uid(), date:document.getElementById("mDate").value, time:document.getElementById("mTime").value,
    facilityId:facId, staffIds:sids, status:"plan", note:document.getElementById("mNote").value};
  DB.visits.push(v); saveDB(); closeModal();
  current = new Date(v.date+"T00:00:00"); go("today"); toast("訪問を追加しました");
}

/* ---- 予約詳細・実績入力 ---- */
function openVisit(vid){
  var v = DB.visits.find(function(x){return x.id===vid;});
  var cs = custOf(v.facilityId);
  var existing = recOfVisit(vid);
  var staffOpts = (v.staffIds.length? v.staffIds : DB.staff.map(function(s){return s.id;}));
  var staffSel = staffOpts.length
    ? '<select id="recStaff">'+staffOpts.map(function(id){return '<option value="'+id+'">'+esc(staffName(id))+'</option>';}).join("")+'</select>'
    : '<div style="font-size:13px;color:var(--muted)">担当が未登録です（設定タブで追加できます）</div>';

  var rows = cs.map(function(c){
    var ex = existing.find(function(r){return r.customerId===c.id;});
    var dMenu = ex? (ex.menu||"") : (c.menu||"");      // 未入力なら定番メニューを初期表示
    var dAmt  = ex? (ex.amount||"") : (c.price||"");   // 未入力なら通常価格を初期表示
    return '<div class="rec-row"><div><div class="cn">'+esc(c.name)+'</div>'+(c.care?'<div class="care">⚠ '+esc(c.care)+'</div>':'')
      + '<input type="text" class="rMenu" data-cid="'+c.id+'" placeholder="施術（カット等）" value="'+esc(dMenu)+'" style="margin-top:4px"></div>'
      + '<input type="number" inputmode="numeric" class="rAmt" data-cid="'+c.id+'" placeholder="金額" value="'+dAmt+'"></div>';
  }).join("");

  openModal(
    '<h2>'+esc(facName(v.facilityId))+' <span style="font-size:13px;color:var(--muted)">'+v.date+' '+v.time+'</span></h2>'
    + '<label>担当（この実績の記録者）</label>'+staffSel
    + '<div style="font-size:13px;color:var(--muted);margin:14px 0 4px">利用者ごとに施術と金額を入力</div>'
    + (rows || '<div class="empty">この施設に利用者が未登録です。<button class="btn primary" onclick="closeModal();go(\'customers\')">顧客台帳で追加</button></div>')
    + (cs.length? '<button class="btn primary" onclick="saveRecords(\''+vid+'\')">完了として保存</button>':'')
    + '<button class="btn danger" onclick="delVisit(\''+vid+'\')">この訪問を削除</button>'
    + '<button class="btn ghost" onclick="closeModal()">閉じる</button>'
  );
}
function saveRecords(vid){
  var staffEl = document.getElementById("recStaff");
  var staffId = staffEl? staffEl.value : "";
  DB.records = DB.records.filter(function(r){return r.visitId!==vid;});
  var menus = document.querySelectorAll(".rMenu");
  var amts = document.querySelectorAll(".rAmt");
  var any=false;
  amts.forEach(function(a,i){
    var amount = Number(a.value)||0;
    var menu = menus[i].value;
    if(amount>0 || menu){
      DB.records.push({id:uid(), visitId:vid, customerId:a.dataset.cid, staffId:staffId, menu:menu, amount:amount});
      any=true;
    }
  });
  var v = DB.visits.find(function(x){return x.id===vid;});
  v.status = any ? "done" : "plan";
  saveDB(); closeModal(); render(); toast(any?"完了を記録しました":"保存しました");
}
function delVisit(vid){
  if(confirm("この訪問予約を削除しますか？")){
    DB.visits = DB.visits.filter(function(x){return x.id!==vid;});
    DB.records = DB.records.filter(function(r){return r.visitId!==vid;});
    saveDB(); closeModal(); render(); toast("削除しました");
  }
}

/* ---- 訪問先（施設）追加・編集 ---- */
function addFacilityForm(){
  openModal(
    '<h2>訪問先を追加</h2>'
    + '<label>名称</label><input id="fName" placeholder="○○園 / 在宅 △△様">'
    + '<label>種別</label><select id="fType"><option>施設</option><option>在宅</option></select>'
    + '<label>住所・メモ</label><input id="fAddr" placeholder="駐車場・アクセスなど">'
    + '<button class="btn primary" onclick="saveFacility()">保存</button>'
    + '<button class="btn ghost" onclick="closeModal()">キャンセル</button>'
  );
  setTimeout(function(){ var e=document.getElementById("fName"); if(e) e.focus(); },50);
}
function saveFacility(){
  var name=document.getElementById("fName").value.trim(); if(!name){toast("名称を入力してください");return;}
  DB.facilities.push({id:uid(), name:name, type:document.getElementById("fType").value, address:document.getElementById("fAddr").value, note:""});
  saveDB(); closeModal(); go("customers"); toast("訪問先を追加しました");
}
function editFacilityForm(facId){
  var f=DB.facilities.find(function(x){return x.id===facId;});
  openModal(
    '<h2>訪問先を編集</h2>'
    + '<label>名称</label><input id="fName" value="'+esc(f.name)+'">'
    + '<label>種別</label><select id="fType"><option'+(f.type==="施設"?" selected":"")+'>施設</option><option'+(f.type==="在宅"?" selected":"")+'>在宅</option></select>'
    + '<label>住所・メモ</label><input id="fAddr" value="'+esc(f.address||"")+'">'
    + '<button class="btn primary" onclick="updateFacility(\''+facId+'\')">保存</button>'
    + '<button class="btn danger" onclick="delFacility(\''+facId+'\')">この訪問先を削除</button>'
    + '<button class="btn ghost" onclick="closeModal()">キャンセル</button>'
  );
}
function updateFacility(facId){
  var f=DB.facilities.find(function(x){return x.id===facId;});
  var name=document.getElementById("fName").value.trim(); if(!name){toast("名称を入力してください");return;}
  f.name=name; f.type=document.getElementById("fType").value; f.address=document.getElementById("fAddr").value;
  saveDB(); closeModal(); render(); toast("更新しました");
}
function delFacility(facId){
  var hasVisit = DB.visits.some(function(v){return v.facilityId===facId;});
  var msg = hasVisit? "この訪問先と、ひも付く利用者・訪問予約も削除します。よろしいですか？" : "この訪問先と利用者を削除しますか？";
  if(confirm(msg)){
    DB.facilities = DB.facilities.filter(function(x){return x.id!==facId;});
    DB.customers = DB.customers.filter(function(c){return c.facilityId!==facId;});
    DB.visits = DB.visits.filter(function(v){return v.facilityId!==facId;});
    saveDB(); closeModal(); render(); toast("削除しました");
  }
}

/* ---- 利用者 追加・編集・削除（詳細項目） ---- */
function ageOf(birth){
  if(!birth) return "";
  var b=new Date(birth); if(isNaN(b)) return "";
  var n=new Date(); var a=n.getFullYear()-b.getFullYear();
  var m=n.getMonth()-b.getMonth();
  if(m<0||(m===0&&n.getDate()<b.getDate())) a--;
  return a;
}
function genderOpts(sel){
  return ["未選択","女性","男性","その他"].map(function(g){
    return '<option'+((sel||"未選択")===g?" selected":"")+'>'+g+'</option>';
  }).join("");
}
/* 追加(cidなし)・編集(cidあり)を兼ねる */
function customerForm(facId, cid){
  var c = cid ? DB.customers.find(function(x){return x.id===cid;}) : {};
  var isEdit = !!cid;
  var age = ageOf(c.birth); var ageTxt = age!==""? "（"+age+"歳）":"";
  openModal(
    '<h2>'+(isEdit?'利用者を編集':'利用者を追加')+' <span style="font-size:13px;color:var(--muted)">'+esc(facName(facId))+'</span></h2>'
    + '<div class="sec-title" style="margin:6px 0 0">基本</div>'
    + '<label>お名前</label><input id="cName" value="'+esc(c.name||"")+'" placeholder="お名前">'
    + '<label>フリガナ</label><input id="cKana" value="'+esc(c.kana||"")+'" placeholder="ヤマダ ハナコ">'
    + '<div class="row-2"><div><label>性別</label><select id="cGender">'+genderOpts(c.gender)+'</select></div>'
    + '<div><label>生年月日 <span style="color:var(--accent-text)">'+ageTxt+'</span></label><input type="date" id="cBirth" value="'+esc(c.birth||"")+'"></div></div>'
    + '<div class="sec-title">連絡先</div>'
    + '<label>電話番号</label><input type="tel" id="cPhone" value="'+esc(c.phone||"")+'" placeholder="090-0000-0000">'
    + '<label>住所</label><input id="cAddr" value="'+esc(c.address||"")+'" placeholder="神戸市…">'
    + '<div class="sec-title">施術（訪問入力時に自動表示）</div>'
    + '<label>定番メニュー</label><input id="cMenu" value="'+esc(c.menu||"")+'" placeholder="カット / カット＋カラー 等">'
    + '<label>通常価格（円）</label><input type="number" inputmode="numeric" id="cPrice" value="'+(c.price||"")+'" placeholder="3300">'
    + '<div class="sec-title">安全・配慮</div>'
    + '<label>配慮・注意事項</label><textarea id="cCare" placeholder="車椅子 / 耳が遠い / アレルギー / ペースメーカー / 皮膚・血圧 等">'+esc(c.care||"")+'</textarea>'
    + '<div class="sec-title">その他</div>'
    + '<label>緊急連絡先（ご家族・ケアマネ等）</label><input id="cEmg" value="'+esc(c.emergency||"")+'" placeholder="長女 090-… / ケアマネ ○○">'
    + '<label>メモ</label><textarea id="cNote" placeholder="申し送り・履歴など">'+esc(c.note||"")+'</textarea>'
    + '<button class="btn primary" onclick="saveCustomerForm(\''+facId+'\','+(cid?'\''+cid+'\'':'null')+')">保存</button>'
    + (isEdit? '<button class="btn danger" onclick="delCustomer(\''+cid+'\')">この利用者を削除</button>':'')
    + '<button class="btn ghost" onclick="closeModal()">キャンセル</button>'
  );
  setTimeout(function(){ var e=document.getElementById("cName"); if(e&&!isEdit) e.focus(); },50);
}
function gv(id){ var e=document.getElementById(id); return e? e.value.trim():""; }
function saveCustomerForm(facId, cid){
  var name=gv("cName"); if(!name){toast("お名前を入力してください");return;}
  var data = {
    name:name, kana:gv("cKana"), gender:gv("cGender"), birth:gv("cBirth"),
    phone:gv("cPhone"), address:gv("cAddr"), menu:gv("cMenu"),
    price:Number(gv("cPrice"))||0, care:gv("cCare"), emergency:gv("cEmg"), note:gv("cNote")
  };
  if(cid){
    var c=DB.customers.find(function(x){return x.id===cid;});
    for(var k in data) c[k]=data[k];
    toast("更新しました");
  } else {
    data.id=uid(); data.facilityId=facId; DB.customers.push(data);
    toast("利用者を追加しました");
  }
  saveDB(); closeModal(); render();
}
function delCustomer(cid){
  if(confirm("この利用者を削除しますか？")){
    DB.customers = DB.customers.filter(function(c){return c.id!==cid;});
    saveDB(); closeModal(); render(); toast("削除しました");
  }
}

/* ---- データ操作 ---- */
function exportJSON(){
  var blob = new Blob([JSON.stringify(DB,null,2)], {type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="houmon_backup.json"; a.click();
}
function resetDB(){
  if(confirm("すべてのデータを消去し、最初のセットアップからやり直します。よろしいですか？")){
    localStorage.removeItem(STORE_KEY); DB=emptyDB(); saveDB(); boot();
  }
}

/* ============================================================
   起動
   ============================================================ */
function boot(){
  if(!DB.settings || !DB.settings.ready){
    document.getElementById("topbar").style.display="none";
    document.getElementById("tabs").style.display="none";
    document.getElementById("fab").style.display="none";
    document.getElementById("view").innerHTML="";
    setupForm();
    return;
  }
  document.getElementById("topbar").style.display="block";
  document.getElementById("tabs").style.display="flex";
  go("today");
}
boot();
</script>
