<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1d9e75">
<title>訪問美容 受付・管理</title>
<style>
  :root{
    --bg:#f4f6f5; --surface:#ffffff; --line:#e4e8e6;
    --text:#1f2624; --muted:#6b7572; --hint:#9aa3a0;
    --accent:#1d9e75; --accent-soft:#e1f5ee; --accent-text:#0f6e56;
    --info:#185fa5; --info-soft:#e6f1fb;
    --warn:#ba7517; --warn-soft:#faeeda; --danger:#a32d2d;
    --radius:12px; --radius-sm:8px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; padding-bottom:72px;}
  h1,h2,h3{font-weight:600; margin:0;}
  button{font-family:inherit; cursor:pointer;}
  .wrap{max-width:920px; margin:0 auto; padding:16px;}

  header.top{position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line);}
  .top-in{max-width:920px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between;}
  .brand{font-size:17px; font-weight:600;}
  .brand small{display:block; font-size:11px; color:var(--muted); font-weight:400;}
  .date-nav{display:flex; align-items:center; gap:6px;}
  .date-nav button{border:1px solid var(--line); background:var(--surface); width:34px; height:34px; border-radius:var(--radius-sm); font-size:16px; color:var(--text);}
  .date-nav .d{font-size:14px; min-width:104px; text-align:center;}

  .cards{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px;}
  .card .lbl{font-size:12px; color:var(--muted);}
  .card .val{font-size:22px; font-weight:600; margin-top:2px;}

  .sec-title{font-size:13px; color:var(--muted); margin:18px 4px 8px;}

  .recept-btn{display:block; width:100%; background:var(--accent); color:#fff; border:none; padding:15px; border-radius:var(--radius); font-size:16px; font-weight:600; margin-bottom:14px; box-shadow:0 3px 10px rgba(29,158,117,.3);}

  .booking{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px; cursor:pointer;}
  .booking:active{background:#fafbfb;}
  .booking .row1{display:flex; align-items:center; justify-content:space-between;}
  .booking .name{font-size:16px; font-weight:600;}
  .booking .time{font-size:13px; color:var(--muted);}
  .booking .meta{font-size:13px; color:var(--muted); margin-top:4px;}
  .kindtag{display:inline-block; font-size:11px; padding:1px 8px; border-radius:20px; background:var(--info-soft); color:var(--info); margin-left:6px; vertical-align:1px;}
  .ch{display:inline-block; font-size:11px; color:var(--muted);}
  .tag{display:inline-block; font-size:11px; padding:2px 9px; border-radius:20px; margin-top:8px;}
  .tag.plan{background:#eef1f0; color:var(--muted);}
  .tag.done{background:var(--accent-soft); color:var(--accent-text);}
  .tag.todo{background:var(--warn-soft); color:var(--warn);}

  .empty{text-align:center; color:var(--hint); padding:30px 16px; font-size:14px;}

  nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--surface); border-top:1px solid var(--line); display:flex;}
  nav.tabs button{flex:1; border:none; background:none; padding:9px 0 8px; color:var(--muted); font-size:11px; display:flex; flex-direction:column; align-items:center; gap:3px;}
  nav.tabs button .ic{font-size:20px; line-height:1;}
  nav.tabs button.on{color:var(--accent);}

  .modal-bg{position:fixed; inset:0; background:rgba(20,28,25,.45); z-index:40; display:none; align-items:flex-end; justify-content:center;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--surface); width:100%; max-width:580px; max-height:94vh; overflow:auto; border-radius:18px 18px 0 0; padding:18px 18px 28px;}
  @media(min-width:640px){ .modal-bg{align-items:center;} .modal{border-radius:18px;} }
  .modal h2{font-size:17px; margin-bottom:4px;}
  .modal .lead{font-size:13px; color:var(--muted); margin-bottom:6px;}
  label{display:block; font-size:13px; color:var(--muted); margin:12px 0 5px;}
  input,select,textarea{width:100%; font-family:inherit; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface); color:var(--text);}
  textarea{resize:vertical; min-height:54px;}
  .btn{display:block; width:100%; padding:13px; border:none; border-radius:var(--radius-sm); font-size:15px; font-weight:600; margin-top:16px;}
  .btn.primary{background:var(--accent); color:#fff;}
  .btn.ghost{background:none; border:1px solid var(--line); color:var(--muted); font-weight:400; margin-top:8px;}
  .btn.danger{background:none; border:1px solid var(--line); color:var(--danger); font-weight:400; margin-top:8px;}
  .row-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{padding:8px 14px; border:1px solid var(--line); border-radius:20px; font-size:14px; background:var(--surface);}
  .chip.sel{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-text);}
  .stepnum{display:inline-block; font-size:11px; color:var(--accent-text); background:var(--accent-soft); border-radius:20px; padding:1px 9px; margin-right:6px;}

  .search-res{border:1px solid var(--line); border-radius:var(--radius-sm); margin-top:6px; max-height:200px; overflow:auto;}
  .search-res .it{padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer; font-size:14px;}
  .search-res .it:last-child{border-bottom:none;}
  .search-res .it:active{background:var(--accent-soft);}
  .picked{border:1px solid var(--accent); background:var(--accent-soft); border-radius:var(--radius-sm); padding:10px 12px; margin-top:6px;}

  .rulebox{background:var(--warn-soft); border:1px solid #f0d9a8; border-radius:var(--radius-sm); padding:10px 12px; margin:8px 0; font-size:13px; color:var(--warn);}

  .client-block{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
  .client-block .fn{font-size:15px; font-weight:600; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .client-block .fn .edit{font-size:12px; color:var(--muted); font-weight:400; background:none; border:none; padding:4px;}
  .mem-li{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:14px; cursor:pointer;}
  .mem-li .cc{color:var(--warn); font-size:12px;}
  .mem-li .del{background:none; border:none; color:var(--hint); font-size:16px; padding:2px 6px;}
  .add-link{background:none; border:none; color:var(--accent); font-size:14px; padding:8px 0; font-weight:500;}
  .list-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--line); font-size:15px;}
  .list-row:first-child{border-top:none;}
  .list-row .del{background:none; border:none; color:var(--hint); font-size:16px; padding:2px 8px;}

  .rec-card{border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px; margin-bottom:8px;}
  .rec-grid{display:grid; grid-template-columns:1fr 104px; gap:8px;}
  .rec-grid input{padding:9px 10px; font-size:14px;}

  .sum-bar{display:flex; align-items:center; gap:8px; margin:8px 0;}
  .sum-bar .nm{width:104px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sum-bar .track{flex:1; height:14px; background:#eef1f0; border-radius:7px; overflow:hidden;}
  .sum-bar .fill{height:100%; background:var(--accent);}
  .sum-bar .am{width:84px; text-align:right; font-size:13px;}
  .toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#1f2624; color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; z-index:60; opacity:0; transition:opacity .25s; pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header class="top" id="topbar" style="display:none">
  <div class="top-in">
    <div class="brand" id="brand">訪問美容<small>受付・管理</small></div>
    <div class="date-nav" id="dateNav">
      <button onclick="shiftDay(-1)">‹</button>
      <span class="d" id="dLabel"></span>
      <button onclick="shiftDay(1)">›</button>
    </div>
  </div>
</header>

<div class="wrap" id="view"></div>

<nav class="tabs" id="tabs" style="display:none">
  <button data-tab="today" class="on" onclick="go('today')"><span class="ic">📅</span>予約</button>
  <button data-tab="customers" onclick="go('customers')"><span class="ic">👥</span>顧客</button>
  <button data-tab="summary" onclick="go('summary')"><span class="ic">📊</span>売上</button>
  <button data-tab="settings" onclick="go('settings')"><span class="ic">⚙️</span>設定</button>
</nav>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   DB層 ―― ここだけ後でクラウド(Supabase等)に差し替えれば共有化できる
   モデル： clients(顧客先/区分) ＞ members(利用者) ＋ bookings(予約) ＋ records(実績)
   ============================================================ */
var STORE_KEY = "houmon_app_v3";
function loadDB(){ var r=localStorage.getItem(STORE_KEY); if(r){try{return JSON.parse(r);}catch(e){}} return emptyDB(); }
function saveDB(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); return true; }catch(e){ toast("保存容量の上限です。写真を減らすか、クラウド接続をご検討ください"); return false; } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function emptyDB(){
  return { settings:{bizName:"", regNumber:"", mode:"solo", ready:false}, staff:[], clients:[], members:[], bookings:[], records:[] };
}
function fillSample(){
  var t=ymd(new Date());
  DB.staff=[{id:"s1",name:"担当A"},{id:"s2",name:"担当B"}];
  DB.clients=[
    {id:"cl1",kind:"施設",name:"サンプル施設",address:"",phone:"",billing:"施設一括",payMethod:"施設一括",rules:"",note:""},
    {id:"cl2",kind:"個人",name:"個人 サンプル様",address:"",phone:"",billing:"個人",payMethod:"現金",rules:"",note:""},
    {id:"cl3",kind:"病院",name:"サンプル病院",address:"",phone:"",billing:"施設一括",payMethod:"施設一括",rules:"面会受付で記帳・検温。指定エリアのみ。",note:""}
  ];
  DB.members=[
    {id:"m1",clientId:"cl1",name:"利用者 一郎",menu:"カット",price:3300,care:"車椅子",staffId:"s1",cycleWeeks:4},
    {id:"m2",clientId:"cl1",name:"利用者 花子",menu:"カット",price:3300,staffId:"s2"},
    {id:"m3",clientId:"cl2",name:"サンプル 様",menu:"カット",price:4000,staffId:"s1",cycleWeeks:6}
  ];
  DB.bookings=[{id:"b1",date:t,time:"13:00",clientId:"cl1",channel:"電話",staffIds:["s1","s2"],note:"",status:"plan"}];
  DB.records=[];
}
var DB=loadDB();

/* ============================================================
   ユーティリティ
   ============================================================ */
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function yen(n){ return "¥"+(n||0).toLocaleString("ja-JP"); }
function esc(s){ return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function clientOf(id){ return DB.clients.find(function(x){return x.id===id;}); }
function clientName(id){ var c=clientOf(id); return c?c.name:"(不明)"; }
function clientKind(id){ var c=clientOf(id); return c?c.kind:""; }
function memberOf(id){ return DB.members.find(function(x){return x.id===id;}); }
function membersOf(clId){ return DB.members.filter(function(m){return m.clientId===clId;}); }
function staffName(id){ var s=DB.staff.find(function(x){return x.id===id;}); return s?s.name:"?"; }
function recOfBooking(bid){ return DB.records.filter(function(r){return r.bookingId===bid;}); }
function bookingTotal(bid){ return recOfBooking(bid).reduce(function(a,r){return a+(Number(r.amount)||0);},0); }

var current=new Date(); var tab="today";
function shiftDay(n){ current.setDate(current.getDate()+n); render(); }
function go(t){ tab=t; document.querySelectorAll("nav.tabs button").forEach(function(b){b.classList.toggle("on", b.dataset.tab===t);});
  document.getElementById("dateNav").style.visibility=(t==="today")?"visible":"hidden"; render(); }
function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(function(){t.classList.remove("show");},1700); }
function openModal(h){ document.getElementById("modal").innerHTML=h; document.getElementById("modalBg").classList.add("open"); }
function closeModal(){ document.getElementById("modalBg").classList.remove("open"); }

/* 写真ヘルパー */
var photoBuf={};
function pickPhoto(key){
  var inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.capture="environment";
  inp.onchange=function(){ var f=inp.files[0]; if(!f) return; var img=new Image(); var u=URL.createObjectURL(f);
    img.onload=function(){ var sc=Math.min(1,500/Math.max(img.width,img.height)); var cw=Math.round(img.width*sc),ch=Math.round(img.height*sc);
      var cv=document.createElement("canvas"); cv.width=cw; cv.height=ch; cv.getContext("2d").drawImage(img,0,0,cw,ch); URL.revokeObjectURL(u);
      photoBuf[key]=cv.toDataURL("image/jpeg",0.5); var pv=document.getElementById("pv_"+key); if(pv){pv.src=photoBuf[key]; pv.style.display="block";} };
    img.src=u; };
  inp.click();
}
function photoSlot(key,existing,label){
  var src=(photoBuf[key]!==undefined?photoBuf[key]:(existing||""));
  return '<div style="margin-top:6px"><div style="font-size:12px;color:var(--muted);margin-bottom:4px">'+label+'</div>'
    +'<img id="pv_'+key+'" src="'+src+'" style="display:'+(src?"block":"none")+';max-width:110px;border-radius:8px;border:1px solid var(--line);margin-bottom:6px">'
    +'<button type="button" class="chip" onclick="pickPhoto(\''+key+'\')">📷 写真</button>'
    +(src?' <button type="button" class="chip" onclick="clearPhoto(\''+key+'\')">削除</button>':'')+'</div>';
}
function clearPhoto(k){ photoBuf[k]=""; var pv=document.getElementById("pv_"+k); if(pv){pv.src="";pv.style.display="none";} }

function ageOf(b){ if(!b) return ""; var d=new Date(b); if(isNaN(d)) return ""; var n=new Date(); var a=n.getFullYear()-d.getFullYear(); var m=n.getMonth()-d.getMonth(); if(m<0||(m===0&&n.getDate()<d.getDate()))a--; return a; }
function lastBookingDate(mid){ var ds=DB.records.filter(function(r){return r.memberId===mid;}).map(function(r){var b=DB.bookings.find(function(x){return x.id===r.bookingId;});return b?b.date:"";}).filter(Boolean).sort(); return ds.length?ds[ds.length-1]:""; }
function nextDue(m){ if(!m.cycleWeeks) return ""; var last=lastBookingDate(m.id); if(!last) return ""; var d=new Date(last+"T00:00:00"); d.setDate(d.getDate()+m.cycleWeeks*7); return ymd(d); }

/* ============================================================
   描画
   ============================================================ */
function render(){
  document.getElementById("brand").innerHTML=esc(DB.settings.bizName||"訪問美容")+"<small>訪問美容 受付・管理</small>";
  document.getElementById("dLabel").textContent=fmtDate(current);
  if(tab==="today") renderToday();
  else if(tab==="customers") renderCustomers();
  else if(tab==="summary") renderSummary();
  else renderSettings();
}
function fmtDate(d){ var w=["日","月","火","水","木","金","土"]; return (d.getMonth()+1)+"/"+d.getDate()+" ("+w[d.getDay()]+")"; }
function card(l,v){ return '<div class="card"><div class="lbl">'+l+'</div><div class="val">'+v+'</div></div>'; }

function renderToday(){
  var ds=ymd(current);
  var bs=DB.bookings.filter(function(b){return b.date===ds;}).sort(function(a,b){return a.time.localeCompare(b.time);});
  var ppl=bs.reduce(function(a,b){return a+membersOf(b.clientId).length;},0);
  var sales=bs.reduce(function(a,b){return a+bookingTotal(b.id);},0);

  var h='<button class="recept-btn" onclick="receptionWizard()">＋ 予約を受付する</button>';
  h+='<div class="cards">'+card("予約",bs.length+"件")+card("対象",ppl+"名")+card("売上",yen(sales))+'</div>';

  // リマインド
  var today=ymd(new Date());
  var due=DB.members.filter(function(m){var d=nextDue(m); return d&&d<=today;});
  if(due.length){
    h+='<div class="card" style="background:var(--warn-soft);border-color:#f0d9a8;margin-bottom:14px"><div style="font-size:13px;color:var(--warn);font-weight:600;margin-bottom:4px">⏰ そろそろの方（'+due.length+'名）</div>'
      +due.slice(0,6).map(function(m){return '<div style="font-size:13px;color:var(--warn)">・'+esc(m.name)+'（'+esc(clientName(m.clientId))+'）目安 '+nextDue(m)+'</div>';}).join("")+'</div>';
  }

  if(bs.length===0){ h+='<div class="empty">この日の予約はありません。<br>上のボタンから受付できます。</div>'; }
  else { bs.forEach(function(b){
    var done=b.status==="done";
    var tg=done?'<span class="tag done">完了 '+yen(bookingTotal(b.id))+'</span>':(recOfBooking(b.id).length>0?'<span class="tag todo">入力中</span>':'<span class="tag plan">予定</span>');
    h+='<div class="booking" onclick="openBooking(\''+b.id+'\')"><div class="row1"><span class="name">'+esc(clientName(b.clientId))+'<span class="kindtag">'+esc(clientKind(b.clientId))+'</span></span><span class="time">'+b.time+'</span></div>'
      +'<div class="meta">対象 '+membersOf(b.clientId).length+'名 ・ 担当 '+(b.staffIds.map(staffName).join("/")||"未設定")+(b.channel?' ・ <span class="ch">受付 '+esc(b.channel)+'</span>':'')+'</div>'+tg+'</div>';
  }); }
  document.getElementById("view").innerHTML=h;
}

function renderCustomers(){
  var h='<div class="sec-title">顧客先（区分）と 利用者</div>';
  h+='<button class="btn primary" onclick="clientForm()" style="margin:0 0 14px">＋ 顧客先を追加</button>';
  if(DB.clients.length===0) h+='<div class="empty">顧客先がまだありません。<br>受付するか、上のボタンから登録してください。</div>';
  DB.clients.forEach(function(cl){
    var ms=membersOf(cl.id);
    h+='<div class="client-block"><div class="fn"><span>'+esc(cl.name)+' <span class="kindtag">'+esc(cl.kind)+'</span></span><button class="edit" onclick="clientForm(\''+cl.id+'\')">編集</button></div>';
    if(cl.rules) h+='<div class="rulebox">⚠ ルール：'+esc(cl.rules)+'</div>';
    ms.forEach(function(m){
      var sub=[]; if(m.staffId) sub.push("担当 "+esc(staffName(m.staffId))); if(m.menu) sub.push(esc(m.menu)+(m.price?" "+yen(m.price):"")); else if(m.price) sub.push(yen(m.price));
      var subline=sub.length?'<div style="font-size:12px;color:var(--muted)">'+sub.join("　")+'</div>':'';
      var d=nextDue(m); var dueB=d?'<div style="font-size:12px;color:'+(d<=ymd(new Date())?"var(--warn)":"var(--accent-text)")+'">'+(d<=ymd(new Date())?"⏰ そろそろ":"次回目安")+' '+d+'</div>':'';
      h+='<div class="mem-li" onclick="memberForm(\''+cl.id+'\',\''+m.id+'\')"><div><div>'+esc(m.name)+(m.care?' <span class="cc">⚠ '+esc(m.care)+'</span>':'')+'</div>'+subline+dueB+'</div>'
        +'<button class="del" onclick="event.stopPropagation();delMember(\''+m.id+'\')">✕</button></div>';
    });
    h+='<button class="add-link" onclick="memberForm(\''+cl.id+'\')">＋ 利用者を追加</button></div>';
  });
  document.getElementById("view").innerHTML=h;
}

function renderSummary(){
  var ym=ymd(current).slice(0,7);
  var recs=DB.records.filter(function(r){var b=DB.bookings.find(function(x){return x.id===r.bookingId;});return b&&b.date.slice(0,7)===ym;});
  var total=recs.reduce(function(a,r){return a+(Number(r.amount)||0);},0);
  var byStaff={},byClient={};
  recs.forEach(function(r){ byStaff[r.staffId]=(byStaff[r.staffId]||0)+(Number(r.amount)||0); var b=DB.bookings.find(function(x){return x.id===r.bookingId;}); if(b) byClient[b.clientId]=(byClient[b.clientId]||0)+(Number(r.amount)||0); });
  var h='<div class="sec-title">'+ym.replace("-","年")+'月 の売上</div>';
  h+='<div class="card" style="margin-bottom:16px"><div class="lbl">月間売上合計</div><div class="val">'+yen(total)+'</div></div>';
  h+='<div class="sec-title">担当別</div>'+bars(byStaff,staffName,total);
  h+='<div class="sec-title">顧客先別</div>'+bars(byClient,clientName,total);
  if(total===0) h+='<div class="empty">この月の売上入力はまだありません。</div>';
  document.getElementById("view").innerHTML=h;
}
function bars(obj,fn,total){ var keys=Object.keys(obj).sort(function(a,b){return obj[b]-obj[a];}); if(!keys.length) return ''; var max=Math.max.apply(null,keys.map(function(k){return obj[k];}));

      +(rc.kind==="個人"?'':'<label>ルール・注意（任意）</label><input id="rcRules" value="'+esc(rc.f.rules)+'" placeholder="受付記帳・検温・指定エリア 等">')

function rcSet(k,v){ rc[k]=v; rcCapture(); drawReception(); }
function rcStaff(id){ var i=rc.staffIds.indexOf(id); if(i>=0) rc.staffIds.splice(i,1); else rc.staffIds.push(id); rcCapture(); drawReception(); }
function rcCapture(){ // 入力中の値を保持（再描画で消えないように）
  var map={rcDate:"date",rcTime:"time",rcMenu:"menu",rcPrice:"price",rcWish:"wish",rcNote:"note",rcClName:"clName",rcRules:"rules"};
  Object.keys(map).forEach(function(id){var e=document.getElementById(id); if(e) rc.f[map[id]]=e.value;});
}
function rcSearchRun(q){
  q=q.trim(); var res=document.getElementById("rcRes"); if(!q){res.innerHTML="";return;}
  var hits=DB.members.filter(function(m){return (m.name||"").indexOf(q)>=0||(m.kana||"").indexOf(q)>=0;}).slice(0,8)
    .map(function(m){return {type:"m",id:m.id,cl:m.clientId,label:m.name+"（"+clientName(m.clientId)+"）"};});
  DB.clients.filter(function(c){return (c.name||"").indexOf(q)>=0;}).slice(0,6).forEach(function(c){hits.push({type:"c",id:c.id,cl:c.id,label:c.name+"（"+c.kind+"）"});});
  res.innerHTML = hits.length? '<div class="search-res">'+hits.map(function(x){return '<div class="it" onclick="rcPick(\''+x.type+'\',\''+x.id+'\',\''+x.cl+'\')">'+esc(x.label)+'</div>';}).join("")+'</div>'
    : '<div style="font-size:13px;color:var(--muted);padding:6px 2px">該当なし。「＋ 新規のお客様」で登録できます。</div>';
}
function rcPick(type,id,cl){ rcCapture(); rc.clientId=cl; rc.memberId=(type==="m"?id:""); rc.newClient=false;
  if(rc.memberId){ var m=memberOf(rc.memberId); if(!rc.f.menu) rc.f.menu=m.menu||""; if(!rc.f.price) rc.f.price=m.price||""; } // リピートは前回内容を初期表示
  drawReception(); }
function rcNew(){ rc.newClient=true; rc.clientId=""; rc.memberId=""; rcCapture(); drawReception(); }
function rcClear(){ rc.clientId=""; rc.memberId=""; rc.newClient=false; rcCapture(); drawReception(); }
function rcConfirm(){
  rcCapture();
  var clientId=rc.clientId;
  if(rc.newClient){
    var nm=(rc.f.clName||"").trim();
    if(!nm){toast((rc.kind==="個人"?"お名前":"施設・病院名")+"を入力してください");return;}
    clientId=uid();
    DB.clients.push({id:clientId,kind:rc.kind,name:nm,address:"",phone:"",billing:(rc.kind==="個人"?"個人":"施設一括"),payMethod:(rc.kind==="個人"?"現金":"施設一括"),rules:rc.f.rules||"",note:""});
    if(rc.kind==="個人"){ // 本人を利用者として登録
      var mid=uid(); DB.members.push({id:mid,clientId:clientId,name:nm,menu:(rc.f.menu||"").trim(),price:Number(rc.f.price)||0,staffId:rc.staffIds[0]||""}); rc.memberId=mid;
    }
  }
  if(!clientId){toast("お客様を選ぶか、新規で登録してください");return;}
  var b={id:uid(),date:rc.f.date,time:rc.f.time,clientId:clientId,channel:rc.channel,staffIds:rc.staffIds.slice(),
    note:rc.f.note||"",wish:rc.f.wish||"",status:"plan"};
  DB.bookings.push(b);
  // 内容が入っていれば実績の下書きとして保存（個人/リピート向け）
  var menu=(rc.f.menu||"").trim(), price=Number(rc.f.price)||0;
  if(rc.memberId && (menu||price)){ DB.records.push({id:uid(),bookingId:b.id,memberId:rc.memberId,staffId:rc.staffIds[0]||"",menu:menu,amount:price,photoBefore:"",photoAfter:"",paid:false}); }
  if(saveDB()){ closeModal(); current=new Date(b.date+"T00:00:00"); go("today"); toast("予約を受け付けました"); }
}

function openBooking(bid){
  photoBuf={};
  var b=DB.bookings.find(function(x){return x.id===bid;});
  var cl=clientOf(b.clientId); var ms=membersOf(b.clientId); var existing=recOfBooking(bid);
  var defStaff=(b.staffIds&&b.staffIds.length)?b.staffIds[0]:"";
  var rows=ms.map(function(m){
    var ex=existing.find(function(r){return r.memberId===m.id;});
    var dMenu=ex?(ex.menu||""):(m.menu||""); var dAmt=ex?(ex.amount||""):(m.price||""); var dStaff=ex?(ex.staffId||""):(m.staffId||defStaff);
    var staffSel=DB.staff.length?'<select class="rStaff" data-mid="'+m.id+'"><option value="">（未設定）</option>'+DB.staff.map(function(s){return '<option value="'+s.id+'"'+(s.id===dStaff?" selected":"")+'>'+esc(s.name)+'</option>';}).join("")+'</select>':'';
    return '<div class="rec-card"><div style="font-weight:600">'+esc(m.name)+'</div>'+(m.care?'<div style="font-size:11px;color:var(--warn)">⚠ '+esc(m.care)+'</div>':'')
      +'<div class="rec-grid" style="margin-top:6px"><input type="text" class="rMenu" data-mid="'+m.id+'" placeholder="施術" value="'+esc(dMenu)+'"><input type="number" inputmode="numeric" class="rAmt" data-mid="'+m.id+'" placeholder="金額" value="'+dAmt+'"></div>'
      +(staffSel?'<div style="margin-top:6px"><span style="font-size:12px;color:var(--muted)">担当</span> '+staffSel+'</div>':'')
      +'<div style="display:flex;gap:14px;margin-top:8px">'+photoSlot("bf_"+m.id,ex&&ex.photoBefore,"施術前")+photoSlot("af_"+m.id,ex&&ex.photoAfter,"施術後")+'</div>'
      +(ex?'<button class="add-link" onclick="issueReceipt(\''+bid+'\',\''+m.id+'\')">🧾 この方の領収書を発行</button>':'')
      +'</div>';
  }).join("");
  var h='<h2>'+esc(cl.name)+' <span class="kindtag">'+esc(cl.kind)+'</span></h2><div class="lead">'+b.date+' '+b.time+(b.channel?' ・ 受付 '+esc(b.channel):'')+'</div>';
  if(cl.rules) h+='<div class="rulebox">⚠ ルール：'+esc(cl.rules)+'</div>';
  if(b.wish) h+='<div style="font-size:13px;margin:6px 0">ご希望：'+esc(b.wish)+'</div>';
  h+='<div style="font-size:13px;color:var(--muted);margin:10px 0 6px">利用者ごとに 施術・金額・担当・写真 を入力</div>'
    +(rows||'<div class="empty">この顧客先に利用者が未登録です。<button class="btn primary" onclick="closeModal();go(\'customers\')">顧客タブで追加</button></div>')
    +(ms.length?'<button class="btn primary" onclick="saveRecords(\''+bid+'\')">完了として保存</button>':'')
    +'<button class="btn ghost" onclick="memberForm(\''+b.clientId+'\')">＋ この顧客先に利用者を追加</button>'
    +'<button class="btn danger" onclick="delBooking(\''+bid+'\')">この予約を削除</button>'
    +'<button class="btn ghost" onclick="closeModal()">閉じる</button>';
  openModal(h);
}
function saveRecords(bid){
  var existing=recOfBooking(bid);
  DB.records=DB.records.filter(function(r){return r.bookingId!==bid;});
  var any=false;
  document.querySelectorAll(".rMenu").forEach(function(menuEl){
    var mid=menuEl.dataset.mid; var amtEl=document.querySelector('.rAmt[data-mid="'+mid+'"]'); var stEl=document.querySelector('.rStaff[data-mid="'+mid+'"]');
    var amount=Number(amtEl.value)||0; var menu=menuEl.value; var ex=existing.find(function(r){return r.memberId===mid;});
    var bf=photoBuf["bf_"+mid]!==undefined?photoBuf["bf_"+mid]:(ex?ex.photoBefore:""); var af=photoBuf["af_"+mid]!==undefined?photoBuf["af_"+mid]:(ex?ex.photoAfter:"");
    if(amount>0||menu||bf||af){ DB.records.push({id:uid(),bookingId:bid,memberId:mid,staffId:stEl?stEl.value:"",menu:menu,amount:amount,photoBefore:bf||"",photoAfter:af||"",paid:ex?ex.paid:false}); any=true; }
  });
  var b=DB.bookings.find(function(x){return x.id===bid;}); b.status=any?"done":"plan";
  if(saveDB()){ closeModal(); render(); toast(any?"完了を記録しました":"保存しました"); }
}
function delBooking(bid){ if(confirm("この予約を削除しますか？")){ DB.bookings=DB.bookings.filter(function(x){return x.id!==bid;}); DB.records=DB.records.filter(function(r){return r.bookingId!==bid;}); saveDB(); closeModal(); render(); toast("削除しました"); } }

/* ============================================================
   領収書（汎用：事業者名・登録番号は設定から）
   ============================================================ */
function issueReceipt(bid,mid){
  var b=DB.bookings.find(function(x){return x.id===bid;}); var m=memberOf(mid); var cl=clientOf(b.clientId);
  var rec=DB.records.find(function(r){return r.bookingId===bid&&r.memberId===mid;}); if(!rec){toast("先に金額を保存してください");return;}
  var to = (cl.billing==="施設一括")? cl.name+" 御中" : m.name+" 様";
  var w=window.open("","_blank","width=420,height=620");
  if(!w){toast("ポップアップを許可してください");return;}
  var reg=DB.settings.regNumber?('<div style="font-size:12px;margin-top:4px">登録番号：'+esc(DB.settings.regNumber)+'</div>'):"";
  w.document.write('<html><head><meta charset="utf-8"><title>領収書</title><style>body{font-family:-apple-system,sans-serif;padding:28px;color:#1f2624} .t{text-align:center;font-size:22px;font-weight:600;letter-spacing:6px;border-bottom:2px solid #1f2624;padding-bottom:8px} .to{font-size:18px;margin:24px 0 6px;border-bottom:1px solid #ccc;padding-bottom:6px} .amt{font-size:30px;font-weight:700;text-align:center;margin:18px 0;border:1px solid #ccc;padding:12px;border-radius:8px} .row{font-size:14px;margin:4px 0} .ft{margin-top:30px;text-align:right;font-size:14px} button{margin-top:24px;padding:10px 18px;font-size:14px}</style></head><body>'
    +'<div class="t">領 収 書</div>'
    +'<div class="to">'+esc(to)+'</div>'
    +'<div class="amt">'+yen(rec.amount)+'</div>'
    +'<div class="row">但し：'+esc(rec.menu||"施術")+'代として</div>'
    +'<div class="row">日付：'+esc(b.date)+'</div>'
    +'<div class="ft"><div style="font-weight:600">'+esc(DB.settings.bizName||"")+'</div>'+reg+'</div>'
    +'<div style="text-align:center"><button onclick="window.print()">印刷 / PDF保存</button></div>'
    +'</body></html>'); w.document.close();
}

function kindOpts(sel){ return ["個人","施設","病院","その他"].map(function(k){return '<option'+((sel||"個人")===k?" selected":"")+'>'+k+'</option>';}).join(""); }

function clientForm(clId){

function saveClient(clId){
  var name=document.getElementById("clName").value.trim(); if(!name){toast("名称を入力してください");return;}
  var data={kind:document.getElementById("clKind").value,name:name,address:document.getElementById("clAddr").value,phone:document.getElementById("clPhone").value,
    billing:document.getElementById("clBill").value,payMethod:document.getElementById("clPay").value,rules:document.getElementById("clRules").value};
  if(clId){ var c=clientOf(clId); for(var k in data) c[k]=data[k]; }
  else { data.id=uid(); data.note=""; DB.clients.push(data); }
  saveDB(); closeModal(); go("customers"); toast(clId?"更新しました":"顧客先を追加しました");
}
function delClient(clId){
  if(confirm("この顧客先と、利用者・予約もすべて削除します。よろしいですか？")){
    DB.clients=DB.clients.filter(function(x){return x.id!==clId;});
    var mids=membersOf(clId).map(function(m){return m.id;});
    DB.members=DB.members.filter(function(m){return m.clientId!==clId;});
    var bids=DB.bookings.filter(function(b){return b.clientId===clId;}).map(function(b){return b.id;});
    DB.bookings=DB.bookings.filter(function(b){return b.clientId!==clId;});
    DB.records=DB.records.filter(function(r){return bids.indexOf(r.bookingId)<0 && mids.indexOf(r.memberId)<0;});
    saveDB(); closeModal(); render(); toast("削除しました");
  }
}

/* ============================================================
   利用者（member）フォーム
   ============================================================ */
function genderOpts(sel){ return ["未選択","女性","男性","その他"].map(function(g){return '<option'+((sel||"未選択")===g?" selected":"")+'>'+g+'</option>';}).join(""); }
function staffOptsHtml(sel){ return '<option value="">（未設定）</option>'+DB.staff.map(function(s){return '<option value="'+s.id+'"'+(s.id===sel?" selected":"")+'>'+esc(s.name)+'</option>';}).join(""); }
function consentOpts(sel){ return ["未","同意済","不要"].map(function(g){return '<option'+((sel||"未")===g?" selected":"")+'>'+g+'</option>';}).join(""); }
function memberHistory(mid){
  var rows=DB.records.filter(function(r){return r.memberId===mid;}).map(function(r){var b=DB.bookings.find(function(x){return x.id===r.bookingId;});return {date:b?b.date:"",menu:r.menu,amount:r.amount,staff:r.staffId};}).sort(function(a,b){return (b.date||"").localeCompare(a.date||"");});
  if(!rows.length) return '<div style="font-size:13px;color:var(--muted)">まだ施術履歴はありません。</div>';
  return rows.slice(0,12).map(function(r){return '<div class="list-row"><span>'+esc(r.date)+' '+esc(r.menu||"")+(r.staff?' <span style="color:var(--muted)">/'+esc(staffName(r.staff))+'</span>':'')+'</span><span>'+yen(r.amount)+'</span></div>';}).join("");
}
function memberForm(clId,mid){
  photoBuf={}; var m=mid?memberOf(mid):{}; var isEdit=!!mid; var age=ageOf(m.birth); var ageTxt=age!==""?"（"+age+"歳）":""; var due=nextDue(m);
  openModal('<h2>'+(isEdit?'利用者を編集':'利用者を追加')+' <span style="font-size:13px;color:var(--muted)">'+esc(clientName(clId))+'</span></h2>'
    +'<div class="sec-title" style="margin:6px 0 0">基本</div>'
    +'<label>お名前</label><input id="mName" value="'+esc(m.name||"")+'">'
    +'<label>フリガナ</label><input id="mKana" value="'+esc(m.kana||"")+'">'
    +'<div class="row-2"><div><label>性別</label><select id="mGender">'+genderOpts(m.gender)+'</select></div><div><label>生年月日 <span style="color:var(--accent-text)">'+ageTxt+'</span></label><input type="date" id="mBirth" value="'+esc(m.birth||"")+'"></div></div>'
    +'<div class="sec-title">連絡先</div><label>電話</label><input type="tel" id="mPhone" value="'+esc(m.phone||"")+'"><label>住所</label><input id="mAddr" value="'+esc(m.address||"")+'">'
    +'<div class="sec-title">担当・周期</div><label>担当（半固定：通常この人。予約ごと変更可）</label><select id="mStaff">'+staffOptsHtml(m.staffId)+'</select>'
    +'<div class="row-2"><div><label>来店周期（週）</label><input type="number" inputmode="numeric" id="mCycle" value="'+(m.cycleWeeks||"")+'" placeholder="4"></div><div><label>&nbsp;</label><div style="font-size:13px;padding:11px 0;color:var(--accent-text)">'+(due?"次回目安 "+due:'<span style="color:var(--hint)">履歴で表示</span>')+'</div></div></div>'
    +'<div class="sec-title">施術（受付・入力時に自動表示）</div><label>定番メニュー</label><input id="mMenu" value="'+esc(m.menu||"")+'"><label>通常価格（円）</label><input type="number" inputmode="numeric" id="mPrice" value="'+(m.price||"")+'">'
    +'<div class="sec-title">契約</div><label>同意書</label><select id="mConsent">'+consentOpts(m.consent)+'</select>'
    +'<div class="sec-title">安全・配慮</div><label>配慮・注意事項</label><textarea id="mCare" placeholder="車椅子 / アレルギー / ペースメーカー 等">'+esc(m.care||"")+'</textarea>'
    +'<div class="sec-title">スタイル写真</div>'+photoSlot("mem",m.photo,"現在のヘアスタイル")
    +'<div class="sec-title">その他</div><label>緊急連絡先（家族・ケアマネ等）</label><input id="mEmg" value="'+esc(m.emergency||"")+'"><label>メモ</label><textarea id="mNote">'+esc(m.note||"")+'</textarea>'
    +(isEdit?'<div class="sec-title">施術履歴</div><div class="card">'+memberHistory(mid)+'</div>':'')
    +'<button class="btn primary" onclick="saveMember(\''+clId+'\','+(mid?'\''+mid+'\'':'null')+')">保存</button>'
    +(isEdit?'<button class="btn danger" onclick="delMember(\''+mid+'\')">この利用者を削除</button>':'')
    +'<button class="btn ghost" onclick="closeModal()">キャンセル</button>');
  setTimeout(function(){var e=document.getElementById("mName"); if(e&&!isEdit)e.focus();},50);
}
function gv(id){var e=document.getElementById(id);return e?e.value.trim():"";}
function saveMember(clId,mid){
  var name=gv("mName"); if(!name){toast("お名前を入力してください");return;}
  var data={name:name,kana:gv("mKana"),gender:gv("mGender"),birth:gv("mBirth"),phone:gv("mPhone"),address:gv("mAddr"),staffId:gv("mStaff"),
    cycleWeeks:Number(gv("mCycle"))||0,menu:gv("mMenu"),price:Number(gv("mPrice"))||0,consent:gv("mConsent"),care:gv("mCare"),emergency:gv("mEmg"),note:gv("mNote")};
  if(photoBuf.mem!==undefined) data.photo=photoBuf.mem;
  if(mid){ var m=memberOf(mid); for(var k in data) m[k]=data[k]; }
  else { data.id=uid(); data.clientId=clId; DB.members.push(data); }
  if(saveDB()){ toast(mid?"更新しました":"利用者を追加しました"); closeModal(); render(); }
}
function delMember(mid){ if(confirm("この利用者を削除しますか？")){ DB.members=DB.members.filter(function(m){return m.id!==mid;}); saveDB(); closeModal(); render(); toast("削除しました"); } }

/* ============================================================
   設定：事業者・担当・データ
   ============================================================ */
function bizForm(){
  openModal('<h2>事業者情報</h2>'
    +'<label>事業者名・屋号</label><input id="bName" value="'+esc(DB.settings.bizName||"")+'">'
    +'<label>登録番号（インボイス）</label><input id="bReg" value="'+esc(DB.settings.regNumber||"")+'" placeholder="T0000000000000">'
    +'<label>利用モード</label><select id="bMode"><option value="solo"'+(DB.settings.mode==="solo"?" selected":"")+'>フリーランス（シンプル）</option><option value="org"'+(DB.settings.mode==="org"?" selected":"")+'>組織（スタッフ管理あり）</option></select>'
    +'<button class="btn primary" onclick="saveBiz()">保存</button><button class="btn ghost" onclick="closeModal()">キャンセル</button>');
}
function saveBiz(){ var v=gv("bName"); if(!v){toast("名称を入力してください");return;} DB.settings.bizName=v; DB.settings.regNumber=gv("bReg"); DB.settings.mode=document.getElementById("bMode").value; saveDB(); closeModal(); render(); toast("更新しました"); }
function staffForm(){ openModal('<h2>担当を追加</h2><label>お名前</label><input id="stName"><button class="btn primary" onclick="saveStaff()">保存</button><button class="btn ghost" onclick="closeModal()">キャンセル</button>'); setTimeout(function(){var e=document.getElementById("stName");if(e)e.focus();},50); }
function saveStaff(){ var n=gv("stName"); if(!n){toast("お名前を入力してください");return;} DB.staff.push({id:uid(),name:n}); saveDB(); closeModal(); render(); toast("担当を追加しました"); }
function delStaff(sid){ if(confirm("この担当を削除しますか？（過去の記録は残ります）")){ DB.staff=DB.staff.filter(function(s){return s.id!==sid;}); saveDB(); render(); toast("削除しました"); } }
function exportJSON(){ var b=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}); var a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="houmon_backup.json"; a.click(); }
function resetDB(){ if(confirm("すべてのデータを消去し、最初のセットアップに戻します。よろしいですか？")){ localStorage.removeItem(STORE_KEY); DB=emptyDB(); saveDB(); boot(); } }

/* ============================================================
   起動
   ============================================================ */
function boot(){
  if(!DB.settings||!DB.settings.ready){ document.getElementById("topbar").style.display="none"; document.getElementById("tabs").style.display="none"; document.getElementById("view").innerHTML=""; setupForm(); return; }
  document.getElementById("topbar").style.display="block"; document.getElementById("tabs").style.display="flex"; go("today");
}
boot();
</script>
